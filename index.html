function selNode(i){main.querySelectorAll('.node').forEach(m=>m.classList.toggle('sel',+m.dataset.i===i))}
function mapPanel(i){
  const st=STOPS[i],p=$('#mpanel');let body;
  if(i===0&&S.reached<0){
    const b=CAMP.bienvenida||{};
    const lead=esDemo()&&b.leadDemo?b.leadDemo:b.lead||'';
    body=`<p class="kicker">Prólogo · ${TRAVEL[0].ref}</p><h2>${TRAVEL[0].title}</h2>
    <p class="lead">Bienvenido, ${esc(PROFILE.name)}. ${lead} Entre estación y estación, el narrador te contará con escenas animadas la historia que las une.</p>
    <p class="note">El juego tiene música instrumental suave, sonidos de ambiente y narración por voz. Puedes ajustar cada uno con el botón Ajustes.</p>
    <div class="actions"><button class="btn" id="go">Comenzar el viaje</button></div>`;
  }else if(st.soon){
    const can=unlocked(i);
    const note=st.completo?`<p class="note">Esta estación forma parte del juego completo.</p>`:'';
    body=`<p class="kicker">Estación ${i+1} · ${st.book}</p><h2>${st.name}</h2><p class="lead">${st.intro}</p>${note}
    ${!can?`<p class="note">Completa «${STOPS[i-1].name}» para abrir este camino.</p>`:S.reached<i?`<div class="actions"><button class="btn" id="go">Continuar el camino</button></div>`:`<div class="actions"><button class="btn ghost" id="relato">Ver otra vez el relato del camino</button></div>`}`;
  }else{
    const id=st.id,open=unlocked(i),done=S.done[id],nw=wrongIn(st);
    const status=done?`Completada · mejor puntaje ${S.best[id]} talentos`:open?'Disponible':'Bloqueada';
    let acts='';
    if(!open)acts=`<p class="note">Completa «${STOPS[i-1].name}» para abrir este camino.</p>`;
    else if(S.reached<i)acts=`<div class="actions"><button class="btn" id="go">Continuar el camino</button></div>`;
    else acts=`<div class="actions"><button class="btn" id="enter">${done?'Volver a jugar':'Entrar a la estación'}</button>${nw?`<button class="btn ghost" id="repaso">Repasar errores (${nw})</button>`:''}<button class="btn ghost" id="relato">Ver otra vez el relato</button></div>`;
    body=`<p class="kicker">Estación ${i+1} · ${st.book}</p><h2>${st.name}</h2><p class="lead">${st.intro}</p>
    <dl class="facts"><div><dt>Estado</dt><dd>${status}${done?' '+starsHTML(S.stars[id]||0,'sm'):''}</dd></div><div><dt>Preguntas</dt><dd>${correctIn(st)} de ${st.qs.length} respondidas bien${nw?` · ${nw} por repasar`:''}</dd></div><div><dt>Secretos</dt><dd>${solvedIn(st)} de ${st.secrets.length} misterios resueltos${S.found[id]?' · tesoro hallado':''}</dd></div><div><dt>Relato</dt><dd>${S.heard[i]?'Escuchado completo':'Pendiente'}</dd></div><div><dt>Insignia</dt><dd><span class="mini-medal ${S.badges[id]?'':'off'}">${st.letter}</span>${st.badge}</dd></div></dl>${acts}`;
  }
  /* Al final del camino: el epílogo */
  if(CAMP.epilogo&&CH.length===CAMP.estaciones.length&&i===CH.length-1&&S.done[st.id])
    body+=`<div class="actions"><button class="btn ghost" id="epi">${S.heard.epi?'Ver otra vez el final del camino':'Ver el final del camino'}</button></div>`;
  p.innerHTML=body+rulesHTML();
  const on=(id,fn)=>{const b=$('#'+id);if(b)b.onclick=fn};
  on('go',()=>travel(i));on('relato',()=>travel(i));on('enter',()=>viewChapter(i));on('repaso',()=>viewChapter(i,'repaso'));on('epi',()=>playEpilogue());
}
function mapRun(sel){
  M={svg:$('#msvg'),page:mapaDe(sel),vb:[0,0,1000,620],focus:null,zoomW:540,seg:null,f:0,ft:0,len:0,speed:.3,busy:false,last:performance.now(),tok:$('#tok'),trail:$('#trail'),dark:$('#mdark'),tm:[],walkDone:null};
  const at=Math.min(S.reached,STOPS.length-1);
  if(at>=0&&mapaDe(at)===M.page)showTok(STOPS[at].map,false);
  M.raf=requestAnimationFrame(mapLoop);
}
function mapLater(fn,ms){if(!M)return;M.tm.push(setTimeout(()=>{if(M)fn()},ms))}
function stopMap(){if(M){cancelAnimationFrame(M.raf);M.tm.forEach(clearTimeout)}M=null;vigStop();if(TR){stopSnd(TR);TR=null}}
function showTok([x,y],pop){if(!M)return;const t=M.tok;t.setAttribute('transform',`translate(${x} ${y-30})`);t.style.visibility='visible';if(pop){t.classList.remove('pop');t.getBoundingClientRect();t.classList.add('pop');setTimeout(()=>t.classList.remove('pop'),1500)}}
function fitVB([x,y],w){const h=w*.62;return[cl(x-w/2,0,1000-w),cl(y-h/2,0,620-h),w,h]}
function mapLoop(now){
  if(!M)return;const dt=Math.min(.05,(now-M.last)/1000);M.last=now;
  if(M.seg){
    if(M.f<M.ft)M.f=Math.min(M.ft,M.f+dt*(REDUCED?1:M.speed));
    const p=M.seg.getPointAtLength(M.f*M.len),lift=30*Math.max(0,M.f*6-5);
    M.tok.setAttribute('transform',`translate(${p.x.toFixed(1)} ${(p.y-lift).toFixed(1)})`);
    M.trail.style.strokeDashoffset=(M.len*(1-M.f)).toFixed(1);
    if(TR)TR.moving=M.f<M.ft-.002;
    M.focus=[p.x,p.y];
    if(M.f>=1&&M.walkDone){const f=M.walkDone;M.walkDone=null;f()}
  }
  const tgt=M.focus?fitVB(M.focus,M.zoomW):[0,0,1000,620];
  const k=Math.min(1,dt*(REDUCED?6:1.6));let moved=false;
  for(let j=0;j<4;j++){const d=tgt[j]-M.vb[j];if(Math.abs(d)>.25){M.vb[j]+=d*k;moved=true}else M.vb[j]=tgt[j]}
  if(moved)M.svg.setAttribute('viewBox',M.vb.map(v=>v.toFixed(1)).join(' '));
  M.raf=requestAnimationFrame(mapLoop);
}

/* ---------- Viñetas sobre el mapa: relatos del camino y epílogo ---------- */
function vigOverlay(rel,onLine,onDone){
  const sc=rel.scenes,box=$('#mapbox'),ov=$('#vig'),subs=$('#msubs');
  setMusic('cine');if(TR)stopSnd(TR);TR=travelSound();
  box.classList.add('cine');ov.classList.add('on');subs.textContent='';subs.classList.add('on');
  vigStart();
  narrate(sc.map(s=>s.t),(k,instant)=>{
    if(!M)return;vigShow(sc,k,instant);
    if(!instant){typeInto(subs,sc[k].t);if(TR){TR.setAmb(sc[k].amb);TR.setRep(sc[k].rep);if(sc[k].snd)TR.once(sc[k].snd)}}
    onLine(k);
  },onDone);
}
function vigOverlayEnd(){$('#mapbox').classList.remove('cine');$('#vig').classList.remove('on');$('#msubs').classList.remove('on');mapLater(vigStop,1100)}

/* ---------- Relato del camino: viñetas animadas + narrador, luego la caminata en el mapa ---------- */
function relatoPanel(tr,k,head,acts,dest){
  const n=tr.scenes.length,past=tr.scenes.slice(0,k).map(s=>`<li>${s.t}</li>`).join('');
  return `<p class="kicker">${head} · ${tr.ref}</p><h2>${tr.title}</h2>
  <div class="prog"><span>Escena ${k+1} de ${n}</span><span class="dots" aria-hidden="true">${tr.scenes.map((_,j)=>`<i class="${j<k?'d':j===k?'c':''}"></i>`).join('')}</span></div>
  ${past?`<ol class="tale">${past}</ol>`:'<p class="story">Mira la escena. El narrador cuenta la historia.</p>'}
  <div class="actions" id="tact">${acts}</div>${dest?`<p class="note">${dest}</p>`:''}`}
function travelPanel(i,k,walking){
  const tr=TRAVEL[i],st=STOPS[i],n=tr.scenes.length,p=$('#mpanel');if(!p)return;
  if(walking){
    p.innerHTML=`<p class="kicker">Relato del camino · ${tr.ref}</p><h2>${tr.title}</h2><p class="note">Camino a ${st.place}…</p>
    <ol class="tale">${tr.scenes.map(s=>`<li>${s.t}</li>`).join('')}</ol><div class="actions" id="tact"><button class="btn ghost" id="tarr">Llegar ya</button></div><p class="note">Destino: ${st.place} · ${st.name}</p>`;
  }else p.innerHTML=relatoPanel(tr,k,'Relato del camino',`<button class="btn" id="tnext">${k===n-1?'Ir al mapa':'Siguiente escena'}</button><button class="btn ghost" id="tskip">Saltar relato</button>`,`Destino: ${st.place} · ${st.name}`);
  const a=$('#tnext');if(a)a.onclick=()=>narNext(NAR);
  const b=$('#tskip');if(b)b.onclick=()=>narSkip();
  const c=$('#tarr');if(c)c.onclick=()=>{if(!M)return;M.tm.forEach(clearTimeout);M.tm=[];if(M.seg){M.f=1;M.ft=1}else arrive(i,M.skipped)};
}
function travel(i){
  if(i>=STOPS.length)return playEpilogue();
  if(view!=='map'||!M||M.page!==mapaDe(i))viewMap(i);
  stopNarration();M.tm.forEach(clearTimeout);M.tm=[];
  M.busy=true;M.seg=null;M.focus=null;M.walkDone=null;selNode(i);
  /* Debajo de las viñetas, el mapa se prepara para la caminata */
  if(iniciaPagina(i)){const d=M.dark;d.style.transition='none';d.style.opacity='1';d.getBoundingClientRect();d.style.transition='';M.tok.style.visibility='hidden'}
  else showTok(STOPS[i-1].map,false);
  vigOverlay(TRAVEL[i],k=>travelPanel(i,k,false),skipped=>travelWalk(i,skipped));
  travelPanel(i,0,false);
}
function travelWalk(i,skipped){
  if(!M)return;M.skipped=skipped;
  vigOverlayEnd();
  setMusic('map');if(TR){TR.setRep(null);TR.setAmb('wind')}
  travelPanel(i,0,true);
  if(iniciaPagina(i)){
    mapLater(()=>{M.dark.style.opacity='0';if(TR)TR.once('shimmer')},600);
    mapLater(()=>{M.focus=STOPS[i].map;M.zoomW=520;showTok(STOPS[i].map,true)},2400);
    mapLater(()=>arrive(i,skipped),4200);
  }else{
    const seg=$('#seg'+(i-1));M.seg=seg;M.len=seg.getTotalLength();M.f=0;M.ft=0;M.zoomW=520;M.speed=skipped?.7:.3;
    M.trail.setAttribute('d',seg.getAttribute('d'));M.trail.style.strokeDasharray=M.len;M.trail.style.strokeDashoffset=M.len;M.trail.style.visibility='visible';
    M.tok.style.visibility='visible';
    mapLater(()=>{M.ft=1;M.walkDone=()=>arrive(i,skipped)},900);
  }
}
function arrive(i,skipped){
  if(!M||M.arrived===i&&!M.busy)return;
  M.tm.forEach(clearTimeout);M.tm=[];M.dark.style.opacity='0';M.arrived=i;
  S.reached=Math.max(S.reached,i);
  if(!skipped){S.heard[i]=true;logro('relatos')}
  save();if(TR){stopSnd(TR);TR=null}
  M.seg=null;M.trail.style.visibility='hidden';
  if(i>0){const sg=$('#seg'+(i-1));if(sg)sg.classList.add('done')}
  showTok(STOPS[i].map,true);M.focus=STOPS[i].map;M.zoomW=520;
  mapLater(()=>{M.focus=null},1800);
  M.busy=false;
  const st=STOPS[i],act=$('#tact');if(!act)return;
  const note=$('#mpanel .note');if(note&&/Camino a/.test(note.textContent))note.textContent=`Llegaste a ${st.place}.`;
  if(st.soon)act.innerHTML=`<button class="btn ghost" id="tback">Ver ficha de la estación</button>`;
  else act.innerHTML=`<button class="btn" id="enter">Entrar a la estación</button><button class="btn ghost" id="tback">Ver ficha</button>`;
  const e=$('#enter');if(e){e.onclick=()=>viewChapter(i);e.focus({preventScroll:true})}
  $('#tback').onclick=()=>mapPanel(i);
}

/* ---------- Epílogo: el final del camino de la campaña ---------- */
function playEpilogue(){
  const ep=CAMP.epilogo,last=CH.length-1;if(!ep)return viewMap(last);
  if(view!=='map'||!M||M.page!==mapaDe(last))viewMap(last);
  stopNarration();M.tm.forEach(clearTimeout);M.tm=[];M.busy=true;M.focus=null;
  const panel=k=>{const p=$('#mpanel');if(!p)return;const n=ep.scenes.length;
    p.innerHTML=relatoPanel(ep,k,'Final del camino',`<button class="btn" id="tnext">${k===n-1?'Terminar':'Siguiente escena'}</button><button class="btn ghost" id="tskip">Saltar</button>`);
    $('#tnext').onclick=()=>narNext(NAR);$('#tskip').onclick=()=>narSkip()};
  vigOverlay(ep,panel,skipped=>{
    if(!M)return;vigOverlayEnd();setMusic('map');if(TR){stopSnd(TR);TR=null}M.busy=false;
    if(!skipped){S.heard.epi=true;save()}
    epilogueEnd();
  });
  panel(0);
}
function epilogueEnd(){
  const p=$('#mpanel');if(!p)return;const m=summary(S),other=CAMPANAS.find(c=>c!==CAMP&&campanaAbierta(c)),ep=CAMP.epilogo;
  p.innerHTML=`<p class="kicker">Fin del ${CAMP.nombre}</p><h2>${ep.cierre||'El camino continúa'}</h2>
  <p class="lead">${ep.texto||''}</p>
  <div class="tally"><div><b>${m.stations}</b><span>estaciones</span></div><div><b>${m.talents}</b><span>talentos</span></div><div><b>${m.badges}</b><span>insignias de ${BADGES.length}</span></div></div>
  <div class="actions">${other?`<button class="btn" id="otra">Ir al ${other.nombre}</button>`:''}<button class="btn ghost" id="vmap">Ver el mapa</button><button class="btn ghost" id="vins">Ver mis insignias</button></div>`;
  const o=$('#otra');if(o)o.onclick=()=>cambiarCampana(other.id);
  $('#vmap').onclick=()=>viewMap(CH.length-1);$('#vins').onclick=()=>openBadges();
}

</script>
<script>
/* ---- js/estacion.js ---- */
/* ============ Estación: escena, pruebas, pregunta secreta y repaso ============
   Fases (cur.phase): cine → ready → q (cinco pruebas) → secret (si halló el tesoro) → end, o fail si se apagan las lámparas.
   Modos (cur.mode):
     juego   la estación normal: reloj, lámparas, talentos, tesoro y estrellas
     repaso  las preguntas que el peregrino falló en la estación, sin reloj ni lámparas
   Tipos de pregunta (q.tipo): opción múltiple (sin tipo, 'quien', 'completa'), 'orden' y 'unir'. */
const LAMP=`<svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M15.5 4c1.4 1.9 1.6 3.3-.2 5.1-1.7-1.8-1.4-3.2.2-5.1z"/><path class="bd" d="M2 14.2c0-1.6 4.3-2.9 9.5-2.9 3 0 5.6.4 7.3 1.1l3.2-1.4-1.6 3.6c-.5 1.9-4.3 3.4-8.9 3.4-1.9 0-3.7-.3-5.1-.7L3.5 19l.7-3.1C2.8 15.4 2 14.8 2 14.2z"/></svg>`;
const TIPOS={quien:'¿Quién lo dijo?',completa:'Completa el versículo',orden:'Ordena los sucesos',unir:'Une las parejas'};
const esLista=q=>q.tipo==='orden'||q.tipo==='unir';
const calma=()=>!!(PROFILE&&PROFILE.calm);

/* Elige 5 preguntas del nivel del peregrino, primero las que menos ha visto.
   Si el nivel tuviera menos de 5, completa con el resto de la estación. */
function pickQs(c){const n=LVL();let pool=c.qs.filter(q=>inLevel(q,n));
  if(pool.length<5)pool=c.qs.slice();
  const list=pool.map(q=>({q,id:q.id,n:S.seen[q.id]||0,r:Math.random()}));list.sort((a,b)=>a.n-b.n||a.r-b.r);
  const sel=list.slice(0,5);sel.forEach(x=>S.seen[x.id]=x.n+1);save();return sel.map(x=>x.q)}
/* Repaso: hasta 5 de las preguntas falladas, de cualquier nivel */
function pickRepaso(c){return shuffle(c.qs.filter(q=>S.wrong[q.id])).slice(0,5)}
/* Elige el misterio: primero los que no has resuelto */
function pickSecret(c){const list=c.secrets.map(q=>({q,id:q.id,sol:S.solvedQ[q.id]?1:0,r:Math.random()}));list.sort((a,b)=>a.sol-b.sol||a.r-b.r);return Object.assign({id:list[0].id},list[0].q)}

function viewChapter(i,mode){
  stopAll();view='chapter';const c=CH[i];mode=mode||'juego';
  const qs=mode==='repaso'?pickRepaso(c):pickQs(c);if(!qs.length)return viewMap(i);
  cur={i,c,mode,lvl:LVL(),qs,qi:0,lamps:LVL().lamps,score:0,lost:false,phase:'cine',shot:0,found:false,newB:[],q:null,picked:null,hint:false,secretOk:null,wasSolved:false,ok:0};
  main.innerHTML=`<section class="play"><div class="stagewrap"><div class="stage film" id="stageBox"><canvas id="stage" role="img" aria-label="Escena animada de ${c.place}"></canvas><div class="subs" id="subs" aria-live="polite"></div><div class="cap">${c.place} · ${c.book}</div><div class="found-tag" id="foundTag" hidden>Tesoro hallado</div></div><p class="stage-note">${mode==='repaso'?'Repaso de errores: sin reloj ni lámparas. Lo que respondas bien sale de la lista de repaso.':'Durante las pruebas, algo escondido brilla de vez en cuando en la escena. Tócalo para abrir la pregunta secreta del final.'}</p></div><div class="panel" id="qp"></div></section>`;
  $('#qp').addEventListener('click',onPanel);
  startScene(c.id);
  if(mode==='repaso'){cur.phase='ready';SC.v=Object.assign({},sceneV0(c.id));SC.vt=Object.assign({},SC.v);setCam([1,.5,.5],0);setMusic('quiz');ambLevel(.4);renderQ()}
  else playCine();
  updateHeader();window.scrollTo(0,0);
}
function playCine(){
  stopNarration();const c=cur.c,sh=c.shots;
  cur.phase='cine';cur.shot=0;
  $('#stageBox').classList.add('cine');const subs=$('#subs');subs.textContent='';subs.classList.add('on');
  SC.v=Object.assign({},sceneV0(c.id),sh[0].v||{});SC.vt=Object.assign({},SC.v);
  const c0=sh[0].cam;setCam([c0[0]*1.15,c0[1],c0[2]],0);
  setMusic('cine');ambLevel(1);renderQ();
  narrate(sh.map(s=>s.t),(k,instant)=>{
    if(!cur||!SC)return;cur.shot=k;const s=sh[k];
    if(s.v)Object.assign(SC.vt,s.v);
    if(instant){Object.assign(SC.v,SC.vt);setCam(s.cam,0)}else{setCam(s.cam,5200);if(s.ev&&SC.snd&&SC.snd.ev[s.ev])SC.snd.ev[s.ev]();if(s.quake)SC.quake=performance.now()+2600;typeInto(subs,s.t)}
    renderQ();
  },()=>cineDone());
}
function cineDone(){
  if(!cur||!SC)return;
  $('#stageBox').classList.remove('cine');$('#subs').classList.remove('on');
  cur.phase='ready';setCam([1,.5,.5],2000);SC.vt=Object.assign({},sceneV0(cur.c.id));
  setMusic('cine');ambLevel(.6);renderQ();
  const b=$('#qp [data-next]');if(b)b.focus({preventScroll:true});
  if(PROFILE&&!PROFILE.tut){PROFILE.tut=true;saveIdx();openTutorial()}
}
function playOutro(){
  const c=cur.c;if(!SC)return;
  const box=$('#stageBox'),subs=$('#subs');box.classList.add('cine');subs.classList.add('on');
  if(c.outroV)Object.assign(SC.vt,c.outroV);setCam(c.outroCam||[1.25,.5,.5],5000);
  if(c.outroEv&&SC.snd&&SC.snd.ev[c.outroEv])SC.snd.ev[c.outroEv]();
  typeInto(subs,c.outro);
  narrate([c.outro],()=>{},()=>{setTimeout(()=>{if(cur&&cur.phase==='end'){box.classList.remove('cine');subs.classList.remove('on')}},500)});
}

/* ---------- Preparar y responder una pregunta ---------- */
function setupQ(q){
  cur.q=q;cur.picked=null;cur.hint=false;cur.fixed=0;
  cur.voice=q.s||cur.c.voices[Math.floor(Math.random()*cur.c.voices.length)];
  if(q.tipo==='orden'){cur.items=shuffle(q.o.map((t,k)=>({t,k})));if(cur.items.every((x,k)=>x.k===k))cur.items.reverse();cur.sel=[]}
  else if(q.tipo==='unir'){cur.pairs=q.o.map(p=>p.split('|'));cur.right=shuffle(cur.pairs.map((p,k)=>({t:p[1],k})));cur.match=cur.pairs.map(()=>null);cur.row=0}
  else cur.opts=shuffle(q.o.map((t,k)=>({t,ok:k===0,gone:false})));
}
function onPanel(e){
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.k!=null)return pick(+d.k);
  if(d.it!=null)return pickItem(+d.it);
  if(d.ch!=null)return pickChip(+d.ch);
  if(d.row!=null)return pickRow(+d.row);
  if('confirm' in d)return confirmList();
  if('clear' in d)return clearList();
  if('next' in d)return next();
  if('cnext' in d)return narNext(NAR);
  if('cskip' in d)return narSkip();
  if('replay' in d)return playCine();
  if('hint' in d)return useHint();
  if('reveal' in d)return reveal();
  if('map' in d)return viewMap(cur?cur.i:undefined);
  if('retry' in d)return viewChapter(cur.i,cur.mode);
  if(d.travel!=null){const n=+d.travel;if(n<STOPS.length)viewMap(n);return travel(n)}
}
const answering=()=>cur&&cur.picked==null&&!cur.reading&&(cur.phase==='q'||cur.phase==='secret');
/* Pergamino: en opción múltiple tacha una opción falsa; en ordenar y unir deja fija la primera respuesta */
function useHint(){if(cur.hint||!answering())return;cur.hint=true;const q=cur.q;
  if(q.tipo==='orden'){cur.sel=[cur.items.findIndex(x=>x.k===0)];cur.fixed=1}
  else if(q.tipo==='unir'){cur.match=cur.match.map(()=>null);cur.match[0]=cur.right.findIndex(x=>x.k===0);cur.fixed=1;cur.row=1}
  else{const w=cur.opts.filter(o=>!o.ok&&!o.gone);if(w.length)w[Math.floor(Math.random()*w.length)].gone=true}
  renderQ()}
/* Ordenar: tocar un suceso lo agrega al final; tocar uno ya elegido lo quita junto con los que siguen */
function pickItem(k){if(!answering()||cur.q.tipo!=='orden')return;const at=cur.sel.indexOf(k);
  if(at>=0){if(at>=cur.fixed)cur.sel=cur.sel.slice(0,at)}else cur.sel.push(k);renderQ()}
/* Unir: tocar una fila la elige; tocar una opción de la derecha la pone en la fila elegida */
function pickRow(r){if(!answering()||cur.q.tipo!=='unir'||r<cur.fixed)return;if(cur.match[r]!=null&&cur.row===r)cur.match[r]=null;cur.row=r;renderQ()}
function pickChip(k){if(!answering()||cur.q.tipo!=='unir')return;
  const used=cur.match.indexOf(k);if(used>=0&&used<cur.fixed)return;if(used>=0)cur.match[used]=null;
  let r=cur.row;if(r==null||r<cur.fixed||r>=cur.match.length)r=cur.match.findIndex((m,j)=>m==null&&j>=cur.fixed);if(r<0)return;
  cur.match[r]=k;const nx=cur.match.findIndex((m,j)=>m==null&&j>=cur.fixed);cur.row=nx<0?null:nx;renderQ()}
function clearList(){if(!answering())return;if(cur.q.tipo==='orden')cur.sel=cur.sel.slice(0,cur.fixed);else{cur.match=cur.match.map((m,j)=>j<cur.fixed?m:null);cur.row=cur.fixed}renderQ()}
const listaCompleta=()=>cur.q.tipo==='orden'?cur.sel.length===cur.items.length:cur.match.every(m=>m!=null);
function confirmList(){if(!answering()||!listaCompleta())return;
  const ok=cur.q.tipo==='orden'?cur.sel.every((k,j)=>cur.items[k].k===j):cur.match.every((k,j)=>cur.right[k].k===j);
  answer(ok,0)}
/* k = -1: se acabó el tiempo sin responder */
function pick(k){
  if(!answering())return;
  if(k<0)return answer(false,-1);
  if(esLista(cur.q))return cur.q.tipo==='orden'?pickItem(k):pickChip(k);
  const o=cur.opts[k];if(!o||o.gone)return;answer(o.ok,k);
}
function answer(ok,k){
  cur.picked=k;cur.wasOk=ok;stopTimer();const q=cur.q;
  if(cur.phase==='q'){
    if(ok){cur.ok++;S.correct[q.id]=true;delete S.wrong[q.id];beep(SND.ok);
      if(cur.mode==='juego'){cur.score+=cur.lvl.pts-(cur.hint?cur.lvl.hintCost:0);streak++;if(streak>S.bestStreak)S.bestStreak=streak;logro('racha')}
      logro('sabio');logro('tipos');logro('profecia')}
    else{S.wrong[q.id]=true;beep(SND.bad);if(cur.mode==='juego'){cur.lamps--;cur.lost=true;streak=0}}
  }else{
    cur.secretOk=ok;
    if(ok){S.solvedQ[q.id]=true;beep(SND.secret);logro('secretos')}else beep(SND.bad);
  }
  save();renderQ();updateHeader();
  const n=$('#qp [data-next]');if(n)n.focus({preventScroll:true});
}
function next(){
  if(cur.phase==='ready'){cur.phase='q';cur.qi=0;setupQ(cur.qs[0]);setMusic('quiz');ambLevel(.28)}
  else if(cur.phase==='q'){
    if(cur.mode==='juego'&&cur.lamps<=0){cur.phase='fail';setMusic('cine');ambLevel(.4)}
    else if(cur.qi<cur.qs.length-1){cur.qi++;setupQ(cur.qs[cur.qi])}
    else if(cur.mode==='juego'&&cur.found){cur.phase='secret';const sq=pickSecret(cur.c);cur.wasSolved=!!S.solvedQ[sq.id];setupQ(sq)}
    else return finish();
  }else if(cur.phase==='secret')return finish();
  if(cur.phase==='q'||cur.phase==='secret')startReading();else stopTimer();
  renderQ();
}
function finish(){
  if(cur.mode==='repaso'){cur.phase='end';setMusic('map');ambLevel(.75);updateHeader();return renderQ()}
  const id=cur.c.id,st=cur.lvl.lamps-cur.lamps===0?3:cur.lvl.lamps-cur.lamps===1?2:1;
  S.done[id]=true;S.best[id]=Math.max(S.best[id]||0,cur.score);cur.stars=st;cur.newStars=st>(S.stars[id]||0);S.stars[id]=Math.max(S.stars[id]||0,st);save();cur.phase='end';
  setMusic('map');ambLevel(.75);
  award(id);logro('lampara');logro('todas');logro('estrellas');logro('alianzas');
  updateHeader();renderQ();playOutro();
}

/* ---------- Reloj de cada pregunta en dos fases ----------
   Lectura: la pregunta sola, sin reloj; las opciones aparecen según el largo del texto (2 a 5 s) o antes si el jugador quiere.
   Respuesta: el reloj del nivel corre desde que aparecen las opciones; al llegar a cero cuenta como error.
   Sin reloj en el repaso y en el modo tranquilo. Ordenar y unir tienen más tiempo. */
let QT=null,RT=null;
const conReloj=()=>cur&&cur.mode==='juego'&&!calma();
function stopTimer(){if(QT){clearInterval(QT.iv);QT=null}clearTimeout(RT);RT=null}
function startReading(){stopTimer();cur.reading=true;cur.readMs=cl(1000+300*cur.q.q.split(/\s+/).length,2000,5000);RT=setTimeout(reveal,cur.readMs)}
function reveal(){if(!cur||!cur.reading)return;cur.reading=false;if(conReloj())startTimer();renderQ()}
function startTimer(){stopTimer();const ms=cur.lvl.time*1000*(esLista(cur.q)?1.8:1);QT={end:performance.now()+ms,ms,last:null,iv:setInterval(tickTimer,100)};tickTimer()}
const timeLeft=()=>QT?Math.max(0,QT.end-performance.now()):0;
function timerHTML(){if(!QT)return conReloj()?'':`<div class="qtimer calm" aria-hidden="true"><span class="tl">${cur.mode==='repaso'?'Repaso':'Sin reloj'}</span></div>`;
  const l=timeLeft(),s=Math.ceil(l/1000);
  return `<div class="qtimer ${s<=3?'low':''}" id="qtimer" role="timer" aria-label="Tiempo para responder"><span class="bar"><i style="width:${(l/QT.ms*100).toFixed(1)}%"></i></span><b>${s}</b></div>`}
function tickTimer(){
  if(!QT)return;if(!cur||cur.picked!=null)return stopTimer();
  const l=timeLeft(),s=Math.ceil(l/1000),t=$('#qtimer');
  if(t){t.querySelector('i').style.width=(l/QT.ms*100).toFixed(1)+'%';t.querySelector('b').textContent=s;t.classList.toggle('low',s<=3)}
  if(s!==QT.last){if(QT.last!=null&&s>0&&s<=3)beep(SND.tick);QT.last=s}
  if(l<=0){stopTimer();pick(-1)}
}

/* ---------- Panel de la estación ---------- */
function renderQ(){
  const p=$('#qp'),c=cur.c,rep=cur.mode==='repaso';if(!p)return;
  $('.play').classList.toggle('quiz',cur.phase==='q'||cur.phase==='secret');
  const lamps=[...Array(cur.lvl.lamps).keys()].map(k=>`<span class="lamp ${k<cur.lamps?'':'off'}">${LAMP}</span>`).join('');
  const head=`<div class="qhead"><span class="kicker">${rep?'Repaso · ':''}Estación ${cur.i+1} · ${c.place}</span>${rep?'':`<span class="lamps" role="img" aria-label="${cur.lamps} de ${cur.lvl.lamps} lámparas encendidas">${lamps}</span>`}</div>`;
  let h='';
  if(cur.phase==='cine'){
    const n=c.shots.length,k=cur.shot,past=c.shots.slice(0,k).map(s=>`<li>${s.t}</li>`).join('');
    h=`<h2>${c.name}</h2><p class="note">${c.book}</p>
    <div class="prog"><span>Escena ${k+1} de ${n}</span><span class="dots" aria-hidden="true">${c.shots.map((_,j)=>`<i class="${j<k?'d':j===k?'c':''}"></i>`).join('')}</span></div>
    ${past?`<ol class="tale">${past}</ol>`:'<p class="story">Mira la escena. El narrador cuenta la historia.</p>'}
    <div class="actions"><button class="btn" data-cnext>${k===n-1?'Terminar la escena':'Siguiente escena'}</button><button class="btn ghost" data-cskip>Saltar a las pruebas</button></div>`;
  }else if(cur.phase==='ready'){
    h=rep?`<h2>Repaso: ${c.name}</h2><p class="lead">Tienes ${wrongIn(c)} ${wrongIn(c)===1?'pregunta':'preguntas'} por repasar en esta estación. Aquí no hay reloj ni lámparas: lee con calma, responde y mira la explicación.</p>
      <div class="actions"><button class="btn" data-next>Comenzar el repaso</button><button class="btn ghost" data-map>Mapa</button></div>`
    :`<h2>${c.name}</h2><p class="lead">${c.intro}</p><p class="note">${c.book}. Cinco pruebas de nivel ${cur.lvl.name} te esperan, elegidas entre ${c.qs.filter(q=>inLevel(q,cur.lvl)).length} preguntas de ese nivel en esta estación.${calma()?' Modo tranquilo: sin reloj.':''} Mientras respondes, busca en la escena un brillo escondido: es la llave de la pregunta secreta.</p>
    <div class="actions"><button class="btn" data-next>Comenzar las pruebas</button><button class="btn ghost" data-replay>Ver otra vez la escena</button><button class="btn ghost" data-map>Mapa</button></div>`;
  }else if(cur.phase==='q'||cur.phase==='secret'){
    h=questionHTML();
    if(cur.reading){p.innerHTML=head+h;showPanelEnd();return}
  }else if(cur.phase==='end'){
    if(rep)h=`<p class="kicker">Repaso terminado</p><h2>${c.name}</h2><p class="lead">Respondiste bien ${cur.ok} de ${cur.qs.length}. ${wrongIn(c)?`Te quedan ${wrongIn(c)} por repasar en esta estación.`:'No te queda nada por repasar aquí.'}</p>
      <div class="actions">${wrongIn(c)?'<button class="btn" data-retry>Seguir repasando</button>':''}<button class="btn ghost" data-map>Mapa</button></div>`;
    else{
      const sec=cur.found?(cur.secretOk?'Resuelto':'Fallido'):'No hallado';
      const earned=cur.newB.length?`<div class="earned"><h3>Insignias ganadas</h3><div class="earned-row">${cur.newB.map(id=>{const b=BADGES.find(x=>x.id===id);return `<div class="earned-b"><span class="medal sm">${b.letter}</span><span>${b.name}</span></div>`}).join('')}</div></div>`:'';
      const nextLbl=cur.i+1<STOPS.length?'Continuar el camino':CAMP.epilogo&&CH.length===CAMP.estaciones.length?'Ver el final del camino':'';
      h=`<p class="kicker">Estación completada</p><h2>${c.name}</h2><p class="lead">${c.outro}</p>
      <div class="tally"><div><b>${cur.score}</b><span>talentos de ${5*cur.lvl.pts}</span></div><div><b>${starsHTML(cur.stars)}</b><span>${cur.newStars?'nuevo récord de estrellas':'estrellas'}</span></div><div><b>${sec}</b><span>misterio</span></div></div>
      <p class="note">Llevas ${correctIn(c)} de ${c.qs.length} preguntas de esta estación respondidas bien. ${cur.stars<3?'Termina sin perder lámparas para ganar las tres estrellas. ':''}Si vuelves a jugarla, saldrán preguntas que aún no has visto.</p>
      ${!cur.found?`<p class="note">En esta escena había un tesoro escondido que no viste.</p>`:''}
      ${earned}
      <div class="actions">${nextLbl?`<button class="btn" data-travel="${cur.i+1}">${nextLbl}</button>`:''}<button class="btn ghost" data-retry>Jugar de nuevo</button><button class="btn ghost" data-map>Mapa</button></div>`;
    }
  }else if(cur.phase==='fail'){
    h=`<p class="kicker">Sin aceite</p><h2>Las lámparas se apagaron</h2><p class="lead">Te quedaste sin luz antes de terminar el camino. Lo que aprendiste no se pierde: vuelve a intentarlo con otras preguntas. Las que fallaste quedan para repasar desde la ficha de la estación.</p>
    <div class="actions"><button class="btn" data-retry>Intentar de nuevo</button><button class="btn ghost" data-map>Mapa</button></div>`;
  }
  p.innerHTML=head+h;
  if(cur.phase!=='cine')showPanelEnd();
}
function questionHTML(){
  const q=cur.q,sec=cur.phase==='secret',ans=cur.picked!=null,rep=cur.mode==='repaso';
  const top=sec?`<div class="secret-banner"><span class="heb" aria-hidden="true">סוד</span><div><b>Pregunta secreta</b><span class="s">Una sola oportunidad · ${cur.wasSolved?'ya la resolviste antes, no suma de nuevo':'+30 talentos'}</span></div></div>`
    :`<div class="prog"><span>${rep?'Repaso':'Prueba'} ${cur.qi+1} de ${cur.qs.length}</span><span class="dots" aria-hidden="true">${cur.qs.map((_,k)=>`<i class="${k<cur.qi?'d':k===cur.qi?'c':''}"></i>`).join('')}</span>${rep?'':`<span class="pts"><b>${cur.score}</b> talentos${cur.found?' · secreto desbloqueado':''}</span>`}</div>`;
  const tag=TIPOS[q.tipo]?`<p class="qtype">${TIPOS[q.tipo]}</p>`:'';
  if(cur.reading)return `${top}<div class="qtimer reading" aria-hidden="true"><span class="bar"><i style="animation-duration:${cur.readMs}ms"></i></span><span class="tl">Lectura</span></div>
    <p class="story">${cur.voice}</p>${tag}<p class="q">${q.q}</p><div class="actions"><button class="btn" data-reveal>Ver opciones</button></div>`;
  let body='';
  if(q.tipo==='orden')body=ordenHTML(ans);
  else if(q.tipo==='unir')body=unirHTML(ans);
  else body=`<div class="opts">${cur.opts.map((o,k)=>{let cls='opt';if(o.gone)cls+=' gone';if(ans){if(o.ok)cls+=' ok';else if(k===cur.picked)cls+=' bad'}
      return `<button class="${cls}" data-k="${k}" ${ans||o.gone?'disabled':''}><span class="k">${k+1}</span><span>${o.t}</span></button>`}).join('')}</div>`;
  let tail='';
  if(!ans){
    if(esLista(q))tail+=`<div class="actions"><button class="btn small" data-confirm ${listaCompleta()?'':'disabled'}>Confirmar</button><button class="btn ghost small" data-clear>Borrar</button></div>`;
    if(cur.hint)tail+=`<p class="hintline">Pergamino: busca en ${q.r}. ${q.tipo==='orden'?'El primer suceso quedó en su lugar.':q.tipo==='unir'?'La primera pareja quedó unida.':'Una opción falsa quedó tachada.'}</p>`;
    if(!sec&&!rep&&cur.lvl.hint)tail+=`<div class="actions"><button class="btn ghost small" data-hint ${cur.hint?'disabled':''}>${cur.hint?'Pergamino consultado':`Consultar el pergamino (${cur.lvl.hintCost?'−'+cur.lvl.hintCost:'gratis'})`}</button></div>`;
  }else{
    const late=cur.picked<0,ok=cur.wasOk;
    const verdict=ok?(sec?'¡Misterio resuelto!':'¡Correcto!'):late?'Se acabó el tiempo':(sec?'El misterio sigue oculto':'No es correcto');
    let warn='';if(!sec&&!ok&&!rep)warn=cur.lamps>0?`Se apagó una lámpara. Te quedan ${cur.lamps}.`:'Tu última lámpara se apagó.';
    if(!sec&&!ok&&rep)warn='Sigue en tu lista de repaso.';
    let right='';if(!ok){if(q.tipo==='orden')right=`<p><b>Orden correcto:</b></p><ol class="sol">${q.o.map(t=>`<li>${t}</li>`).join('')}</ol>`;
      else if(q.tipo==='unir')right=`<p><b>Parejas correctas:</b></p><ul class="sol">${cur.pairs.map(p=>`<li>${p[0]} → ${p[1]}</li>`).join('')}</ul>`;
      else if(late)right=`<p><b>Respuesta:</b> ${q.o[0]}</p>`}
    let label=rep?(cur.qi===cur.qs.length-1?'Terminar el repaso':'Siguiente'):'Siguiente prueba';
    if(sec)label='Terminar la estación';
    else if(!rep&&cur.lamps<=0)label='Continuar';
    else if(!rep&&cur.qi===cur.qs.length-1)label=cur.found?'Abrir la pregunta secreta':'Terminar la estación';
    tail=`<div class="feedback ${ok?'is-ok':'is-bad'}" role="status"><p class="verdict">${verdict}</p>${right}<p>${q.n}</p>${warn?`<p class="warn">${warn}</p>`:''}<p class="ref">${q.r}</p></div>
    <div class="actions"><button class="btn" data-next>${label}</button></div>`;
  }
  return `${top}${ans?'':timerHTML()+`<p class="story">${cur.voice}</p>`}${tag}<p class="q">${q.q}</p>${body}${tail}`;
}
function ordenHTML(ans){
  return `<div class="opts orden">${cur.items.map((it,k)=>{const at=cur.sel.indexOf(k);let cls='opt';
    if(ans)cls+=at===it.k?' ok':' bad';else if(at>=0)cls+=' picked';if(at>=0&&at<cur.fixed)cls+=' fixed';
    return `<button class="${cls}" data-it="${k}" ${ans?'disabled':''} aria-pressed="${at>=0}"><span class="k">${at>=0?at+1:'·'}</span><span>${it.t}</span></button>`}).join('')}</div>
    ${ans?'':`<p class="note">Toca los sucesos del primero al último. Para cambiar uno, tócalo otra vez.</p>`}`}
function unirHTML(ans){
  const rows=cur.pairs.map((p,j)=>{const m=cur.match[j],ok=m!=null&&cur.right[m].k===j;let cls='urow';if(!ans&&cur.row===j)cls+=' act';if(ans)cls+=ok?' ok':' bad';if(j<cur.fixed)cls+=' fixed';
    return `<button class="${cls}" data-row="${j}" ${ans?'disabled':''}><span class="ul">${p[0]}</span><span class="ur">${m!=null?cur.right[m].t:'…'}</span></button>`}).join('');
  const chips=ans?'':`<div class="chips">${cur.right.map((r,k)=>{const used=cur.match.indexOf(k)>=0;return `<button class="opt chip2${used?' used':''}" data-ch="${k}"><span class="k">${k+1}</span><span>${r.t}</span></button>`}).join('')}</div>
    <p class="note">Elige una fila y luego la opción que le corresponde.</p>`;
  return `<div class="unir">${rows}</div>${chips}`}
/* Si el panel no cabe entero (en pantallas angostas va bajo la escena), desplaza lo justo para que se vean las opciones o el botón de seguir */
function showPanelEnd(){const last=$('#qp').lastElementChild;if(last)last.scrollIntoView({block:'nearest',behavior:REDUCED?'auto':'smooth'})}

/* ---------- Teclado ---------- */
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}
  if(e.key==='Enter'&&NAR&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();narNext(NAR);return}
  if(view!=='chapter'||!cur)return;
  if(cur.reading&&(e.key==='Enter'||e.key===' ')){e.preventDefault();reveal();return}
  if(answering()&&/^[1-9]$/.test(e.key)){e.preventDefault();pick(+e.key-1);return}
  if(answering()&&esLista(cur.q)&&e.key==='Enter'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();confirmList();return}
  if(e.key==='Enter'&&document.activeElement?.tagName!=='BUTTON'){const b=$('#qp [data-next]');if(b){e.preventDefault();b.click()}}
});

</script>
<script>
/* ---- js/ventanas.js ---- */
/* ============ Ventanas: insignias y avance, ajustes, tutorial y elección de campaña ============ */
function abrirModal(html){const m=$('#modal');m.hidden=false;m.innerHTML=html;return m}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';m.onclick=null;$('#btnSound').focus({preventScroll:true})}

/* ---------- Insignias y estadísticas ---------- */
function openBadges(tab){
  tab=tab||'ins';
  const totalQ=CH.reduce((a,c)=>a+c.qs.length,0),n=LVL();
  const tabs=`<div class="tabs" role="tablist"><button role="tab" class="chip${tab==='ins'?' on':''}" aria-selected="${tab==='ins'}" data-tab="ins">Insignias</button><button role="tab" class="chip${tab==='est'?' on':''}" aria-selected="${tab==='est'}" data-tab="est">Mi avance</button></div>`;
  let body;
  if(tab==='ins')body=`<p class="note">${CAMP.alfabeto} Has respondido bien ${Object.keys(S.correct).length} de ${totalQ} preguntas distintas. Racha más larga: ${S.bestStreak} aciertos seguidos.</p>
  <div class="bgrid">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?'':'locked'}"><span class="medal">${b.letter}</span><b>${b.name}</b><span class="d">${b.desc}</span>${S.badges[b.id]?'<em>Obtenida</em>':''}</div>`).join('')}</div>`;
  else{
    const rows=STOPS.map((c,i)=>{if(c.soon)return `<tr class="soon"><td>${i+1}. ${c.name}</td><td colspan="5">${c.completo?'Juego completo':'Próximamente'}</td></tr>`;
      const lv=c.qs.filter(q=>inLevel(q,n)),ok=lv.filter(q=>S.correct[q.id]).length,seen=lv.filter(q=>S.seen[q.id]).length,pct=lv.length?Math.round(ok/lv.length*100):0;
      return `<tr><td>${i+1}. ${c.name}</td><td>${S.done[c.id]?starsHTML(S.stars[c.id]||0,'sm'):'—'}</td><td><span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span> ${ok} de ${lv.length}</td><td>${seen}</td><td>${wrongIn(c)||'—'}</td><td>${S.found[c.id]?'Sí':'—'} · ${solvedIn(c)}/${c.secrets.length}</td></tr>`}).join('');
    const lvAll=CH.flatMap(c=>c.qs.filter(q=>inLevel(q,n))),okAll=lvAll.filter(q=>S.correct[q.id]).length,stars=Object.values(S.stars).reduce((a,b)=>a+b,0);
    body=`<div class="tally"><div><b>${okAll}</b><span>de ${lvAll.length} preguntas de ${n.name} bien respondidas</span></div><div><b>${stars}</b><span>estrellas de ${CH.length*3}</span></div><div><b>${S.bestStreak}</b><span>racha más larga</span></div></div>
    <div class="tablewrap"><table class="stats"><thead><tr><th>Estación</th><th>Estrellas</th><th>Bien respondidas (${n.name})</th><th>Vistas</th><th>Por repasar</th><th>Tesoro · secretos</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const m=abrirModal(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bt">
  <div class="sheet-head"><div><p class="kicker">Avance de ${esc(PROFILE.name)} en ${n.name} · ${Object.keys(S.badges).length} de ${BADGES.length} insignias</p><h2 id="bt">${tab==='ins'?'Insignias':'Mi avance'} del ${CAMP.nombre}</h2></div><button class="chip" data-close>Cerrar</button></div>
  ${tabs}${body}
  <div class="sheet-foot"><button class="btn ghost small" data-reset>Reiniciar mi avance en ${n.name} (${CAMP.nombre})</button></div></div>`);
  m.querySelector(`[data-tab="${tab}"]`).focus();
  let armed=false;
  m.onclick=e=>{
    if(e.target===m||e.target.closest('[data-close]'))return closeModal();
    const t=e.target.closest('[data-tab]');if(t)return openBadges(t.dataset.tab);
    const r=e.target.closest('[data-reset]');
    if(r){if(!armed){armed=true;r.textContent=`Toca otra vez para borrar tu avance en ${n.name} del ${CAMP.nombre}`}else{S=fresh();save();streak=0;closeModal();viewMap()}}
  };
}

/* ---------- Ajustes: sonido, lectura y juego ---------- */
function voiceOptions(){
  if(!VO.all.length)return '';
  const lat=VO.all.filter(isLatam),rest=VO.all.filter(v=>!isLatam(v));
  const opt=v=>`<option value="${esc(v.name)}" ${VO.v&&v.name===VO.v.name?'selected':''}>${esc(voiceLabel(v))}</option>`;
  return `<select id="optVoiceName">${lat.length?`<optgroup label="Latinoamérica">${lat.map(opt).join('')}</optgroup>`:''}${rest.length?`<optgroup label="Otras">${rest.map(opt).join('')}</optgroup>`:''}</select>`;
}
function voiceNote(){

  if(!('speechSynthesis' in window)||!VO.all.length)return 'Este navegador no tiene voces en español. El relato se mostrará como texto.';
  if(!VO.all.some(v=>/natural|online|neural/i.test(v.name)))return 'Este navegador solo tiene voces básicas, que suenan robóticas. Para voces humanas latinoamericanas abre el juego en Microsoft Edge (aparecen como «natural»), o genera la narración grabada con generar_voz.py.';

 tablas:`<path d="M8 38V18a6 6 0 0 1 12 0v20zM28 38V18a6 6 0 0 1 12 0v20z" fill="${AF}"/><path d="M11 22h6M11 26h6M11 30h6M31 22h6M31 26h6M31 30h6" stroke="#8a6a2a" stroke-width="1.5"/>`,

   <div class="cprev" aria-hidden="true"><div id="cprevav">${avatarSVG(av,'av xl')}</div><b id="cprevname">Peregrino</b><span class="note">Así te verás en el camino</span></div>
   <form class="panel" id="cform" novalidate>
    <p class="kicker">${first?'Antes de empezar':'Nuevo peregrino'}</p><h2>¿Cómo te llamas?</h2>
    <div class="field"><label for="pname">Tu nombre</label><input type="text" id="pname" name="pname" maxlength="20" autocomplete="nickname" placeholder="Por ejemplo, Ana" required></div>
    <fieldset class="field"><legend>Elige tu emblema</legend><div class="avgrid">${AVATARS.map(a=>`<label class="avopt"><input type="radio" name="av" value="${a.id}" ${a.id===av?'checked':''}>${avatarSVG(a.id,'av')}<span>${a.name}</span></label>`).join('')}</div></fieldset>
    <p class="err" id="cerr" role="alert" hidden></p>
    ${unclaimed?`<label class="sw oldsave"><input type="checkbox" id="cold"><span>Continuar el avance que quedó guardado en este navegador antes de los perfiles (${om.stations} de ${CH.length} estaciones, ${om.talents} talentos). Márcalo solo si ese avance es tuyo; si no, empiezas desde el principio.</span></label>`:''}
    <div class="actions"><button class="btn" type="submit">Crear y comenzar</button>${first?'':'<button class="btn ghost" type="button" id="ccancel">Volver</button>'}</div>
   </form></section>`;
  const nm=$('#pname'),err=$('#cerr');
  nm.oninput=()=>{$('#cprevname').textContent=nm.value.trim()||'Peregrino';err.hidden=true};
  $('#cform').onchange=e=>{if(e.target.name==='av')$('#cprevav').innerHTML=avatarSVG(e.target.value,'av xl')};
  const cc=$('#ccancel');if(cc)cc.onclick=viewMenu;
  $('#cform').onsubmit=e=>{
    e.preventDefault();
    const name=nm.value.replace(/\s+/g,' ').trim(),pick=$('#cform input[name="av"]:checked');
    if(!name){err.textContent='Escribe tu nombre para crear el peregrino.';err.hidden=false;nm.focus();return}
    if(IDX.list.some(x=>x.name.toLowerCase()===name.toLowerCase())){err.textContent=`Ya existe un peregrino llamado ${name}. Elige otro nombre o vuelve al menú para entrar con ese perfil.`;err.hidden=false;nm.focus();return}
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const useOld=unclaimed&&!!($('#cold')&&$('#cold').checked);
    /* Cada peregrino nuevo empieza desde cero, salvo que reclame a propósito el avance anterior */
    lsSet(PKEY(id),{v:3,level:null,camp:'antiguo',tracks:useOld?{antiguo:{discipulo:normalize(OLD)}}:{}});
    if(useOld)IDX.migrated=true;
    IDX.list.push({id,name,avatar:pick?pick.value:av,created:Date.now(),last:Date.now()});saveIdx();
    toast(`${avatarSVG(pick?pick.value:av,'av sm')}<div><b>Bienvenido, ${esc(name)}</b><span>Tu avance se guardará en este perfil.</span></div>`);
    enterProfile(id);
  };
  nm.focus({preventScroll:true});window.scrollTo(0,0);
}

/* ---------- Elegir nivel de dificultad ---------- */
/* Cada nivel guarda su propio recorrido. Cambiar de nivel no borra nada: se retoma donde se dejó. */
function levelProgress(id){const t=pistaSiHay(PD,CAMP.id,id);if(!t)return null;const m=summary(t);return (m.stations||m.talents||t.reached>=0)?m:null}
function progressText(m){return `${m.stations} de ${m.total} estaciones · ${m.talents} talentos`}
function setLevel(id){
  if(S&&PD.level)save();
  PD.level=id;S=pista(CAMP.id,id);streak=0;save();
  const n=NIVELES[id];toast(`${levelMeter(n.m)}<div><b>Nivel ${n.name}</b><span>${levelRules(n).join(' · ')}</span></div>`);
  viewMap();
}
function viewLevel(change){
  if(!PROFILE||!PD)return viewMenu();
  stopAll();cur=null;view='level';updateHeader();setMusic('map');
  const now=PD.level;
  main.innerHTML=`<section class="levels"><div class="menu-head"><p class="kicker">${esc(PROFILE.name)} · Nivel del camino</p><h2>${change?'Cambiar de nivel':'¿Cómo quieres recorrer el camino?'}</h2>
   <p class="note">El nivel decide qué preguntas te tocan, cuántas lámparas tienes y cuántos talentos vale cada acierto. Cada nivel es un recorrido aparte, con su propio avance${CAMPANAS.length>1?' en cada camino':''}.</p></div>
   <div class="lgrid">${Object.values(NIVELES).map(n=>{const pg=levelProgress(n.id);return `<button class="lcard${n.id===now?' on':''}" data-l="${n.id}" aria-pressed="${n.id===now}">
     <span class="lhead">${levelMeter(n.m)}${n.id===now?'<em>Nivel actual</em>':`<em class="lg">${n.grado}</em>`}</span><b>${n.name}</b><span class="ldesc">${n.desc}</span>
     <ul>${levelRules(n).map(r=>`<li>${r}</li>`).join('')}<li>${CH.reduce((a,c)=>a+c.qs.filter(q=>inLevel(q,n)).length,0)} preguntas en el ${CAMP.nombre}</li></ul>
     <span class="lprog">${pg?`Tu avance: ${progressText(pg)}`:'Sin empezar'}</span>
     <span class="lex">Ejemplo: «${esc(n.ej)}»</span></button>`}).join('')}</div>
   ${change?'<div class="actions"><button class="btn ghost" id="lcancel">Volver al mapa</button></div>':''}</section>`;
  main.querySelector('.lgrid').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;const id=b.dataset.l;
    if(!change||!now)return setLevel(id);
    if(id===now)return viewMap();
    confirmLevel(id)};
  const c=$('#lcancel');if(c)c.onclick=()=>viewMap();
  const f=main.querySelector('.lcard.on')||main.querySelector('.lcard');if(f)f.focus({preventScroll:true});window.scrollTo(0,0);
}
/* Aviso antes de cambiar de nivel en medio del juego */
function confirmLevel(id){
  const to=NIVELES[id],from=LVL(),pgTo=levelProgress(id),pgFrom=levelProgress(from.id),m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="sheet narrow levelwarn" role="alertdialog" aria-modal="true" aria-labelledby="lwt" aria-describedby="lwd">
   <div class="sheet-head"><div><p class="kicker">Aviso</p><h2 id="lwt">¿Cambiar a ${to.name}?</h2></div></div>
   <div id="lwd" class="lwarn">
    <p>${pgTo?`Continuarás tu recorrido en <b>${to.name}</b> donde lo dejaste (${progressText(pgTo)}).`:`Empezarás desde el inicio en la dificultad <b>${to.name}</b>.`}</p>
    <p>Tu avance en <b>${from.name}</b>${pgFrom?` (${progressText(pgFrom)})`:''} no será modificado. Lo encontrarás igual si vuelves a ese nivel.</p>
   </div>
   <div class="actions"><button class="btn" id="lyes">Cambiar a ${to.name}</button><button class="btn ghost" id="lno">Quedarme en ${from.name}</button></div></div>`;
  $('#lno').focus();
  $('#lno').onclick=()=>{m.hidden=true;m.innerHTML=''};
  $('#lyes').onclick=()=>{m.hidden=true;m.innerHTML='';setLevel(id)};
  m.onclick=e=>{if(e.target===m){m.hidden=true;m.innerHTML=''}};
}

/* ---------- Recuperar una copia de seguridad ---------- */
function confirmarCopia(texto){
  let lista;try{lista=leerCopia(texto)}catch(e){return toast(`<div><b>No se pudo recuperar la copia</b><span>${esc(e.message)}</span></div>`)}
  const rep=lista.filter(p=>IDX.list.some(x=>x.id===p.id));
  const m=abrirModal(`<div class="sheet narrow" role="alertdialog" aria-modal="true" aria-labelledby="cpt">
   <div class="sheet-head"><div><p class="kicker">Copia de seguridad</p><h2 id="cpt">¿Recuperar ${lista.length} ${lista.length===1?'peregrino':'peregrinos'}?</h2></div></div>
   <ul class="cplist">${lista.map(p=>`<li>${avatarSVG(p.avatar,'av sm')}<b>${esc(p.name)}</b> <span class="note">· ${IDX.list.some(x=>x.id===p.id)?'reemplaza al de este equipo':'nuevo en este equipo'}</span></li>`).join('')}</ul>
   ${rep.length?`<p class="warn">El avance de ${rep.map(p=>esc(p.name)).join(', ')} en este equipo se cambiará por el de la copia.</p>`:''}
   <div class="actions"><button class="btn" id="cpyes">Recuperar</button><button class="btn ghost" id="cpno">Cancelar</button></div></div>`);
  $('#cpno').focus();$('#cpno').onclick=closeModal;
  $('#cpyes').onclick=()=>{aplicarCopia(lista);closeModal();toast(`<div><b>Copia recuperada</b><span>${lista.length} ${lista.length===1?'peregrino listo':'peregrinos listos'} para seguir el camino.</span></div>`);viewMenu()};
  m.onclick=e=>{if(e.target===m)closeModal()};
}

/* ---------- Actualizaciones ----------
   Juego instalado (se abre como archivo): al abrir, si hay internet, lee version.json del repositorio de descargas
   (lo publica publicar.py). Si hay una versión más nueva, ofrece descargar el instalador; los peregrinos se conservan.
   Versión web y Microsoft Store (https): el service worker (sw.js) guarda el juego para jugar sin conexión y,
   cuando se publica una versión nueva, ofrece recargar.
   REPO debe coincidir con REPO en publicar.py. */
const VERSION=$('#ver').textContent.trim();
const REPO='Fabiancastillo16/camino-del-pacto-descargas';
const masNueva=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);
  for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false};
async function buscarActualizacion(){
  if(location.protocol!=='file:'||!navigator.onLine)return;
  let v;
  try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(`https://raw.githubusercontent.com/${REPO}/main/version.json`,{cache:'no-store',signal:ctl.signal});
    if(!r.ok)return;v=await r.json()}catch(e){return}
  if(!v||!/^\d+(\.\d+)*$/.test(v.version||'')||!masNueva(v.version,VERSION)||IDX.skipVersion===v.version)return;
  if(typeof v.url!=='string'||!v.url.startsWith(`https://github.com/${REPO}/releases/download/`))return;
  const t=toast(`<div class="upd"><b>Hay una versión nueva: ${esc(v.version)}</b>${v.notas?`<span>${esc(v.notas)}</span>`:''}
    <div class="actions"><a class="btn small" href="${esc(v.url)}" data-get>Actualizar</a><button class="btn ghost small" data-later>Ahora no</button><button class="btn ghost small" data-skip>No avisar de esta versión</button></div></div>`,{persist:true});
  const close=()=>t.querySelector('.tclose').click();
  t.querySelector('[data-get]').onclick=()=>{setTimeout(()=>{t.querySelector('.tbody').innerHTML=`<div class="upd"><b>Descargando la versión ${esc(v.version)}</b><span>Cuando termine, abre el instalador y sigue los pasos. Tus peregrinos y su avance se conservan. Si Windows muestra «Windows protegió su PC», toca «Más información» y luego «Ejecutar de todas formas».</span></div>`},0)};
  t.querySelector('[data-later]').onclick=close;
  t.querySelector('[data-skip]').onclick=()=>{IDX.skipVersion=v.version;saveIdx();close()};
}
function registrarServiceWorker(){
  if(!(location.protocol==='https:'||location.hostname==='localhost')||!('serviceWorker' in navigator))return;
  let recargando=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!recargando){recargando=true;location.reload()}});
  const ofrecer=w=>{const t=toast(`<div class="upd"><b>Hay una versión nueva del juego</b><span>Se descargó y está lista. Tus peregrinos y su avance se conservan.</span>
    <div class="actions"><button class="btn small" data-now>Actualizar ahora</button><button class="btn ghost small" data-later>Al terminar</button></div></div>`,{persist:true});
    t.querySelector('[data-now]').onclick=()=>w.postMessage('activar');
    t.querySelector('[data-later]').onclick=()=>t.querySelector('.tclose').click()};
  navigator.serviceWorker.register('sw.js').then(reg=>{
    /* Hay una versión nueva esperando solo si ya había otra controlando la página */
    if(reg.waiting&&navigator.serviceWorker.controller)ofrecer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ofrecer(w)})});
  }).catch(()=>{});
}

/* ---------- Inicio ---------- */
viewIntro();
setTimeout(buscarActualizacion,3000);
registrarServiceWorker();

</script>
