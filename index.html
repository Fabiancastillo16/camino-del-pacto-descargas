 {l:2,s:'Noé sonríe cuando le preguntas su edad.',q:'¿Qué edad tenía Noé cuando las aguas del diluvio vinieron sobre la tierra?',o:['600 años','500 años','950 años','120 años'],r:'Génesis 7:6',n:'Tenía 500 cuando engendró a Sem, Cam y Jafet (5:32) y vivió 950 en total (9:29).'},
 {l:2,s:'Bajas a la bodega a revisar los animales.',q:'¿Cuántos de cada animal limpio debía meter Noé en el arca?',o:['Siete parejas','Una pareja','Tres parejas','Doce parejas'],r:'Génesis 7:2',n:'Siete parejas de animales limpios; de los que no eran limpios, una pareja.'},
 {l:2,s:'Después de muchos días, se abre la ventana del arca.',q:'¿Cuál fue la primera ave que Noé soltó?',o:['Un cuervo','Una paloma','Una golondrina','Un águila'],r:'Génesis 8:6-7',n:'El cuervo salió y estuvo yendo y volviendo. Después envió la paloma.'},
 {l:2,s:'La puerta del arca por fin se abre a tierra seca.',q:'Al salir del arca, ¿qué fue lo primero que hizo Noé según el relato?',o:['Edificó un altar a Jehová','Plantó una viña','Envió a sus hijos a explorar','Puso nombre a los animales'],r:'Génesis 8:20',n:'Edificó un altar y ofreció holocausto. La viña aparece más tarde (9:20).'},
 {l:1,q:'¿Cómo se llamaban los tres hijos de Noé?',o:['Sem, Cam y Jafet','Sem, Cam y Set','Cam, Jafet y Lamec','Sem, Jafet y Enós'],r:'Génesis 6:10',n:'Set y Enós pertenecen a generaciones mucho anteriores; Lamec fue el padre de Noé.'},
 {l:3,q:'¿Con qué madera mandó Dios construir el arca?',o:['Madera de gofer','Cedro del Líbano','Madera de acacia','Madera de olivo'],r:'Génesis 6:14',n:'La acacia se usó después para el tabernáculo y el arca del pacto (Éx 25:10).'},
 {l:3,q:'¿Con qué debía calafatear Noé el arca por dentro y por fuera?',o:['Con brea','Con cera','Con barro','Con aceite'],r:'Génesis 6:14',n:'Calafatear es sellar las junturas para que no entre el agua.'},
 {l:1,q:'¿Cuántas personas se salvaron en el arca?',o:['Ocho','Seis','Siete','Doce'],r:'Génesis 7:13; 1 Pedro 3:20',n:'Noé, su mujer, sus tres hijos y las mujeres de sus hijos.'},
 {l:3,q:'¿Cuántos días prevalecieron las aguas sobre la tierra?',o:['Ciento cincuenta días','Cuarenta días','Ciento veinte días','Un año entero'],r:'Génesis 7:24',n:'Llovió cuarenta días (7:12), pero las aguas prevalecieron ciento cincuenta.'},
 {l:1,q:'¿Qué traía la paloma en el pico cuando volvió la segunda vez?',o:['Una hoja de olivo','Una rama de higuera','Una espiga de trigo','Nada'],r:'Génesis 8:10-11',n:'La primera vez volvió sin hallar dónde posarse; la tercera ya no volvió (8:12).'},
 {l:1,q:'¿Qué señal puso Dios para recordar su pacto de no destruir la tierra con un diluvio?',o:['Su arco en las nubes','Una estrella nueva','Una columna de piedra','Un altar perpetuo'],r:'Génesis 9:12-13',n:'«Mi arco he puesto en las nubes, el cual será por señal del pacto».'},
 {l:3,q:'¿Cuántos codos subieron las aguas por encima de los montes más altos?',o:['Quince codos','Diez codos','Treinta codos','Cuarenta codos'],r:'Génesis 7:20',n:'Las aguas subieron quince codos después de cubrir los montes.'},
 {l:2,q:'¿Cuántos pisos tenía el arca?',o:['Tres','Dos','Cuatro','Siete'],r:'Génesis 6:16',n:'«Le harás piso bajo, segundo y tercero».'},
 {l:2,q:'¿Qué plantó Noé después del diluvio?',o:['Una viña','Un olivar','Un campo de trigo','Una higuera'],r:'Génesis 9:20',n:'Noé comenzó a labrar la tierra y plantó una viña.'},
 {l:3,q:'Según Génesis 6:3, ¿cuántos años serían los días del hombre?',o:['Ciento veinte años','Setenta años','Cien años','Ciento cincuenta años'],r:'Génesis 6:3',n:'Los setenta años aparecen en el Salmo 90:10.'},
 {l:2,q:'¿Por qué dijo Jehová que se arrepentía de haber hecho al hombre?',o:['Porque la maldad de los hombres era mucha y todo designio de su corazón era de continuo solamente el mal','Porque los hombres no le ofrecían sacrificios','Porque habían edificado una torre','Porque habían comido del árbol prohibido'],r:'Génesis 6:5-6',n:'Pero Noé halló gracia ante los ojos de Jehová (6:8).'},
 {l:2,q:'Después del diluvio, ¿qué prohibió Dios comer a Noé y sus hijos?',o:['Carne con su vida, que es su sangre','Carne de cerdo','Aves de rapiña','Peces sin escamas'],r:'Génesis 9:3-4',n:'Les dio todo lo que se mueve y vive como alimento, pero no la sangre. Las leyes sobre animales inmundos llegan después, con Moisés.'},
 {l:2,q:'¿Cuál de los hijos de Noé vio la desnudez de su padre y lo contó a sus hermanos?',o:['Cam','Sem','Jafet','Canaán'],r:'Génesis 9:22-25',n:'Sem y Jafet lo cubrieron andando hacia atrás. La maldición de Noé cayó sobre Canaán, hijo de Cam.'},
 {l:1,q:'¿Qué construyó Noé por mandato de Dios?',o:['Un arca','Una torre','Un altar de oro','Una ciudad'],r:'Génesis 6:14',n:'Un arca de madera de gofer, calafateada con brea.'},
 {l:1,q:'¿Cuántos días y noches llovió sobre la tierra?',o:['Cuarenta días y cuarenta noches','Siete días y siete noches','Ciento cincuenta días','Doce días'],r:'Génesis 7:12',n:'Las aguas prevalecieron después ciento cincuenta días (7:24).'},
 {l:1,q:'¿Por qué se salvó Noé del diluvio?',o:['Porque halló gracia ante los ojos de Jehová; era varón justo','Porque era el hombre más rico','Porque era el más fuerte','Porque era sacerdote'],r:'Génesis 6:8-9',n:'«Noé con Dios caminó».'},
 {l:1,q:'¿Qué ave volvió al arca con una hoja de olivo en el pico?',o:['La paloma','El cuervo','La golondrina','El águila'],r:'Génesis 8:11',n:'Así supo Noé que las aguas se habían retirado.'},
 {l:1,q:'¿Sobre qué montes reposó el arca?',o:['Los montes de Ararat','El monte Sinaí','El monte Carmelo','El monte Moriah'],r:'Génesis 8:4',n:'Ararat está en la región de la actual Turquía oriental y Armenia.'},
 {l:2,q:'¿Quién cerró la puerta del arca?',o:['Jehová','Noé','Sem','Un ángel'],r:'Génesis 7:16',n:'«Y Jehová le cerró la puerta».'},
 {l:3,q:'¿Cuántos días esperó Noé antes de soltar la paloma por segunda vez?',o:['Siete días','Tres días','Cuarenta días','Catorce días'],r:'Génesis 8:10',n:'Esperó otros siete días más antes de soltarla por tercera vez (8:12).'},
 {l:3,q:'¿Cómo se llamaba el padre de Noé?',o:['Lamec','Matusalén','Enoc','Jared'],r:'Génesis 5:28-29',n:'Matusalén fue su abuelo y Enoc su bisabuelo.'},
 {l:3,q:'¿Cuándo se descubrieron las cimas de los montes después del diluvio?',o:['El mes décimo, el primero del mes','El mes séptimo, día diecisiete','El mes primero, día primero','El mes segundo, día veintisiete'],r:'Génesis 8:5',n:'El arca había reposado el mes séptimo (8:4); la tierra quedó seca el mes segundo, día 27 (8:14).'},
 {l:3,q:'Según Génesis 6:16, ¿cómo debía hacerse la ventana del arca?',o:['Acabada a un codo de elevación por la parte de arriba','De tres codos de alto en el costado','De diez codos en la parte delantera','Sin ventana, solo con la puerta'],r:'Génesis 6:16',n:'La puerta iba al costado del arca.'},
 {l:3,q:'¿Cuántos años vivió Noé en total?',o:['950 años','969 años','600 años','930 años'],r:'Génesis 9:29',n:'969 vivió Matusalén y 930 Adán.'},
 {l:3,q:'Según Génesis 9:6, ¿por qué se pediría cuenta de la sangre del hombre?',o:['Porque a imagen de Dios es hecho el hombre','Porque la tierra es de Jehová','Porque así lo juró Noé','Porque el hombre fue formado del polvo'],r:'Génesis 9:5-6',n:'«El que derramare sangre de hombre, por el hombre su sangre será derramada».'}
 ],
 secretos:[
 {s:'Una cumbre asoma entre las olas y Noé abre la bitácora en una fecha exacta.',q:'¿En qué mes y día reposó el arca sobre los montes de Ararat?',o:['Mes séptimo, día diecisiete','Mes segundo, día diecisiete','Mes décimo, día primero','Mes primero, día primero'],r:'Génesis 8:4',n:'El diluvio comenzó el mes segundo, día 17 (7:11). Las cimas se vieron el mes décimo (8:5) y las aguas se secaron el mes primero, día primero (8:13).'},
 {s:'El tesoro es la última página de la bitácora, escrita por otra mano.',q:'¿Cuántos años vivió Noé después del diluvio?',o:['350 años','300 años','400 años','600 años'],r:'Génesis 9:28-29',n:'Vivió 950 años en total: 600 antes del diluvio y 350 después.'},
 {s:'El tesoro es la bitácora de Noé, abierta en el día en que la tierra quedó seca.',q:'¿En qué año de la vida de Noé se secaron las aguas de sobre la tierra?',o:['En el año seiscientos uno','En el año seiscientos','En el año seiscientos diez','En el año seiscientos cincuenta'],r:'Génesis 8:13',n:'Fue el mes primero, día primero, del año 601 de Noé. La tierra quedó del todo seca el mes segundo, día 27 (8:14).'}
 ]},

/* ---------------- ABRAHAM · Génesis 10–25 (de Babel a Isaac) ---------------- */
abraham:{
 voces:['El fuego chisporrotea y el anciano sigue su relato.','Un pastor de Abram se sienta a tu lado.','Sara escucha desde la puerta de la tienda.','Las estrellas parecen inclinarse a escuchar.','Un criado trae agua del pozo y te pregunta algo.'],
 qs:[
 {l:2,s:'El anciano recuerda la ciudad de su juventud.',q:'¿De qué ciudad salió Taré con su hijo Abram rumbo a Canaán?',o:['Ur de los caldeos','Harán','Nínive','Babel'],r:'Génesis 11:31',n:'Salieron de Ur de los caldeos y se detuvieron en Harán.'},
 {l:3,s:'«Yo ya era viejo cuando Dios me habló», dice.',q:'¿Qué edad tenía Abram cuando salió de Harán?',o:['75 años','99 años','100 años','86 años'],r:'Génesis 12:4',n:'Tenía 86 al nacer Ismael (16:16), 99 en el pacto de la circuncisión (17:1) y 100 al nacer Isaac (21:5).'},
 {l:2,s:'Te cuenta de una batalla y de un encuentro inesperado al volver.',q:'¿Quién salió al encuentro de Abram con pan y vino, siendo rey y sacerdote del Dios Altísimo?',o:['Melquisedec, rey de Salem','Abimelec, rey de Gerar','Bera, rey de Sodoma','Amrafel, rey de Sinar'],r:'Génesis 14:18',n:'Melquisedec bendijo a Abram, y Abram le dio los diezmos de todo.'},
 {l:2,s:'Su voz se quiebra al hablar de su hijo.',q:'¿A qué tierra envió Dios a Abraham para ofrecer a Isaac?',o:['La tierra de Moriah','Bet-el','Mamre','Beerseba'],r:'Génesis 22:2',n:'Dios le dijo que fuera a la tierra de Moriah, a uno de los montes que le mostraría.'},
 {l:3,s:'En el monte, un carnero quedó trabado en un zarzal.',q:'¿Qué nombre dio Abraham a aquel lugar?',o:['Jehová-jireh','Jehová-nisi','Jehová-salom','El-roi'],r:'Génesis 22:14',n:'Jehová-nisi lo dijo Moisés (Éx 17:15), Jehová-salom Gedeón (Jue 6:24) y «el Dios que me ve» Agar (Gn 16:13).'},
 {l:1,q:'¿Cómo se llamaba la esposa de Abram?',o:['Sarai','Agar','Rebeca','Milca'],r:'Génesis 11:29',n:'Dios le cambió el nombre a Sara (17:15). Milca fue mujer de Nacor, hermano de Abram.'},
 {l:2,q:'¿Cómo se llamaba la sierva egipcia de Sarai, madre de Ismael?',o:['Agar','Cetura','Zilpa','Bilha'],r:'Génesis 16:1',n:'Cetura fue mujer de Abraham después de la muerte de Sara (25:1). Zilpa y Bilha fueron siervas de Lea y Raquel.'},
 {l:2,q:'¿Qué nombre mandó poner el ángel al hijo de Agar?',o:['Ismael','Isaac','Madián','Nebaiot'],r:'Génesis 16:11',n:'«Porque Jehová ha oído tu aflicción». Nebaiot fue el primogénito de Ismael (25:13).'},
 {l:2,q:'¿Qué edad tenía Abraham cuando nació Isaac?',o:['100 años','99 años','86 años','75 años'],r:'Génesis 21:5',n:'Sara tenía noventa (17:17).'},
 {l:2,q:'¿Cuál fue la señal del pacto que Dios dio a Abraham en Génesis 17?',o:['La circuncisión','El arco en las nubes','El día de reposo','Un altar de piedras'],r:'Génesis 17:10-11',n:'El arco en las nubes fue la señal del pacto con Noé (9:13).'},
 {l:2,q:'¿Qué tierra escogió Lot cuando se separó de Abram?',o:['Toda la llanura del Jordán','Los montes de Canaán','La tierra de Egipto','La región de Gerar'],r:'Génesis 13:10-11',n:'La llanura era de riego, como el huerto de Jehová, y Lot puso sus tiendas hasta Sodoma.'},
 {l:1,q:'¿En qué se convirtió la mujer de Lot al mirar atrás?',o:['En estatua de sal','En piedra','En polvo','En ceniza'],r:'Génesis 19:26',n:'Jesús la recuerda en Lucas 17:32: «Acordaos de la mujer de Lot».'},
 {l:2,q:'Intercediendo por Sodoma, ¿con cuántos justos terminó Abraham su ruego?',o:['Diez','Cincuenta','Veinte','Cinco'],r:'Génesis 18:32',n:'Comenzó con cincuenta y bajó a cuarenta y cinco, cuarenta, treinta, veinte y diez.'},
 {l:3,q:'¿Dónde estaba Abraham cuando tres varones lo visitaron junto a su tienda?',o:['En el encinar de Mamre','En Bet-el','En Beerseba','En Harán'],r:'Génesis 18:1-2',n:'Estaba sentado a la puerta de su tienda en el calor del día.'},
 {l:2,q:'¿Qué compró Abraham para sepultar a Sara?',o:['La cueva de Macpela, a Efrón heteo','Un campo en Siquem','La cueva de Adulam','Un sepulcro en Belén'],r:'Génesis 23:9-20',n:'Allí fueron sepultados después Abraham, Isaac, Rebeca, Lea y Jacob (49:31; 50:13).'},
 {l:2,q:'¿A quién envió Abraham a buscar esposa para Isaac?',o:['A su criado más viejo, el que gobernaba su casa','A Lot, su sobrino','A Ismael','A Isaac mismo'],r:'Génesis 24:2-4',n:'Lo hizo jurar que no tomaría mujer para Isaac de las hijas de los cananeos.'},
 {l:2,q:'¿Qué señal pidió el criado para reconocer a la esposa de Isaac?',o:['Que le diera de beber a él y también a sus camellos','Que llevara un velo','Que fuera la primera en saludarlo','Que tuviera un anillo de oro'],r:'Génesis 24:14',n:'Rebeca cumplió la señal antes de que él terminara de orar (24:15-19).'},
 {l:3,q:'¿Qué edad tenía Sara cuando murió?',o:['127 años','90 años','100 años','175 años'],r:'Génesis 23:1',n:'Abraham murió a los 175 años (25:7).'},
 {l:2,s:'Antes de Abram, el anciano recuerda a los reyes de Sinar.',q:'¿Quién fue llamado «vigoroso cazador delante de Jehová»?',o:['Nimrod','Cus','Asur','Esaú'],r:'Génesis 10:9',n:'Esaú también fue diestro en la caza (25:27), pero la frase se dice de Nimrod.'},
 {l:3,s:'Abram mira hacia el oriente, donde quedó una torre a medio construir.',q:'¿Qué usaron en Babel en lugar de piedra y de mezcla?',o:['Ladrillo en lugar de piedra y asfalto en lugar de mezcla','Piedra labrada y cal','Madera y brea','Adobe y paja'],r:'Génesis 11:3',n:'«Les sirvió el ladrillo en lugar de piedra, y el asfalto en lugar de mezcla».'},
 {l:1,q:'Cuando Dios sacó a Abram a mirar el cielo, ¿a qué comparó su descendencia?',o:['A las estrellas, que no se pueden contar','A los árboles del bosque','A los peces del mar','A los granos de trigo'],r:'Génesis 15:5',n:'También la comparó con el polvo de la tierra (13:16) y la arena del mar (22:17).'},
 {l:1,q:'¿Cómo se llamaba el hijo que Sara dio a luz en su vejez?',o:['Isaac','Ismael','Jacob','Lot'],r:'Génesis 21:2-3',n:'Isaac significa «risa».'},
 {l:1,q:'¿Qué parentesco tenía Lot con Abram?',o:['Era su sobrino','Era su hijo','Era su hermano','Era su siervo'],r:'Génesis 11:27; 12:5',n:'Lot era hijo de Harán, hermano de Abram.'},
 {l:1,q:'¿Qué ciudades destruyó Dios con fuego y azufre del cielo?',o:['Sodoma y Gomorra','Nínive y Babel','Ur y Harán','Jericó y Hai'],r:'Génesis 19:24',n:'Lot y sus hijas escaparon a Zoar.'},
 {l:1,q:'¿Qué animal proveyó Dios en el monte en lugar de Isaac?',o:['Un carnero trabado en un zarzal','Un cordero','Un becerro','Un macho cabrío'],r:'Génesis 22:13',n:'Abraham había dicho: «Dios se proveerá de cordero» (22:8).'},
 {l:1,q:'¿Qué nombre nuevo le dio Dios a Abram?',o:['Abraham, porque sería padre de muchedumbre de gentes','Israel','Isaac','Abiram'],r:'Génesis 17:5',n:'A Sarai le cambió el nombre a Sara (17:15).'},
 {l:1,q:'¿Qué hizo Sara cuando oyó que tendría un hijo en su vejez?',o:['Se rió para sí','Lloró de alegría','Cantó un salmo','Se desmayó'],r:'Génesis 18:12',n:'«¿Hay para Dios alguna cosa difícil?», respondió Jehová (18:14).'},
 {l:3,q:'¿Qué edad tenía Abram cuando nació Ismael?',o:['86 años','75 años','99 años','100 años'],r:'Génesis 16:16',n:'Había salido de Harán a los 75 y tuvo a Isaac a los 100.'},
 {l:3,q:'¿En qué lugar hicieron pacto Abraham y Abimelec junto a un pozo?',o:['Beerseba','Mamre','Bet-el','Gerar'],r:'Génesis 21:31',n:'Beerseba significa «pozo del juramento».'},
 {l:3,q:'¿Cómo se llamaba la mujer que tomó Abraham después de la muerte de Sara?',o:['Cetura','Agar','Milca','Basemat'],r:'Génesis 25:1',n:'De ella nacieron Madián y otros hijos (25:2).'},
 {l:3,q:'En la guerra de Génesis 14, ¿cuántos reyes pelearon contra cinco?',o:['Cuatro','Tres','Siete','Nueve'],r:'Génesis 14:9',n:'Quedorlaomer y sus aliados vencieron a los cinco reyes del valle de Sidim y se llevaron a Lot.'},
 {l:3,q:'¿Cuántos años vivió Abraham?',o:['175 años','127 años','180 años','147 años'],r:'Génesis 25:7',n:'127 vivió Sara, 180 Isaac y 147 Jacob.'},
 {l:3,q:'¿Quiénes sepultaron a Abraham?',o:['Isaac e Ismael, sus hijos','Isaac y Jacob','Isaac y Lot','Eliezer e Isaac'],r:'Génesis 25:9',n:'Lo sepultaron en la cueva de Macpela, junto a Sara.'},
 {l:3,q:'¿Cómo se llamaba el siervo que Abram creía que sería su heredero?',o:['Eliezer, el damasceno','Lot','Ismael','Mamre'],r:'Génesis 15:2',n:'Dios le respondió: «No te heredará este, sino un hijo tuyo» (15:4).'},
 {l:3,q:'¿Dónde murió Taré, el padre de Abram?',o:['En Harán','En Ur de los caldeos','En Canaán','En Babel'],r:'Génesis 11:32',n:'Murió a los 205 años.'},
 {l:3,q:'¿Qué edad tenía Isaac cuando tomó por mujer a Rebeca?',o:['40 años','60 años','30 años','100 años'],r:'Génesis 25:20',n:'Tenía 60 cuando nacieron Esaú y Jacob (25:26).'}
 ],
 secretos:[
 {s:'Lo que brillaba eran puntas de lanza: los criados de Abram, listos para rescatar a su sobrino.',q:'¿Cuántos criados nacidos en su casa armó Abram para rescatar a Lot?',o:['318','300','400','120'],r:'Génesis 14:14',n:'Armó a 318 criados y persiguió a los reyes hasta Dan.'},
 {s:'El tesoro es una bolsa de plata pesada, con el sello de un heteo.',q:'¿Cuánto pagó Abraham por el campo y la cueva de Macpela?',o:['400 siclos de plata','20 piezas de plata','30 piezas de plata','100 siclos de oro'],r:'Génesis 23:15-16',n:'Pesó la plata «de buena ley entre mercaderes», a la vista de los hijos de Het.'},
 {s:'El tesoro es un pendiente de oro y dos brazaletes, regalo para una novia.',q:'¿Quién era el padre de Rebeca?',o:['Betuel','Labán','Nacor','Taré'],r:'Génesis 24:15',n:'Labán era su hermano, Nacor su abuelo y Taré su bisabuelo.'},
 {s:'El tesoro es un rollo con la genealogía que va de Sem hasta Abram.',q:'¿Qué edad tenía Sem cuando engendró a Arfaxad, dos años después del diluvio?',o:['100 años','98 años','500 años','120 años'],r:'Génesis 11:10',n:'«Sem, de edad de cien años, engendró a Arfaxad, dos años después del diluvio».'}
 ]},

/* ---------------- JOSÉ · Génesis 25–50 ---------------- */
jose:{
 voces:['Un escriba egipcio desenrolla un papiro.','En el granero, un mayordomo cuenta sacos de trigo.','Un mercader ismaelita recuerda la ruta.','Junto al Nilo, alguien te detiene con una pregunta.','Un anciano hebreo recuerda las historias de su abuelo Jacob.'],
 qs:[
 {l:2,s:'Los mercaderes cuentan monedas a la orilla de una cisterna.',q:'¿Por cuántas piezas de plata vendieron sus hermanos a José?',o:['Veinte','Treinta','Quince','Cuarenta'],r:'Génesis 37:28',n:'Veinte piezas de plata. Las treinta corresponden a otra historia muy posterior.'},
 {l:2,s:'En el mercado de Egipto, un oficial se interesa por el joven hebreo.',q:'¿Quién compró a José en Egipto?',o:['Potifar, capitán de la guardia','Potifera, sacerdote de On','El jefe de los coperos de Faraón','El jefe de los panaderos'],r:'Génesis 37:36; 39:1',n:'Potifar era oficial de Faraón. Potifera, con nombre parecido, será su suegro.'},
 {l:3,s:'En la cárcel, dos prisioneros despiertan inquietos.',q:'¿Qué soñó el jefe de los panaderos?',o:['Tres canastillos sobre su cabeza, y las aves comían de ellos','Una vid con tres sarmientos','Siete espigas menudas y abatidas','Once estrellas que se inclinaban'],r:'Génesis 40:16-17',n:'La vid era el sueño del copero. A los tres días el panadero fue ahorcado.'},
 {l:3,s:'Lo llevan rapado y con ropa nueva ante el trono.',q:'¿Qué edad tenía José cuando se presentó delante de Faraón?',o:['30 años','17 años','40 años','110 años'],r:'Génesis 41:46',n:'Tenía 17 cuando fue vendido (37:2) y murió a los 110 (50:26).'},
 {l:2,s:'Sus hermanos llegan a comprar trigo y no lo reconocen.',q:'¿Qué hermano quedó preso en Egipto mientras los demás volvían por Benjamín?',o:['Simeón','Rubén','Judá','Leví'],r:'Génesis 42:24',n:'José tomó a Simeón y lo aprisionó a la vista de ellos.'},
 {l:1,q:'¿Por qué vendió Esaú su primogenitura a Jacob?',o:['Por pan y un guisado de lentejas','Por un rebaño de ovejas','Por la bendición de su padre','Por siete años de trabajo'],r:'Génesis 25:29-34',n:'«Así menospreció Esaú la primogenitura».'},
 {l:1,q:'¿Qué vio Jacob en sueños en Bet-el?',o:['Una escalera que llegaba al cielo, con ángeles que subían y descendían','Siete vacas gordas y siete flacas','Una zarza que ardía','Una columna de fuego'],r:'Génesis 28:12',n:'Al despertar dijo: «No es otra cosa que casa de Dios, y puerta del cielo».'},
 {l:2,q:'¿Cuántos años trabajó Jacob para Labán a cambio de Raquel?',o:['Catorce: siete y siete más','Siete','Veinte','Doce'],r:'Génesis 29:20-30',n:'En total estuvo veinte años en casa de Labán (31:41).'},
 {l:1,q:'¿Qué nombre recibió Jacob después de luchar en Peniel?',o:['Israel','Judá','Edom','Efraín'],r:'Génesis 32:28',n:'«Porque has luchado con Dios y con los hombres, y has vencido». Edom es el sobrenombre de Esaú (25:30).'},
 {l:2,q:'¿Quién era la madre de José y de Benjamín?',o:['Raquel','Lea','Bilha','Zilpa'],r:'Génesis 35:24',n:'Lea fue madre de Rubén, Simeón, Leví, Judá, Isacar y Zabulón.'},
 {l:3,q:'¿Dónde murió Raquel?',o:['En el camino de Efrata, que es Belén','En Hebrón','En Bet-el','En Siquem'],r:'Génesis 35:16-19',n:'Murió al dar a luz a Benjamín, a quien ella llamó Benoni.'},
 {l:2,q:'¿Qué hermano propuso echar a José en la cisterna en lugar de matarlo, para después librarlo?',o:['Rubén','Judá','Simeón','Leví'],r:'Génesis 37:21-22',n:'Judá fue quien propuso venderlo a los ismaelitas (37:26-27).'},
 {l:2,q:'¿Qué hermano propuso vender a José a los ismaelitas?',o:['Judá','Rubén','Simeón','Benjamín'],r:'Génesis 37:26-27',n:'«¿Qué provecho hay en que matemos a nuestro hermano?», dijo Judá.'},
 {l:1,q:'En el sueño de Faraón, ¿qué significaban las siete vacas gordas?',o:['Siete años de gran abundancia','Siete años de hambre','Siete reyes de Egipto','Siete plagas'],r:'Génesis 41:26-29',n:'Las vacas flacas y las espigas menudas eran los siete años de hambre.'},
 {l:2,q:'¿Qué objeto mandó José esconder en el costal de Benjamín?',o:['Su copa de plata','Su anillo de sello','Monedas de oro','Un collar de oro'],r:'Génesis 44:2',n:'Lo puso junto con el dinero de su trigo.'},
 {l:2,q:'¿Cómo se llamaban los dos hijos de José?',o:['Manasés y Efraín','Rubén y Simeón','Er y Onán','Fares y Zara'],r:'Génesis 41:51-52',n:'Er, Onán, Fares y Zara fueron hijos de Judá.'},
 {l:2,q:'¿En qué región de Egipto se estableció la familia de Jacob?',o:['Gosén','On','Zoán','Pitón'],r:'Génesis 45:10; 47:6',n:'Era la mejor tierra para sus ganados.'},
 {l:3,q:'¿Qué edad tenía Jacob cuando se presentó ante Faraón?',o:['130 años','147 años','110 años','120 años'],r:'Génesis 47:9',n:'Jacob murió a los 147 años (47:28).'},
 {l:1,q:'¿Qué regalo especial le hizo Jacob a José?',o:['Una túnica de diversos colores','Un anillo de oro','Una espada','Un camello'],r:'Génesis 37:3',n:'Por eso sus hermanos lo aborrecían.'},
 {l:1,q:'¿Quiénes fueron los padres de Jacob y Esaú?',o:['Isaac y Rebeca','Abraham y Sara','Jacob y Raquel','Labán y Lea'],r:'Génesis 25:20-26',n:'Eran mellizos; Esaú nació primero.'},
 {l:1,q:'¿Cuántos hijos varones tuvo Jacob?',o:['Doce','Diez','Siete','Once'],r:'Génesis 35:22-26',n:'De ellos vienen las doce tribus de Israel.'},
 {l:1,q:'¿Qué cargo le dio Faraón a José?',o:['Lo puso sobre toda la tierra de Egipto, solo por debajo de Faraón','Jefe de los panaderos','Sacerdote de On','Capitán de la guardia'],r:'Génesis 41:40-43',n:'«Solamente en el trono seré yo mayor que tú».'},
 {l:1,q:'¿Por qué bajaron a Egipto los hermanos de José?',o:['A comprar trigo, porque había hambre','A buscar a José','A vender ganado','A hacer la guerra'],r:'Génesis 42:1-3',n:'El hambre había llegado también a Canaán.'},
 {l:3,q:'¿Cómo se llamaba la hija de Jacob y Lea?',o:['Dina','Tamar','Milca','Basemat'],r:'Génesis 30:21',n:'Tamar fue nuera de Judá (cap. 38).'},
 {l:3,q:'¿Qué nombre egipcio le dio Faraón a José?',o:['Zafnat-panea','Potifera','Asenat','Ramesés'],r:'Génesis 41:45',n:'Asenat fue su esposa y Potifera su suegro.'},
 {l:3,q:'Cuando José se dio a conocer a sus hermanos, ¿cuántos años de hambre habían pasado?',o:['Dos, y aún quedaban cinco','Uno, y quedaban seis','Cinco, y quedaban dos','Siete, ya terminaban'],r:'Génesis 45:6',n:'Por eso mandó traer a su padre a Egipto.'},
 {l:3,q:'¿Dónde fue sepultado Jacob?',o:['En la cueva de Macpela, en Canaán','En Gosén','En Bet-el','En Belén, junto a Raquel'],r:'Génesis 50:13',n:'Allí estaban sepultados Abraham, Sara, Isaac, Rebeca y Lea (49:31).'},
 {l:3,q:'¿Qué edad tenía Isaac cuando nacieron Esaú y Jacob?',o:['60 años','40 años','100 años','75 años'],r:'Génesis 25:26',n:'Se había casado con Rebeca a los 40 (25:20).'},
 {l:3,q:'¿Cuánto tiempo pasó antes de que el copero se acordara de José?',o:['Dos años','Tres días','Siete años','Un año'],r:'Génesis 41:1',n:'Se acordó cuando Faraón tuvo sus sueños (41:9).'},
 {l:3,q:'¿Cuántos años vivió José?',o:['110 años','120 años','130 años','147 años'],r:'Génesis 50:26',n:'Lo embalsamaron y lo pusieron en un ataúd en Egipto.'},
 {l:3,q:'¿Cómo se llamaban los dos hijos de Judá que murieron por su maldad?',o:['Er y Onán','Fares y Zara','Manasés y Efraín','Rubén y Simeón'],r:'Génesis 38:7-10',n:'Fares y Zara fueron los hijos de Judá con Tamar.'},
 {l:3,q:'¿Cuántos días lloraron los egipcios a Jacob?',o:['Setenta días','Cuarenta días','Siete días','Treinta días'],r:'Génesis 50:3',n:'Cuarenta días tomó embalsamarlo.'}
 ],
 secretos:[
 {s:'El anillo que hallaste es el sello que Faraón puso en la mano de José. Con él vino también una esposa.',q:'¿Cómo se llamaba la esposa egipcia de José y quién era su padre?',o:['Asenat, hija de Potifera, sacerdote de On','Asenat, hija de Potifar, capitán de la guardia','Séfora, hija de Jetro, sacerdote de Madián','Basemat, hija de Ismael'],r:'Génesis 41:45',n:'Faraón le dio el nombre Zafnat-panea y por mujer a Asenat, hija de Potifera.'},
 {s:'El tesoro es un rollo con la lista de los que bajaron a Egipto.',q:'Según Génesis 46:27, ¿cuántas personas de la casa de Jacob entraron en Egipto?',o:['Setenta','Sesenta y seis','Setenta y cinco','Doce'],r:'Génesis 46:26-27',n:'Sesenta y seis sin contar a las nueras ni a José y sus hijos; setenta en total. Esteban, citando la versión griega, dice setenta y cinco (Hch 7:14).'},
 {s:'El tesoro es un báculo gastado por muchos caminos.',q:'¿Qué palabras usó Jacob ante Faraón para describir sus años?',o:['«Pocos y malos han sido los días de los años de mi vida»','«Largos y llenos de bendición»','«Como un sueño que pasa»','«Como la hierba que florece»'],r:'Génesis 47:9',n:'Tenía 130 años y dijo que no habían llegado a los días de sus padres.'}
 ]},

/* ---------------- ÉXODO · Éxodo 1–15 ---------------- */
exodo:{
 voces:['Una familia camina a tu lado con la masa sin leudar.','Un anciano levita recuerda los días de Egipto.','El viento del oriente trae una pregunta.','Un niño señala los muros de agua.','Una mujer lleva un pandero y te detiene un momento.'],
 qs:[
 {l:3,s:'Una anciana camina a tu lado y recuerda los años de esclavitud.',q:'¿Cómo se llamaban las parteras hebreas que temieron a Dios y no obedecieron a Faraón?',o:['Sifra y Fúa','Jocabed y María','Ada y Zila','Noemí y Rut'],r:'Éxodo 1:15-17',n:'Sifra y Fúa preservaron la vida de los niños varones.'},
 {l:2,s:'Alguien señala a Moisés y recuerda dónde empezó todo.',q:'¿En qué monte vio Moisés la zarza que ardía y no se consumía?',o:['Horeb','Nebo','Carmelo','Moriah'],r:'Éxodo 3:1-2',n:'Horeb, llamado monte de Dios. Nebo es donde Moisés murió.'},
 {l:3,s:'Un hombre cuenta cómo los sabios de Egipto quedaron sin respuesta.',q:'¿En qué plaga los hechiceros de Egipto ya no pudieron imitar la señal y dijeron «dedo de Dios es este»?',o:['Los piojos','Las ranas','Las aguas en sangre','Las moscas'],r:'Éxodo 8:18-19',n:'Imitaron la sangre y las ranas, pero no los piojos.'},
 {l:3,s:'Un levita lleva la cuenta de las generaciones.',q:'Según Éxodo 12, ¿cuánto tiempo habitaron los hijos de Israel en Egipto?',o:['430 años','400 años','40 años','210 años'],r:'Éxodo 12:40-41',n:'Génesis 15:13 habla de 400 años de aflicción; Éxodo 12:40 da 430.'},
 {l:2,s:'Ya en la otra orilla, comienza la música.',q:'¿Quién tomó un pandero y dirigió el canto de las mujeres después de cruzar el mar?',o:['María la profetisa, hermana de Aarón','Débora','Ana','Jocabed'],r:'Éxodo 15:20-21',n:'María respondía: «Cantad a Jehová, porque en extremo se ha engrandecido».'},
 {l:3,q:'¿Qué ciudades de almacenaje edificaron los hebreos para Faraón?',o:['Pitón y Ramesés','On y Menfis','Gosén y Zoán','Sucot y Etam'],r:'Éxodo 1:11',n:'Sucot y Etam fueron los primeros lugares donde acampó Israel al salir (12:37; 13:20).'},
 {l:2,q:'¿De qué tribu eran los padres de Moisés?',o:['Leví','Judá','Benjamín','Rubén'],r:'Éxodo 2:1',n:'Un varón de la familia de Leví tomó por mujer a una hija de Leví.'},
 {l:2,q:'¿Quién vigilaba de lejos la arquilla de juncos de Moisés?',o:['Su hermana','Su madre','Su padre','Una de las parteras'],r:'Éxodo 2:4',n:'Su hermana se ofreció después a buscarle una nodriza hebrea: su propia madre (2:7-8).'},
 {l:2,q:'¿Cómo se llamaba la esposa de Moisés?',o:['Séfora','Sifra','Asenat','Mical'],r:'Éxodo 2:21',n:'Era hija de Reuel, sacerdote de Madián, también llamado Jetro.'},
 {l:3,q:'¿Qué nombre dio Moisés a su primer hijo, porque dijo «forastero soy en tierra ajena»?',o:['Gersón','Eliezer','Eleazar','Finees'],r:'Éxodo 2:22',n:'Su segundo hijo fue Eliezer (18:4). Eleazar y Finees son hijo y nieto de Aarón.'},
 {l:2,q:'¿Qué respondió Dios cuando Moisés le preguntó cuál era su nombre?',o:['«YO SOY EL QUE SOY»','«El Dios Altísimo»','«Jehová de los ejércitos»','«El Shaddai»'],r:'Éxodo 3:14',n:'«Así dirás a los hijos de Israel: YO SOY me envió a vosotros».'},
 {l:2,q:'¿Qué le ocurrió a la mano de Moisés como segunda señal?',o:['Quedó leprosa como la nieve y luego volvió a estar sana','Se secó por completo','Se cubrió de fuego sin quemarse','Se volvió de oro'],r:'Éxodo 4:6-7',n:'La primera señal fue la vara convertida en culebra (4:3).'},
 {l:1,q:'¿Cuál fue la primera plaga sobre Egipto?',o:['Las aguas convertidas en sangre','Las ranas','Los piojos','Las tinieblas'],r:'Éxodo 7:20-21',n:'Los peces del río murieron y los egipcios no podían beber de él.'},
 {l:2,q:'¿Cuántos días duraron las densas tinieblas sobre Egipto?',o:['Tres días','Siete días','Un día','Cuarenta días'],r:'Éxodo 10:22-23',n:'Pero todos los hijos de Israel tenían luz en sus habitaciones.'},
 {l:1,q:'En la Pascua, ¿qué debían poner en los postes y el dintel de las casas?',o:['La sangre del cordero','Aceite de oliva','Una cinta escarlata','Ceniza del altar'],r:'Éxodo 12:7, 13',n:'«Veré la sangre y pasaré de vosotros». La cinta escarlata es de la historia de Rahab (Jos 2:18).'},
 {l:2,q:'¿Cómo debía comerse el cordero de la Pascua?',o:['Asado al fuego, con panes sin levadura y hierbas amargas, ceñidos y de prisa','Cocido en agua, con pan leudado','En el templo, con vino y aceite','Crudo, con sal y vinagre'],r:'Éxodo 12:8-11',n:'Con los lomos ceñidos, el calzado en los pies y el bordón en la mano.'},
 {l:2,q:'¿Cuántos hombres de a pie salieron de Egipto, sin contar a los niños?',o:['Como seiscientos mil','Setenta mil','Un millón','Cuatrocientos treinta mil'],r:'Éxodo 12:37',n:'Salieron de Ramesés a Sucot.'},
 {l:2,q:'¿Los huesos de quién llevó Moisés al salir de Egipto?',o:['De José','De Jacob','De Leví','De Aarón'],r:'Éxodo 13:19',n:'José lo había pedido con juramento (Gn 50:25). Jacob ya había sido sepultado en Macpela (Gn 50:13).'},
 {l:3,q:'¿Por qué Dios no llevó al pueblo por el camino de la tierra de los filisteos?',o:['Para que no se arrepintieran al ver la guerra y volvieran a Egipto','Porque era demasiado largo','Porque el mar lo cerraba','Porque los filisteos eran sus parientes'],r:'Éxodo 13:17-18',n:'Los rodeó por el camino del desierto del Mar Rojo.'},
 {l:1,q:'¿Dónde escondieron al niño Moisés para salvarlo?',o:['En una arquilla de juncos a la orilla del Nilo','En una cueva','En el palacio de Faraón','En el desierto'],r:'Éxodo 2:3',n:'Su madre la calafateó con asfalto y brea.'},
 {l:1,q:'¿Quién encontró a Moisés en el río?',o:['La hija de Faraón','La esposa de Faraón','María, su hermana','Una partera'],r:'Éxodo 2:5-6',n:'Tuvo compasión de él y lo crió como hijo suyo.'},
 {l:1,q:'¿Cómo se llamaba el hermano de Moisés que hablaba por él?',o:['Aarón','Josué','Caleb','Hur'],r:'Éxodo 4:14-16',n:'«Él hablará por ti al pueblo».'},
 {l:1,q:'¿Desde dónde le habló Dios a Moisés en el monte Horeb?',o:['Desde una zarza que ardía y no se consumía','Desde una nube','Desde un río','Desde un árbol seco'],r:'Éxodo 3:2-4',n:'«Quita tu calzado de tus pies, porque el lugar en que tú estás, tierra santa es».'},
 {l:1,q:'¿Cuántas plagas envió Dios sobre Egipto?',o:['Diez','Siete','Doce','Tres'],r:'Éxodo 7–12',n:'De la sangre en las aguas a la muerte de los primogénitos.'},
 {l:1,q:'¿Cuál fue la última plaga sobre Egipto?',o:['La muerte de los primogénitos','Las tinieblas','El granizo','Las langostas'],r:'Éxodo 12:29',n:'Después de ella, Faraón dejó ir al pueblo.'},
 {l:1,q:'¿Qué hizo Dios con el Mar Rojo para que Israel lo cruzara?',o:['Dividió las aguas y el pueblo pasó en seco','Lo congeló','Puso un puente de piedra','Lo secó durante un año'],r:'Éxodo 14:21-22',n:'Las aguas eran como un muro a la derecha y a la izquierda.'},
 {l:3,q:'¿Cómo se llamaba la madre de Moisés?',o:['Jocabed','Séfora','María','Sifra'],r:'Éxodo 6:20',n:'Séfora fue su esposa y María su hermana.'},
 {l:3,q:'Según Éxodo 12, ¿qué día se sacrificaba el cordero de la Pascua?',o:['El día catorce del primer mes, al atardecer','El día diez del séptimo mes','El día primero del primer mes','El día quince del tercer mes'],r:'Éxodo 12:2, 6',n:'El cordero se apartaba el día diez y se sacrificaba el catorce (12:3, 6).'},
 {l:3,q:'¿Cuál fue el primer lugar donde acampó Israel al salir de Ramesés?',o:['Sucot','Etam','Mara','Elim'],r:'Éxodo 12:37',n:'Después acamparon en Etam, a la entrada del desierto (13:20).'},
 {l:3,q:'¿En qué plaga apartó Dios por primera vez la tierra de Gosén, donde vivía su pueblo?',o:['Las moscas','Las ranas','Los piojos','El granizo'],r:'Éxodo 8:22',n:'«Para que sepas que yo soy Jehová en medio de la tierra».'},
 {l:3,q:'¿Cuántos carros escogidos llevó Faraón para perseguir a Israel?',o:['Seiscientos','Trescientos','Mil','Ciento veinte'],r:'Éxodo 14:7',n:'Además de todos los carros de Egipto, con sus capitanes.'},
 {l:3,q:'Después de cruzar el mar, ¿cuántos días anduvo el pueblo por el desierto de Shur sin hallar agua?',o:['Tres días','Siete días','Cuarenta días','Un día'],r:'Éxodo 15:22',n:'Luego llegaron a Mara, donde las aguas eran amargas.'},
 {l:3,q:'Ante Faraón, ¿qué vara devoró las varas de los hechiceros?',o:['La vara de Aarón','La vara de Moisés','La vara de Jetro','Ninguna'],r:'Éxodo 7:10-12',n:'Los hechiceros también convirtieron sus varas en culebras.'}
 ],
 secretos:[
 {s:'La vara que encontraste sobre el fondo del mar es la de un hombre que llegó tarde a su llamado.',q:'¿Qué edad tenían Moisés y Aarón cuando hablaron a Faraón?',o:['Moisés 80 y Aarón 83','Moisés 40 y Aarón 43','Moisés 80 y Aarón 77','Moisés 120 y Aarón 123'],r:'Éxodo 7:7',n:'Aarón era el mayor. Moisés murió a los 120 años (Dt 34:7).'},
 {s:'El tesoro es una tablilla con la genealogía de Leví.',q:'¿Cómo se llamaba el padre de Moisés?',o:['Amram','Coat','Izhar','Uziel'],r:'Éxodo 6:20',n:'Amram tomó por mujer a Jocabed, y ella dio a luz a Aarón y a Moisés. Coat era el abuelo.'},
 {s:'El tesoro es un mapa con el último campamento antes del mar.',q:'¿Delante de qué lugar acampó Israel junto al mar, frente a Baal-zefón?',o:['Pi-hahirot','Sucot','Etam','Mara'],r:'Éxodo 14:2, 9',n:'Allí los alcanzó el ejército de Faraón. Sucot y Etam fueron campamentos anteriores y Mara vino después.'}
 ]},

/* ---------------- SINAÍ · Éxodo 15 – Números ---------------- */
sinai:{
 voces:['Un anciano de Israel se sienta junto a su tienda.','La bocina suena a lo lejos.','Un levita repasa la ley en voz baja.','Junto al maná recogido, alguien te pregunta.','La nube se mueve sobre el tabernáculo.'],
 qs:[
 {l:2,s:'Al amanecer, algo menudo cubre el suelo alrededor del campamento.',q:'Según Éxodo 16, ¿a qué sabía el maná?',o:['A hojuelas con miel','A pan de cebada','A leche y miel','A higos secos'],r:'Éxodo 16:31',n:'Era como semilla de culantro, blanco, y su sabor como de hojuelas con miel.'},
 {l:2,s:'Un veterano recuerda la batalla en Refidim.',q:'Durante la batalla contra Amalec, ¿quiénes sostenían las manos de Moisés?',o:['Aarón y Hur','Josué y Caleb','Nadab y Abiú','Eleazar e Itamar'],r:'Éxodo 17:12',n:'Josué peleaba en el valle mientras Aarón y Hur sostenían las manos de Moisés.'},
 {l:2,s:'El pueblo espera y Moisés no baja.',q:'¿Cuánto tiempo estuvo Moisés en el monte cuando subió a recibir las tablas?',o:['Cuarenta días y cuarenta noches','Siete días','Tres días','Doce días'],r:'Éxodo 24:18',n:'La nube cubrió el monte seis días y al séptimo Dios llamó a Moisés.'},
 {l:3,s:'En un taller, alguien trabaja el oro con una destreza extraordinaria.',q:'¿A quién llenó Dios de su Espíritu para trabajar el oro, la plata y el bronce del tabernáculo?',o:['Bezaleel hijo de Uri, de la tribu de Judá','Eleazar hijo de Aarón','Coré hijo de Izhar','Itamar hijo de Aarón'],r:'Éxodo 31:2-5',n:'Bezaleel, nieto de Hur. Aholiab, de Dan, fue puesto con él.'},
 {l:2,s:'Doce varas quedan una noche delante del testimonio.',q:'Según Números 17, ¿qué ocurrió con la vara de Aarón?',o:['Reverdeció, echó flores y produjo almendras','Se convirtió en serpiente','Partió una roca','Se secó y se quebró'],r:'Números 17:8',n:'La vara que se volvió serpiente fue otra señal, ante Faraón (Éx 7:10).'},
 {l:2,q:'¿Qué echó Moisés en las aguas de Mara para endulzarlas?',o:['Un árbol','Sal','Su vara','Harina'],r:'Éxodo 15:25',n:'Siglos después, Eliseo sanó aguas con sal (2 R 2:21) y una olla con harina (2 R 4:41).'},
 {l:3,q:'¿Qué encontró el pueblo en Elim?',o:['Doce fuentes de agua y setenta palmeras','Siete fuentes y doce palmeras','Un pozo y un olivar','Doce piedras y setenta ancianos'],r:'Éxodo 15:27',n:'Acamparon allí junto a las aguas.'},
 {l:2,q:'¿Qué día de la semana no caía maná?',o:['El séptimo día, el día de reposo','El primer día','El día de luna nueva','Caía todos los días'],r:'Éxodo 16:26',n:'El sexto día recogían doble porción.'},
 {l:2,q:'¿Quién aconsejó a Moisés poner jueces sobre el pueblo?',o:['Jetro, su suegro','Aarón, su hermano','Josué, su ayudante','Hur'],r:'Éxodo 18:13-24',n:'«No está bien lo que haces… el trabajo es demasiado pesado para ti».'},

/* Muros de agua del mar abierto (Éxodo) */
function wall(c,w,h,t,side,P){
  const hy=h*.42,top0=hy-(hy-h*.06)*P,edge=f=>w*(.5+side*(.015+.145*f)*P),outer=side<0?0:w,N=40,pts=[[outer,top0]];
  for(let k=1;k<=N;k++){const f=k/N;const x=outer+(edge(0)-outer)*f;const base=top0+(hy-top0)*Math.pow(f,1.3);pts.push([x,base+Math.sin(f*14+t*2.2)*h*.012*(1-f*.7)*Math.max(.2,P)])}
  const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2b7299');g.addColorStop(1,'#0b2134');c.fillStyle=g;
  c.beginPath();c.moveTo(outer,h);pts.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(edge(0),hy);c.lineTo(edge(1),h);c.closePath();c.fill();
  if(P>.15){c.strokeStyle=`rgba(150,210,245,${.18*P})`;c.lineWidth=1;
    for(let j=1;j<9;j++){const f=j/9;const x=outer+(edge(0)-outer)*f*.92;const tp=top0+(hy-top0)*Math.pow(f,1.3);const off=((t*30+j*40)%Math.max(1,h-tp));c.beginPath();c.moveTo(x,tp+off);c.lineTo(x,Math.min(h,tp+off+h*.12));c.stroke()}}
  c.strokeStyle='rgba(225,242,255,.6)';c.lineWidth=2;c.beginPath();pts.forEach((p,k)=>k?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
  if(P>.15){c.strokeStyle='rgba(160,220,255,.4)';c.beginPath();c.moveTo(edge(0),hy);c.lineTo(edge(1),h);c.stroke()}
}

/* ============ Avance guardado: perfiles, niveles, campañas y copia de seguridad ============

     camino-del-pacto-perfiles  → lista de peregrinos, el último en jugar y los ajustes del equipo
     camino-del-pacto-p-<id>    → el avance de cada peregrino

   recorridos aparte. Las versiones 1.0 guardaban tracks:{<nivel>:S} solo del Antiguo Pacto. */
prepararCampanas();

const IDX_KEY='camino-del-pacto-perfiles',OLD_KEY='camino-del-pacto-v1',PKEY=id=>'camino-del-pacto-p-'+id;
function lsGet(k){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

/* Un recorrido vacío.
   done/best/stars: estaciones completadas, mejor puntaje y estrellas · found: tesoros hallados
   seen/correct/wrong: veces vista, bien respondida y pendiente de repaso, por pregunta
   solvedQ: preguntas secretas resueltas · heard: relatos escuchados completos · reached: última estación alcanzada */
const fresh=()=>({done:{},best:{},stars:{},found:{},solvedQ:{},seen:{},correct:{},wrong:{},badges:{},heard:{},bestStreak:0,reached:-1});

let IDX=lsGet(IDX_KEY)||{list:[],current:null,introSeen:false};
if(!Array.isArray(IDX.list))IDX.list=[];
const OLD=IDX.migrated?null:lsGet(OLD_KEY);

P.vol=Object.assign({music:45,sfx:70},P.vol||{});
function saveIdx(){IDX.prefs=P;lsSet(IDX_KEY,IDX)}
function aplicarLectura(){const r=document.documentElement;r.style.setProperty('--escala',String(P.text||1));r.classList.toggle('contraste',!!P.contrast)}
aplicarLectura();

/* Hasta la v0.6 las preguntas se identificaban por su posición en la lista (eden-3, eden-s1).
   LEGACY guarda esa lista original (huella del texto) para traducir lo guardado a los identificadores nuevos. */
const LEGACY={"eden":{"q":["a7dab480","82bcc65f","746510f0","d97b8519","d6961440","fd415138","015aacf4","9715b0fd","ddb7c0ee","666d1d5f","f403ae4f","9264c46c","98f88afc","f0f13a53","dbc581a9","c4d740e3","5a258e2b","3da5e132","112ef5b1"],"s":["2c3c87b0","9b5ac904","2fe44808"]},"diluvio":{"q":["6d8826c2","ac2e9405","a0071798","a60f1a3a","1eb26210","59710a93","0fac66bb","d8ee76f0","6609ff2d","5b384402","9b0c3d16","9ed319ae","190dc8db","f449876f","2c827dc6","ffe5db65","a673d564","55200946"],"s":["49a4b7c7","fdf6868e","c5474cc1"]},"abraham":{"q":["475e69cc","7a7755eb","e03fba95","5c302b05","578a8f62","fc938a74","a57a55b9","7f2c4128","e8199211","1b346c0e","5156d178","02380826","25fb0a41","af919a38","3ecb6c86","f4cf0856","6dc6f22a","274db9a5"],"s":["3ed50402","115bdc82","1210a790"]},"jose":{"q":["18096eac","afb46f89","d8d89d00","195a1060","0dbc1fa8","c024853e","13c2caa4","e172b8bd","f20d004f","a556b928","75943b21","70f6c85c","207214ed","6372f56a","f630c2e9","89b00b46","3ae5b7d4","37066973"],"s":["de21b1b5","63af010a","40371313"]},"exodo":{"q":["b1f49768","5dddf05e","cd44f5d7","caf20e52","c446df64","16b9ef57","acd63841","1cf638a0","843b04fc","58181b06","e1363474","c415cb4b","f072f6e0","026ee4de","425524e1","ce979df2","ea4b84ec","0c1577a7","85318c0c"],"s":["8ece457d","319401c7","eabab6da"]},"sinai":{"q":["cfbfcb17","bd231970","a11a7753","bab9a304","8c3cb074","af8e1a79","fb69dffe","80d178f1","9ef619fb","4476c469","64c6a350","7096376a","6f2807e3","9b8e2ebc","377f51ce","d6a91009","8c0bf2a5","c1cd117d","ad1841fd"],"s":["303ab6f0","c73dc1cd","799b80c3"]}};
function migrateQ(o){const r={};for(const k in (o||{})){const m=/^([a-z]+)-(s?)(\d+)$/.exec(k);if(!m){r[k]=o[k];continue}
  const L=LEGACY[m[1]],h=L&&L[m[2]?'s':'q'][+m[3]],id=h&&QID_BY_HASH[h];if(id)r[id]=o[k]}return r}

/* Completa y migra un recorrido guardado */
function normalize(st){
  const s=Object.assign(fresh(),st||{});
  ['heard','seen','correct','wrong','solvedQ','found','best','stars','done','badges'].forEach(k=>{if(!s[k]||typeof s[k]!=='object')s[k]={}});
  if(st&&st.reached==null)s.reached=campana('antiguo').estaciones.reduce((a,c,i)=>s.done[c.id]?i:a,-1);
  if(st&&st.solved){Object.keys(st.solved).forEach(id=>{s.solvedQ[id+'-s0']=true});delete s.solved}
  delete s.sound;delete s.voice;delete s.vol;
  if(s.qv!==2){['seen','correct','solvedQ'].forEach(k=>{s[k]=migrateQ(s[k])});s.qv=2}
  return s;
}
/* Resumen de un recorrido en una campaña: estaciones completadas, talentos e insignias */
function summary(s,cp){cp=cp||CAMP;s=s||fresh();
  return {stations:jugables(cp).filter(c=>s.done[c.id]).length,total:jugables(cp).length,
    talents:Object.values(s.best).reduce((a,b)=>a+b,0)+30*Object.keys(s.solvedQ).length,badges:Object.keys(s.badges).length}}

/* ---------- Niveles de dificultad ---------- */
const NIVELES={
 discipulo:{id:'discipulo',name:'Discípulo',grado:'Intermedio',ls:[1,2],m:2,lamps:3,pts:15,hint:true,hintCost:5,time:12,
   desc:'Para quien conoce las historias y quiere aprender sus detalles: personajes, lugares y sucesos.',ej:'¿Con qué se cubrieron Adán y su mujer después de comer del fruto?'},
 escriba:{id:'escriba',name:'Escriba',grado:'Muy difícil',ls:[3],m:3,lamps:2,pts:25,hint:false,hintCost:0,time:10,
   desc:'Como los escribas, que copiaban la ley letra por letra: edades, cifras, fechas y genealogías.',ej:'¿Qué edad tenía Matusalén cuando engendró a Lamec?'}};
let PD=null;
const LVL=()=>NIVELES[PD&&PD.level]||NIVELES.discipulo;
const inLevel=(q,n)=>n.ls.includes(q.l||2);
const levelRules=n=>[`${n.time} segundos para responder`,`${n.lamps} lámparas`,n.hint?`pergamino −${n.hintCost} talentos`:'sin pergamino',`${n.pts} talentos por acierto`];
function levelMeter(lv){return `<svg viewBox="0 0 36 24" class="lmeter" aria-hidden="true">${[0,1,2].map(i=>`<rect x="${2+i*12}" y="${16-i*7}" width="8" height="${6+i*7}" rx="1.5" class="${i<lv?'on':''}"/>`).join('')}</svg>`}

/* Lee el avance guardado de un peregrino y lo pasa al formato de la versión 3 */
function profileData(id){
  const raw=lsGet(PKEY(id))||{};
  const d={v:3,level:NIVELES[raw.level]?raw.level:null,camp:campana(raw.camp)?raw.camp:'antiguo',tracks:{}};
  if(raw.v===3&&raw.tracks){
    Object.keys(raw.tracks).forEach(cp=>{if(!campana(cp)||!raw.tracks[cp])return;d.tracks[cp]={};
      Object.keys(raw.tracks[cp]).forEach(n=>{if(NIVELES[n])d.tracks[cp][n]=normalize(raw.tracks[cp][n])})});
    return d}
  /* Versiones 0.7 a 1.0: un recorrido por nivel, solo del Antiguo Pacto */
  if(raw.tracks){d.tracks.antiguo={};Object.keys(raw.tracks).forEach(n=>{if(NIVELES[n])d.tracks.antiguo[n]=normalize(raw.tracks[n])});return d}
  /* Versiones anteriores: un solo recorrido sin nivel */
  const lv=raw.level==='omnisciente'?'escriba':raw.level?'discipulo':null;d.level=lv;
  const st=Object.assign({},raw);delete st.level;
  if(Object.keys(raw).length)d.tracks.antiguo={[lv||'discipulo']:normalize(st)};
  return d;
}
/* Recorrido de una campaña y un nivel (lo crea si no existe) */
function pista(cp,lv){PD.tracks[cp]=PD.tracks[cp]||{};return PD.tracks[cp][lv]=PD.tracks[cp][lv]||fresh()}
const pistaSiHay=(d,cp,lv)=>d&&d.tracks[cp]&&d.tracks[cp][lv]||null;

let S=null,PROFILE=null;
function save(){if(!S||!PROFILE||!PD)return;pista(CAMP.id,LVL().id);PD.tracks[CAMP.id][LVL().id]=S;PD.camp=CAMP.id;lsSet(PKEY(PROFILE.id),PD);PROFILE.last=Date.now();saveIdx()}

/* ---------- Copia de seguridad ----------
   Un archivo .json con todos los peregrinos de este navegador, para guardarlo o pasarlo a otro equipo. */
const COPIA_APP='camino-del-pacto';
function copiaDatos(){return {app:COPIA_APP,formato:1,fecha:new Date().toISOString(),
  peregrinos:IDX.list.map(pr=>({id:pr.id,name:pr.name,avatar:pr.avatar,created:pr.created,last:pr.last,calm:!!pr.calm,tut:!!pr.tut,datos:lsGet(PKEY(pr.id))||{}}))}}
function descargarCopia(){
  const d=new Date(),f=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const blob=new Blob([JSON.stringify(copiaDatos())],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`camino-del-pacto-copia-${f}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
/* Revisa un archivo de copia. Devuelve la lista de peregrinos válidos o lanza un error con el motivo */
function leerCopia(texto){
  let d;try{d=JSON.parse(texto)}catch(e){throw new Error('El archivo no es una copia del juego.')}
  if(!d||d.app!==COPIA_APP||!Array.isArray(d.peregrinos))throw new Error('El archivo no es una copia de El Camino del Pacto.');
  const ok=d.peregrinos.filter(p=>p&&typeof p.id==='string'&&/^[a-z0-9]{4,24}$/.test(p.id)&&typeof p.name==='string'&&p.name.trim()&&p.datos&&typeof p.datos==='object')
    .map(p=>({id:p.id,name:p.name.replace(/\s+/g,' ').trim().slice(0,20),avatar:AVATARS.some(a=>a.id===p.avatar)?p.avatar:AVATARS[0].id,
      created:+p.created||Date.now(),last:+p.last||0,calm:!!p.calm,tut:!!p.tut,datos:p.datos}));
  if(!ok.length)throw new Error('La copia no trae peregrinos.');
  return ok;
}
/* Agrega o reemplaza los peregrinos de la copia. Un peregrino con el mismo identificador se reemplaza;
   si solo coincide el nombre, el de la copia se guarda con otro nombre para no perder ninguno */
function aplicarCopia(lista){
  lista.forEach(p=>{
    const {datos,...pr}=p,i=IDX.list.findIndex(x=>x.id===pr.id);
    if(i>=0)IDX.list[i]=pr;
    else{let n=pr.name,k=2;while(IDX.list.some(x=>x.name.toLowerCase()===n.toLowerCase()))n=`${pr.name.slice(0,16)} (${k++})`;pr.name=n;IDX.list.push(pr)}
    lsSet(PKEY(pr.id),datos);
  });
  saveIdx();
}

<script>
/* ---- js/mapa.js ---- */

/* ---------- Encabezado, avisos e insignias ---------- */

  $('#sndLbl').textContent=P.sound?'Ajustes':'Silencio';$('#btnSound').classList.toggle('muted',!P.sound);$('#sndWaves').style.display=P.sound?'':'none';
}
/* Aviso flotante con botón × para cerrarlo. persist:true lo deja abierto hasta que el jugador lo cierre */
function toast(html,o){o=o||{};const t=document.createElement('div');t.className='toast'+(o.persist?' persist':'');t.setAttribute('role','status');
  t.innerHTML=`<div class="tbody">${html}</div><button class="tclose" type="button" aria-label="Cerrar aviso">×</button>`;
  const close=()=>{if(t._gone)return;t._gone=true;t.classList.add('out');setTimeout(()=>t.remove(),450)};
  t.querySelector('.tclose').onclick=close;$('#toasts').appendChild(t);if(!o.persist)setTimeout(close,o.ms||7000);return t}
function award(id){
  if(S.badges[id])return;const b=BADGES.find(x=>x.id===id);if(!b)return;
  S.badges[id]=Date.now();save();if(cur)cur.newB.push(id);beep(SND.badge);
  toast(`<span class="medal sm">${b.letter}</span><div><b>Insignia: ${b.name}</b><span>${b.desc}</span></div>`);updateHeader();
}
/* Insignias de logro: cada tipo sabe cuándo se gana (n = la cantidad que pide la insignia) */
const tipoDe=id=>QBYID[id]&&QBYID[id].tipo;
const LOGROS={
  tesoro1:()=>Object.keys(S.found).length>0,
  tesoros:()=>CH.every(c=>S.found[c.id]),
  secretos:b=>Object.keys(S.solvedQ).length>=b.n,
  lampara:()=>!!(cur&&cur.mode==='juego'&&!cur.lost),
  racha:b=>streak>=b.n,
  todas:()=>CH.every(c=>S.done[c.id]),
  relatos:()=>TRAVEL.slice(0,STOPS.length).every((_,k)=>S.heard[k]),
  sabio:b=>Object.keys(S.correct).length>=b.n,
  estrellas:b=>Object.values(S.stars).filter(x=>x>=3).length>=b.n,
  tipos:b=>Object.keys(S.correct).filter(id=>tipoDe(id)==='orden'||tipoDe(id)==='unir').length>=b.n,
  profecia:b=>Object.keys(S.correct).filter(id=>QBYID[id]&&QBYID[id].tema==='profecia').length>=b.n,
  /* Las dos alianzas: todas las campañas completas en el mismo nivel */
  alianzas:()=>CAMPANAS.every(cp=>{const t=cp.id===CAMP.id?S:pistaSiHay(PD,cp.id,LVL().id);return !!t&&jugables(cp).length>0&&jugables(cp).every(c=>t.done[c.id])})
};
function logro(tipo){BADGES.forEach(b=>{if(b.tipo===tipo&&!S.badges[b.id]&&LOGROS[tipo]&&LOGROS[tipo](b))award(b.id)})}

/* ================= MAPA ================= */
let M=null,TR=null;

const paginas=()=>CAMP.mapas.filter(m=>m.desde<STOPS.length);
function mapSVG(sel){
  const pg=mapaDe(sel),fin=Math.min(pg.hasta,STOPS.length-1),idx=[];for(let i=pg.desde;i<=fin;i++)idx.push(i);

}

  return `<nav class="mpages" aria-label="Páginas del mapa">${ps.map((p,k)=>`<button class="chip${p===now?' on':''}" data-pg="${k}" ${p===now?'aria-current="true"':''}>${k+1}. ${p.titulo}</button>`).join('')}</nav>`}
function rulesHTML(){const n=LVL(),totalQ=CH.reduce((a,c)=>a+c.qs.length,0),calm=PROFILE&&PROFILE.calm;
  return `<details class="rules"><summary><h3>Cómo se juega</h3></summary><ul>
<li>Entre estación y estación, el narrador cuenta con escenas animadas la historia que las une.</li>

function defaultSel(){if(S.reached<0)return 0;for(let i=0;i<CH.length;i++)if(unlocked(i)&&!S.done[CH[i].id])return i;return Math.min(CH.length,STOPS.length-1)}
