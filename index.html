<style>
/* El Camino del Pacto — estilos
   Layout: noche en el desierto. Inicio = mapa de las tierras del Antiguo Pacto (con viñetas animadas del relato encima);
   estación = escena animada con cine y subtítulos a la izquierda, pergamino de pruebas a la derecha (apilado en pantallas angostas). */
:root{
  --night:#0c1120; --night-2:#121830; --panel:#18203a; --line:#2b3558;
  --sand:#ece2ca; --muted:#a4a6bd; --gold:#e5b04b; --gold-dim:#8c6a2a; --clay:#a8743c;
  --good:#8dbb6e; --bad:#de7258; --good-bg:rgba(141,187,110,.13); --bad-bg:rgba(222,114,88,.13);
  --ink:#1c1406; --sea:#0f2236; --land:#141a31; --dark:#03050b;
  --display:"Marcellus","Trajan Pro",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --hebrew:"Frank Ruhl Libre","David","Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 520px at 75% -8%,#1e2748 0%,transparent 62%),var(--night);color:var(--sand);font-family:var(--body);font-size:17px;line-height:1.5}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:1220px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.seal{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--gold);color:var(--gold);font:700 15px/1 var(--hebrew);box-shadow:inset 0 0 0 4px var(--night),inset 0 0 0 5px var(--gold-dim);flex:none}
h1{font:400 clamp(22px,2.6vw,30px)/1.1 var(--display);margin:0;letter-spacing:.03em}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--sand);font:500 15px var(--body);cursor:pointer}
.chip b{color:var(--gold);font-variant-numeric:tabular-nums}
.chip.static{cursor:default}
.chip:hover:not(.static){border-color:var(--gold-dim)}
.chip svg{width:17px;height:17px;flex:none}
.chip.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}

/* Comunes */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel p,.panel h2,.panel h3{margin:0}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
h2{font:400 clamp(25px,2.8vw,33px)/1.15 var(--display);text-wrap:balance}
.lead{max-width:62ch}
.note{color:var(--muted);font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:12px 18px;font:700 16px var(--body);cursor:pointer;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--sand);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover:not(:disabled){border-color:var(--gold-dim)}
.btn.small{padding:8px 13px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Relato */
.tale{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tale li{color:var(--muted);padding-left:14px;border-left:2px solid var(--line);max-width:62ch}
.tale li.now{color:var(--sand);border-left-color:var(--gold)}

/* Cine: franjas negras y subtítulos (escenas de estación y viñetas del mapa) */
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;z-index:2;transition:height .9s ease;pointer-events:none}
.film::before{top:0}
.film::after{bottom:0}
.film.cine::before,.film.cine::after{height:8%}
.subs{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:34px 7% 4.5%;background:linear-gradient(transparent,rgba(0,0,0,.85) 42%);color:#f6efdc;font:italic 400 clamp(15px,1.65vw,20px)/1.42 var(--body);text-align:center;text-wrap:balance;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;transition:opacity .6s;min-height:3em}
.subs.on{opacity:1}

/* Mapa */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.mapbox{position:relative;background:var(--land);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.vig{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1s ease;pointer-events:none;background:#000;z-index:1}
.vig.on{opacity:1}
.m-land{fill:var(--land)}
.m-sea{fill:var(--sea)}
.m-river{fill:none;stroke:#24476a;stroke-width:3;stroke-linecap:round}
.m-lbl{fill:#62709a;font:italic 19px var(--body);letter-spacing:.1em}
.m-title{fill:var(--sand);font:24px var(--display);letter-spacing:.06em}
.m-star{fill:#fff6dc}
.seg{fill:none;stroke:#3b4672;stroke-width:3.5;stroke-dasharray:1 11;stroke-linecap:round}
.seg.done{stroke:var(--gold)}
.trail{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;opacity:.85}
#mdark{fill:var(--dark);transition:opacity 2.8s ease;pointer-events:none}
.tok{pointer-events:none}
.tok .halo{fill:var(--gold);opacity:.22;transform-box:fill-box;transform-origin:center;animation:breath 2.6s ease-in-out infinite}
.tok .core{fill:#fff2c4;stroke:var(--gold);stroke-width:2}
.tok .stem{stroke:var(--gold);stroke-width:2}
.tok.pop .halo{animation:popr 1.4s ease-out}
@keyframes breath{50%{transform:scale(1.35);opacity:.1}}
@keyframes popr{0%{transform:scale(.3);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.node{cursor:pointer}
.node:focus{outline:none}
.node .base{fill:var(--panel);stroke:var(--line);stroke-width:2.5}
.node.open .base{stroke:var(--gold)}
.node.done .base{fill:var(--gold);stroke:#f3d48b}
.node.sel .base{stroke:var(--sand);stroke-width:4}
.node:focus-visible .base{stroke:#fff;stroke-width:5}
.node .n{fill:var(--sand);font:500 20px var(--body);text-anchor:middle;dominant-baseline:central}
.node.done .n{fill:var(--ink);font:700 24px var(--hebrew)}
.node .lbl{fill:var(--sand);font:20px var(--display);text-anchor:middle}
.node.locked{opacity:.5}
.node.soon .base{stroke-dasharray:4 5}
.node .ring{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.75);opacity:0}}
.facts{display:grid;gap:8px;margin:0}
.facts div{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}
.facts dt{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.facts dd{margin:0}
.mini-medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;margin-right:8px;font:700 14px/1 var(--hebrew);background:var(--gold);color:var(--ink);vertical-align:middle}
.mini-medal.off{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rules{border-top:1px solid var(--line);padding-top:14px}
.rules summary{cursor:pointer;color:var(--muted);list-style-position:inside}
.rules summary::marker{color:var(--gold)}
.rules h3{display:inline;font:400 18px var(--display);color:var(--sand)}
.rules[open] summary{margin-bottom:6px}
.rules ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:5px}

/* Estación */
.play{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.stagewrap{position:sticky;top:12px;min-width:0}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/11;max-width:100%;background:#05070d}
.stage canvas{display:block;width:100%;height:100%;cursor:crosshair}
.cap{position:absolute;left:14px;bottom:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);text-shadow:0 1px 3px #000;pointer-events:none;transition:opacity .5s}
.stage.cine .cap{opacity:0}
.found-tag{position:absolute;top:12px;right:12px;z-index:4;background:rgba(12,17,32,.8);border:1px solid var(--gold);color:var(--gold);font-size:13px;padding:4px 11px;border-radius:999px;pointer-events:none}
.stage-note{font-size:14px;color:var(--muted);margin:8px 2px 0}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lamps{display:flex;gap:4px}
.lamp svg{width:26px;height:26px;display:block}
.lamp .fl{fill:var(--gold)}
.lamp .bd{fill:var(--clay)}
.lamp.off{opacity:.25}
.lamp.off .fl{fill:transparent}
.prog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.dots i.d{background:var(--gold-dim)}
.dots i.c{background:var(--gold)}
.pts b{color:var(--gold);font-variant-numeric:tabular-nums}
.qtimer{display:flex;align-items:center;gap:10px}
.qtimer .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.qtimer i{display:block;height:100%;background:var(--gold);transition:width .1s linear}
.qtimer b{min-width:2ch;text-align:right;font:400 20px var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.qtimer.low i{background:var(--bad)}
.qtimer.low b{color:var(--bad)}
.qtimer.reading i{width:0;background:var(--muted);animation:readfill linear forwards}
.qtimer .tl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@keyframes readfill{to{width:100%}}
.story{font-style:italic;color:var(--muted)}
.q{font:400 22px/1.32 var(--display);text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--night-2);color:var(--sand);font:16px/1.35 var(--body);cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px)}
.opt:disabled{cursor:default;color:var(--sand)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold-dim);display:grid;place-items:center;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{border-color:var(--good);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{border-color:var(--bad);color:var(--bad)}
.opt.gone{opacity:.38;text-decoration:line-through}
.hintline{color:var(--gold);font-size:15px}
.feedback{padding:14px 16px;border-radius:10px;background:var(--night-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.verdict{font:400 21px var(--display)}
.is-ok .verdict{color:var(--good)}
.is-bad .verdict{color:var(--bad)}
.ref{color:var(--gold);font-size:14px;letter-spacing:.04em}
.warn{color:var(--bad)}
.secret-banner{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px dashed var(--gold);border-radius:10px}
.secret-banner .heb{font:700 30px/1 var(--hebrew);color:var(--gold)}
.secret-banner b{display:block;font:400 19px var(--display)}
.secret-banner span.s{font-size:14px;color:var(--muted)}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tally div{background:var(--night-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column}
.tally b{font:400 28px var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.tally span{font-size:13px;color:var(--muted)}
.earned h3{font:400 18px var(--display);margin:0 0 8px}
.earned-row{display:flex;flex-wrap:wrap;gap:12px}
.earned-b{display:flex;align-items:center;gap:8px}

/* Medallas */
.medal{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font:700 32px/1 var(--hebrew);color:#2a1a05;background:radial-gradient(circle at 34% 30%,#f8dc97,#d39a35 58%,#7d5519);box-shadow:inset 0 0 0 3px rgba(255,255,255,.22),0 0 0 2px var(--gold-dim);flex:none}
.medal.sm{width:40px;height:40px;font-size:20px}

/* Ventanas */
.modal{position:fixed;inset:0;background:rgba(5,8,16,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30}
.sheet{width:100%;max-width:900px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet.narrow{max-width:520px}
.sheet h2,.sheet p{margin:0}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:16px 12px;border:1px solid var(--line);border-radius:12px;background:var(--night-2)}
.badge b{font:400 17px var(--display)}
.badge span.d{font-size:14px;color:var(--muted)}
.badge em{font-style:normal;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.badge.locked .medal{background:var(--panel);color:#46507a;box-shadow:inset 0 0 0 2px var(--line)}
.badge.locked b{color:var(--muted)}
.sheet-foot{display:flex;justify-content:flex-end}
.set{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.set .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.set label{font-weight:500}
.set input[type=range]{width:100%;accent-color:var(--gold)}
.set output{font-variant-numeric:tabular-nums;color:var(--gold);min-width:4ch;text-align:right}
.sw{display:flex;gap:10px;align-items:center;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--gold);margin:0}

/* Avisos */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:40;max-width:min(360px,calc(100vw - 32px))}
.toast{position:relative;display:flex;align-items:flex-start;background:var(--panel);border:1px solid var(--gold-dim);border-radius:12px;padding:10px 6px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .45s cubic-bezier(.2,.8,.2,1)}
.toast .tbody{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.toast.persist{border-color:var(--gold)}
.tclose{flex:none;width:32px;height:32px;margin:-4px 0 0 6px;border:0;border-radius:8px;background:none;color:var(--muted);font:400 24px/1 var(--body);cursor:pointer}
.tclose:hover{color:var(--sand);background:var(--night-2)}
.oldsave{align-items:flex-start;font-size:15px;color:var(--muted)}
.oldsave input{margin-top:2px}
.toast b{display:block;font:400 16px var(--display);color:var(--gold)}
.toast span{font-size:14px;color:var(--sand)}
.toast.out{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.toast .upd{display:flex;flex-direction:column;gap:6px}
.toast .upd .actions{gap:6px;margin-top:4px}
.toast a.btn{text-decoration:none;display:inline-block}
.toast .btn.ghost{font-size:14px}
.toast .star{font:700 24px/1 var(--hebrew);color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

@media (max-width:980px){.play{grid-template-columns:1fr}.stagewrap{position:static}}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}}
@media (max-width:520px){.tally b{font-size:22px}.q{font-size:20px}.panel{padding:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Peregrinos: emblemas, preludio, menú inicial y creación */
.chip.player{padding:4px 13px 4px 4px}
.pav svg{width:26px;height:26px;display:block}
.av{display:block;border-radius:50%;flex:none}
.av.sm{width:34px;height:34px}
.av.lg{width:64px;height:64px}
.av.xl{width:120px;height:120px}
.intro{display:flex;flex-direction:column;align-items:center;gap:18px}
.introbox{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.actions.center{justify-content:center}
.menu{display:flex;flex-direction:column;gap:20px}
.menu-head{display:flex;flex-direction:column;gap:6px}
.menu-head h2,.menu-head p{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.pmain{display:flex;gap:16px;align-items:center;width:100%;height:100%;padding:18px 18px 18px 18px;background:none;border:0;color:var(--sand);text-align:left;cursor:pointer;border-radius:14px;font:inherit}
.pmain:hover{background:var(--night-2)}
.pinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.pinfo b{font:400 22px var(--display);overflow-wrap:anywhere;padding-right:64px}
.pinfo span{font-size:14px;color:var(--muted)}
.pinfo .plast{color:var(--gold)}
.pdel{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--muted);font:14px var(--body);cursor:pointer;padding:4px 8px;border-radius:6px}
.pdel:hover{color:var(--bad)}
.pnew{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:18px;border-style:dashed;color:var(--sand);cursor:pointer;font:inherit;min-height:100px}
.pnew:hover{border-color:var(--gold-dim);background:var(--night-2)}
.pnew .plus{font:400 34px/1 var(--display);color:var(--gold)}
.pnew b{font:400 20px var(--display)}
.pnew span{font-size:14px;color:var(--muted)}
.pconfirm{padding:18px;display:flex;flex-direction:column;gap:12px}
.pconfirm p{margin:0}
.btn.danger{background:var(--bad);color:#1c0a06}
.create{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:start}
.cprev{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 18px;text-align:center}
.cprev b{font:400 28px var(--display);overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field label,.field legend{font-weight:500;padding:0;margin-bottom:8px}
#pname{background:var(--night-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--sand);font:18px var(--body);width:100%}
#pname:focus{outline:2px solid var(--gold);outline-offset:1px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.avopt{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-size:13px;color:var(--muted);padding:8px 4px;border-radius:10px}
.avopt input{position:absolute;opacity:0;pointer-events:none}
.avopt .av{width:52px;height:52px;transition:transform .15s}
.avopt:hover .av{transform:scale(1.06)}
.avopt:has(input:checked){background:var(--night-2);color:var(--sand)}
.avopt input:checked + .av{outline:3px solid var(--gold);outline-offset:3px}
.avopt input:focus-visible + .av{outline:2px dashed var(--sand);outline-offset:3px}
.err{color:var(--bad);margin:0}
@media (max-width:760px){.create{grid-template-columns:1fr}.cprev{padding:4px}.av.xl{width:88px;height:88px}}
.set select{background:var(--night-2);color:var(--sand);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px var(--body);width:100%}
.set select:focus{outline:2px solid var(--gold);outline-offset:1px}

/* Niveles de dificultad */
.lmeter{width:26px;height:18px;flex:none;display:block}
.lmeter rect{fill:var(--line)}
.lmeter rect.on{fill:var(--gold)}
.chip.lvl{gap:6px}
.toast .lmeter{width:34px;height:24px}
.levels{display:flex;flex-direction:column;gap:20px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.lcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--sand);font:inherit;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.lcard:hover{border-color:var(--gold-dim);background:var(--night-2)}
.lcard.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.lhead{display:flex;align-items:center;justify-content:space-between;width:100%}
.lhead .lmeter{width:44px;height:30px}
.lhead em{font-style:normal;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.lcard b{font:400 26px var(--display)}
.ldesc{color:var(--sand)}
.lcard ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:3px}
.lex{font-style:italic;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:10px;width:100%}
.lhead em.lg{color:var(--muted)}
.lprog{font-size:14px;color:var(--gold)}
.sheet.levelwarn{border-color:var(--gold)}
.lwarn{display:flex;flex-direction:column;gap:10px}
.lwarn p{margin:0}

/* Pantallas bajas: encabezado compacto */
@media (max-height:820px){
  .app{padding-top:8px;gap:12px}
  .top{padding-block:2px 8px}
  .seal{width:40px;height:40px;font-size:12px}
  h1{font-size:22px}
  .sub{font-size:11px}
  .chip{padding:5px 11px;font-size:14px}
}
/* Pantallas anchas: todo cabe en la ventana, sin desplazar la página.
   #view es contenedor de tamaño: 100cqh = alto disponible bajo el encabezado. */
@media (min-width:981px) and (min-height:460px){
  .app{height:100vh;height:100dvh;padding-bottom:14px}
  #view{flex:1;min-height:0;container-type:size;overflow:auto}
  .intro{height:100%}
  .introbox{width:min(100%,calc((100cqh - 66px)*16/9));flex:none}
  .mapwrap{height:100%;grid-template-columns:min(calc(100% - 420px),calc(100cqh*1000/620)) minmax(0,1fr)}
  .play{height:100%;grid-template-columns:min(calc(100% - 480px),calc((100cqh - 36px)*16/11)) minmax(0,1fr)}
  #mpanel,#qp{max-height:100%;overflow:auto}
  .levels{min-height:100%;justify-content:center}
}
@media (min-width:981px) and (max-height:820px){
  .panel{padding:18px;gap:11px}
  .q{font-size:20px}
  .opts{grid-template-columns:1fr 1fr}
  .opt{height:100%;padding:9px 12px}
  .feedback{padding:11px 14px;gap:4px}
  .lcard{padding:16px;gap:7px}
}
/* Pantallas angostas (escena arriba, panel abajo): durante las preguntas la escena se achica para dejar lugar a las opciones */
@media (max-width:980px){
  .play.quiz .stage{width:min(100%,calc(28vh*16/11));width:min(100%,calc(28dvh*16/11));margin-inline:auto}
  .play.quiz .stage-note{display:none}
}
@media (max-width:600px){
  .app{gap:10px}
  .top{gap:8px}
  .seal{width:34px;height:34px;font-size:11px}
  h1{font-size:19px}
  .sub{display:none}
  .stats{gap:6px}
  .chip{padding:5px 10px;font-size:14px;gap:5px}
  .chip .lbl{display:none}
  .panel{padding:14px;gap:10px}
  .q{font-size:19px}
  .opts{gap:8px}
  .opt{padding:9px 12px}
  .play.quiz .story{display:none}
}

/* ===== Versión 2: campañas, estrellas, tipos de pregunta, avance, ajustes y lectura ===== */
/* Lectura: tamaño de letra (--escala) y alto contraste */
:root{--escala:1}
.panel,.sheet,.toast,.menu,.create,.levels{zoom:var(--escala)}
.contraste{--muted:#d3d5e6;--line:#56648f;--sand:#fffaf0}
.contraste .m-lbl{fill:#9aa8d4}
.contraste .opt,.contraste .chip{border-width:1.5px}
.seal{letter-spacing:.02em}
.chip .cseal{font:700 13px/1 var(--hebrew);color:var(--gold)}
.lcard .bigseal{font:700 34px/1 var(--hebrew);color:var(--gold)}
.lcard:disabled{opacity:.6;cursor:not-allowed}
/* Mapa por páginas y estrellas */
.mpages{position:absolute;right:10px;top:10px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mpages .chip{padding:5px 11px;font-size:13px;background:rgba(18,24,48,.85)}
.mapbox.cine .mpages{display:none}
.chip.on{border-color:var(--gold);color:var(--gold)}
.node .nstars{fill:var(--gold);font:15px var(--body);text-anchor:middle;letter-spacing:1px}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars i{font-style:normal;color:#46507a;font-size:1.1em}
.stars i.on{color:var(--gold)}
.stars.sm i{font-size:.95em}
/* Tipos de pregunta */
.qtype{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
.qtimer.calm{justify-content:flex-start}
.opt.picked{border-color:var(--gold);background:rgba(229,176,75,.08)}
.opt.picked .k{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.opt.fixed{opacity:.8}
.unir{display:grid;gap:8px}
.urow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--night-2);color:var(--sand);font:16px/1.3 var(--body);cursor:pointer}
.urow .ur{color:var(--gold);border-left:1px dashed var(--line);padding-left:10px}
.urow.act{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.urow.ok{border-color:var(--good);background:var(--good-bg)}
.urow.bad{border-color:var(--bad);background:var(--bad-bg)}
.urow:disabled{cursor:default}
.chips{display:grid;gap:8px}
.opt.chip2.used{opacity:.45}
.sol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
/* Ventanas: pestañas, estadísticas, ajustes, tutorial y copias */
.tabs{display:flex;gap:8px}
.tablewrap{overflow-x:auto}
table.stats{width:100%;border-collapse:collapse;font-size:15px}
table.stats th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
table.stats td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}

<script>
/* ---- js/util.js ---- */
/* ============ Utilidades compartidas ============ */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
/* Números aleatorios con semilla (para que estrellas y gotas no cambien entre cuadros) */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
/* Progreso local: 0 antes de a, 1 después de b */
const seg=(p,a,b)=>cl((p-a)/(b-a));
/* Suavizado entrada-salida */
const ez=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
/* Escapa texto escrito por el usuario antes de insertarlo como HTML */
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
/* Huella corta de un texto (FNV-1a de 32 bits sobre UTF-8) */
function hash32(t){const b=new TextEncoder().encode(String(t).normalize('NFC'));let h=0x811c9dc5;for(const x of b){h^=x;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}

</script>
<script>
/* ---- js/dibujo.js ---- */
/* ============ Biblioteca de dibujo (Canvas 2D) ============
   Piezas reutilizables para las escenas de las estaciones y las viñetas de los relatos.
   Todas reciben el contexto c y medidas en píxeles; las escenas trabajan con fracciones de w y h.
   Cielo, suelo y relieve · agua · ciudades y edificios · plantas · figuras · luz y fuego · texto. */
const R=rng(20261025);
const STARS=Array.from({length:240},()=>({x:R(),y:R(),r:.4+R()*1.2,p:R()*TAU,s:.6+R()*2.2}));
const RAIN=Array.from({length:170},()=>({x:R(),y:R(),l:.03+R()*.04,s:.9+R()*.6}));
const PUFF=Array.from({length:46},()=>({a:R()*TAU,r:.6+R()*.5,s:.15+R()*.25,z:.5+R()*.8}));
const SMOKE=Array.from({length:40},()=>({x:R()*2-1,p:R(),s:.4+R()*.6,z:.6+R()}));
const TREES=[{x:.17,y:.79,s:.2},{x:.31,y:.77,s:.14},{x:.48,y:.79,s:.25,life:1},{x:.63,y:.765,s:.13},{x:.75,y:.79,s:.18}];

/* ---------- Cielo, suelo y relieve ---------- */
function vg(c,h,stops){const g=c.createLinearGradient(0,0,0,h);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function glow(c,x,y,r,col){if(!(r>0))return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function stars(c,w,h,t,maxY,n){c.fillStyle='#fff6dc';for(let i=0;i<Math.min(n,STARS.length);i++){const s=STARS[i];c.globalAlpha=.3+.7*Math.abs(Math.sin(t*s.s*.5+s.p));c.beginPath();c.arc(s.x*w,s.y*h*maxY,s.r,0,TAU);c.fill()}c.globalAlpha=1}
function ridge(c,w,h,y,amp,freq,ph,col){c.fillStyle=col;c.beginPath();c.moveTo(0,h);for(let x=0;x<=w+1;x+=w/60)c.lineTo(x,h*y+Math.sin(x/w*freq*TAU+ph)*h*amp+Math.sin(x/w*freq*2.7*TAU+ph*1.7)*h*amp*.35);c.lineTo(w,h);c.closePath();c.fill()}
/* Cielos predefinidos: fondo completo según la hora */
const SKIES={
 day:[[0,'#7fb2d6'],[.7,'#e6efe0']],dusk:[[0,'#3a3a6a'],[.5,'#e09a5a'],[.72,'#f5d39a']],night:[[0,'#050816'],[.7,'#1b2142']],
 dawn:[[0,'#2d3f63'],[.55,'#e0a868'],[.75,'#f3d29a']],storm:[[0,'#0b111c'],[.6,'#243041'],[1,'#1a2533']],
 desert:[[0,'#d98e54'],[.75,'#f3cf93']],gold:[[0,'#f0cf86'],[.6,'#e8b070']],dark:[[0,'#04060f'],[1,'#141a34']],
 haze:[[0,'#9cc8e2'],[.7,'#eaf0d0']],red:[[0,'#1d1424'],[.7,'#7a3a2a']],sea:[[0,'#8fc1e0'],[.6,'#f4dfb4']]};
function sky(c,w,h,name){c.fillStyle=vg(c,h,SKIES[name]||SKIES.day);c.fillRect(0,0,w,h)}
function ground(c,w,h,y,col){c.fillStyle=col;c.fillRect(0,h*y,w,h*(1-y)+1)}
function sun(c,x,y,r,col){glow(c,x,y,r*5,'rgba(255,240,190,.6)');c.fillStyle=col||'#fff1b8';c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function moon(c,x,y,r){c.fillStyle='#eef0f7';c.beginPath();c.arc(x,y,r,Math.PI*.5,Math.PI*1.5);c.ellipse(x,y,r*.45,r,0,Math.PI*1.5,Math.PI*.5,true);c.fill()}
function clouds(c,w,h,t,n,y,col,sp){c.fillStyle=col;for(let k=0;k<n;k++){const x=((k*190+t*(sp||12))%(w+300))-150;c.beginPath();c.ellipse(x,h*(y+(k%3)*.05),w*.16,h*.06,0,0,TAU);c.fill()}}
/* Monte con forma de pico a partir de puntos [x,y] en fracciones */
function peak(c,w,h,pts,col){c.fillStyle=col;c.beginPath();pts.forEach(([x,y],k)=>k?c.lineTo(x*w,y*h):c.moveTo(x*w,y*h));c.closePath();c.fill()}

/* ---------- Agua ---------- */
function wave(c,w,h,t,y,amp,freq,sp,col){c.fillStyle=col;c.beginPath();c.moveTo(0,h);for(let x=0;x<=w+1;x+=w/50)c.lineTo(x,h*y+Math.sin(x/w*freq*TAU+t*sp)*h*amp+Math.sin(x/w*freq*2.3*TAU-t*sp*1.3)*h*amp*.4);c.lineTo(w,h);c.closePath();c.fill()}
/* Río o lago con destellos que se mueven */
function water(c,w,h,t,y0,y1,col){c.fillStyle=col||'#2e6d84';c.fillRect(0,h*y0,w,h*(y1-y0));c.strokeStyle='rgba(220,240,255,.35)';c.lineWidth=1.2;
  for(let k=0;k<16;k++){const x=((k*151+t*28)%(w+60))-30,y=h*(y0+(y1-y0)*((k%5)+.5)/5);c.beginPath();c.moveTo(x,y);c.lineTo(x+14+(k%3)*7,y);c.stroke()}}
/* Barca con vela; o.sail=false la deja sin vela, o.tilt la inclina (tormenta) */
function boat(c,x,y,s,t,o){o=o||{};c.save();c.translate(x,y);c.rotate((o.tilt||0)*Math.sin(t*1.7)+(o.lean||0));
  c.fillStyle=o.col||'#5c3e22';c.beginPath();c.moveTo(-s,-s*.18);c.lineTo(s,-s*.18);c.lineTo(s*.75,s*.12);c.lineTo(-s*.75,s*.12);c.closePath();c.fill();
  if(o.sail!==false){c.strokeStyle='#3a2a1a';c.lineWidth=Math.max(1,s*.04);c.beginPath();c.moveTo(0,-s*.18);c.lineTo(0,-s*1.1);c.stroke();
    c.fillStyle=o.sailCol||'#e9e0c8';c.beginPath();c.moveTo(s*.04,-s*1.05);c.quadraticCurveTo(s*.6+Math.sin(t*2)*s*.05,-s*.65,s*.04,-s*.26);c.closePath();c.fill()}
  c.restore()}

/* ---------- Ciudades y edificios ---------- */
/* Muralla con torres y puerta. o.fall (0–1) la derrumba; o.gate=false sin puerta */
function city(c,x,y,wd,ht,o){o=o||{};const col=o.col||'#a8885e',dk=o.dark||'#7a5f3e',f=o.fall||0;
  const towers=o.towers||5,tw=wd/(towers*3);
  for(let k=0;k<towers;k++){const tx=x+k*(wd-tw)/(towers-1),drop=f*ht*(.6+.4*Math.sin(k*2.3));c.save();if(f>0){c.translate(tx+tw/2,y);c.rotate(f*.25*(k%2?1:-1));c.translate(-tx-tw/2,-y)}
    c.fillStyle=dk;c.fillRect(tx,y-ht*1.35+drop,tw,ht*1.35-drop);c.fillStyle=col;for(let j=0;j<3;j++)c.fillRect(tx+j*tw/3,y-ht*1.45+drop,tw/5,ht*.1);c.restore()}
  c.fillStyle=col;c.save();if(f>0){c.globalAlpha=1-f*.4}
  c.fillRect(x,y-ht*(1-f*.75),wd,ht*(1-f*.75));c.fillStyle='rgba(0,0,0,.12)';for(let r=1;r<5;r++)c.fillRect(x,y-ht*(1-f*.75)+r*ht*.2*(1-f*.75),wd,1);c.restore();
  if(o.gate!==false&&f<.5){c.fillStyle='#2a1c12';const gx=x+wd*.5,gw=wd*.08;c.beginPath();c.moveTo(gx-gw,y);c.lineTo(gx-gw,y-ht*.55);c.arc(gx,y-ht*.55,gw,Math.PI,0);c.lineTo(gx+gw,y);c.closePath();c.fill()}
  if(f>0){c.fillStyle=dk;for(let k=0;k<26;k++){const rx=x+((k*.137)%1)*wd,ry=y-((k*.29)%1)*ht*.3*f;c.fillRect(rx,ry,ht*.12,ht*.08)}}}
/* Casas de techo plano */
function houses(c,x,y,n,s,o){o=o||{};for(let k=0;k<n;k++){const hx=x+k*s*1.15,hh=s*(.7+((k*7)%5)*.12);c.fillStyle=k%2?(o.col||'#c9a272'):(o.col2||'#b8915f');c.fillRect(hx,y-hh,s,hh);
  c.fillStyle='rgba(40,25,15,.75)';c.fillRect(hx+s*.35,y-hh*.55,s*.2,s*.25);if(o.lit&&k%2===0){c.fillStyle='rgba(255,190,90,.8)';c.fillRect(hx+s*.36,y-hh*.54,s*.18,s*.23)}}}
/* Templo con columnas y techo; o.gold añade brillo dorado */
function temple(c,x,y,s,o){o=o||{};const col=o.col||'#e3d3b0';
  c.fillStyle='#b9a47e';c.fillRect(x-s*1.1,y-s*.1,s*2.2,s*.1);c.fillRect(x-s,y-s*.18,s*2,s*.08);
  c.fillStyle=col;for(let k=0;k<6;k++)c.fillRect(x-s*.9+k*s*.34,y-s*.95,s*.14,s*.77);
  c.fillRect(x-s,y-s*1.08,s*2,s*.14);c.beginPath();c.moveTo(x-s*1.05,y-s*1.08);c.lineTo(x,y-s*1.45);c.lineTo(x+s*1.05,y-s*1.08);c.closePath();c.fill();
  if(o.gold){glow(c,x,y-s*1.1,s*1.2,'rgba(255,215,120,.35)');c.fillStyle='#e5b04b';c.fillRect(x-s,y-s*1.1,s*2,s*.04)}}
/* Altar de piedras; con fuego si o.fire */
function altar(c,x,y,s,t,o){o=o||{};c.fillStyle=o.col||'#6d625a';for(let r=0;r<3;r++)for(let k=0;k<4-r;k++){c.beginPath();c.ellipse(x+(k-(3-r)/2)*s*.28,y-r*s*.2-s*.1,s*.15,s*.11,0,0,TAU);c.fill()}
  if(o.fire)flame(c,x,y-s*.55,s*.5*o.fire,t)}
/* Tumba cavada en la roca; open (0–1) rueda la piedra */
function tomb(c,x,y,s,open){c.fillStyle='#4a4038';c.beginPath();c.moveTo(x-s*1.4,y);c.quadraticCurveTo(x-s*1.2,y-s*1.5,x,y-s*1.6);c.quadraticCurveTo(x+s*1.3,y-s*1.5,x+s*1.5,y);c.closePath();c.fill();
  c.fillStyle='#0d0a08';c.beginPath();c.arc(x,y-s*.45,s*.45,Math.PI,0);c.lineTo(x+s*.45,y);c.lineTo(x-s*.45,y);c.closePath();c.fill();
  const ox=x+open*s*1.05;c.fillStyle='#7a6e60';c.beginPath();c.arc(ox,y-s*.52,s*.55,0,TAU);c.fill();c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=2;c.beginPath();c.arc(ox,y-s*.52,s*.3,0,TAU);c.stroke()}
function cross(c,x,y,s,col){c.fillStyle=col||'#2a1c12';c.fillRect(x-s*.05,y-s,s*.1,s);c.fillRect(x-s*.32,y-s*.78,s*.64,s*.09)}
function scroll(c,x,y,s,col){c.fillStyle=col||'#efe2bf';c.fillRect(x-s*.5,y-s*.3,s,s*.6);c.fillStyle='#a8743c';c.fillRect(x-s*.6,y-s*.36,s*.12,s*.72);c.fillRect(x+s*.48,y-s*.36,s*.12,s*.72);
  c.strokeStyle='rgba(60,40,20,.45)';c.lineWidth=1;for(let k=0;k<4;k++){c.beginPath();c.moveTo(x-s*.38,y-s*.15+k*s*.1);c.lineTo(x+s*.38,y-s*.15+k*s*.1);c.stroke()}}

/* Arca del pacto llevada sobre los hombros de cuatro sacerdotes */
function ark(c,x,y,s,t,o){o=o||{};const b=o.walk?Math.sin(t*6)*s*.02:0;
  for(let k=0;k<4;k++)person(c,x+(k-1.5)*s*.32,y,s,{col:'#2a1a10',robe:'#e9e2cf',walk:o.walk,t,ph:k});
  c.strokeStyle='#8a6a2a';c.lineWidth=Math.max(2,s*.035);c.beginPath();c.moveTo(x-s*.8,y-s*.86+b);c.lineTo(x+s*.8,y-s*.86+b);c.stroke();
  glow(c,x,y-s*1.05,s*.7,'rgba(255,215,120,.3)');c.fillStyle='#d4a640';c.fillRect(x-s*.3,y-s*1.12+b,s*.6,s*.24);
  c.fillStyle='#f0cf6a';[-1,1].forEach(d=>{c.beginPath();c.moveTo(x+d*s*.06,y-s*1.12+b);c.quadraticCurveTo(x+d*s*.32,y-s*1.4+b,x+d*s*.3,y-s*1.12+b);c.closePath();c.fill()})}
/* Arpa (kinnor) colgada o en manos de un levita */
function harp(c,x,y,s,col){c.strokeStyle=col||'#a8743c';c.lineWidth=Math.max(1.5,s*.08);c.beginPath();c.moveTo(x,y);c.lineTo(x,y-s);c.quadraticCurveTo(x+s*.55,y-s*1.05,x+s*.6,y-s*.4);c.lineTo(x,y);c.stroke();
  c.strokeStyle='rgba(240,230,200,.7)';c.lineWidth=1;for(let k=1;k<5;k++){c.beginPath();c.moveTo(x+k*s*.11,y-k*s*.08);c.lineTo(x+k*s*.11,y-s*.85+k*s*.06);c.stroke()}}

/* ---------- Plantas ---------- */
function treeAt(c,x,y,s,g,col){if(g<=0)return;const S2=s*g;c.fillStyle='#3a2a1c';c.fillRect(x-S2*.06,y-S2*.55,S2*.12,S2*.57);c.fillStyle=col||'#2f6a3a';[[0,-.75,.38],[-.27,-.6,.28],[.27,-.6,.28],[0,-1.02,.26]].forEach(([dx,dy,r])=>{c.beginPath();c.arc(x+dx*S2,y+dy*S2,r*S2,0,TAU);c.fill()})}
function palm(c,x,y,s,t,col){const sw=Math.sin(t*1.1+x)*s*.03;c.strokeStyle='#5a4028';c.lineWidth=s*.07;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+s*.08,y-s*.5,x+sw,y-s);c.stroke();
  c.strokeStyle=col||'#3f6a32';c.lineWidth=s*.05;c.lineCap='round';for(let k=0;k<7;k++){const a=-Math.PI/2+(k-3)*.5;c.beginPath();c.moveTo(x+sw,y-s);c.quadraticCurveTo(x+sw+Math.cos(a)*s*.3,y-s+Math.sin(a)*s*.3-s*.08,x+sw+Math.cos(a)*s*.5,y-s+Math.sin(a)*s*.4+s*.12);c.stroke()}}
function grass(c,w,h,y,n,t,col){c.strokeStyle=col||'#4f6d2e';c.lineWidth=1.5;for(let k=0;k<n;k++){const x=w*(k+.5)/n,sw=Math.sin(t*1.4+k)*3;c.beginPath();c.moveTo(x,h*y);c.quadraticCurveTo(x+2,h*(y-.04),x+sw,h*(y-.07));c.stroke()}}
/* Campo de trigo que se mece */
function wheat(c,w,h,y0,y1,t,col){c.strokeStyle=col||'#d8b25a';c.lineWidth=1.4;for(let k=0;k<70;k++){const x=(k*37.3)%w,yy=h*(y0+(y1-y0)*((k*.071)%1)),sw=Math.sin(t*1.5+k*.3)*4;c.beginPath();c.moveTo(x,yy+h*.05);c.lineTo(x+sw,yy);c.stroke();c.fillStyle=col||'#d8b25a';c.beginPath();c.ellipse(x+sw,yy-3,1.8,4,0,0,TAU);c.fill()}}

/* ---------- Figuras ---------- */
function person(c,x,y,s,o){o=o||{};const col=o.col||'#140e0b',t=o.t||0;
  c.save();c.translate(x,y);if(o.flip)c.scale(-1,1);
  c.fillStyle=col;c.strokeStyle=col;c.lineCap='round';
  if(o.pose==='lie'){c.beginPath();c.ellipse(-s*.05,-s*.09,s*.42,s*.09,0,0,TAU);c.fill();c.beginPath();c.arc(s*.45,-s*.11,s*.09,0,TAU);c.fill();c.restore();return}
  if(o.pose==='bend')c.rotate(.5);
  const H=o.pose==='kneel'?s*.66:s,sw=o.walk?Math.sin(t*6+(o.ph||0))*s*.07:0;
  c.beginPath();c.moveTo(-s*.19+sw,0);c.lineTo(-s*.085,-H*.78);c.lineTo(s*.085,-H*.78);c.lineTo(s*.19-sw,0);c.closePath();c.fill();
  if(o.coat){c.save();c.clip();const cols=['#c0392b','#e67e22','#f1c40f','#27ae60','#2980b9','#8e44ad'];for(let k=0;k<6;k++){c.fillStyle=cols[k];c.fillRect(-s*.25,-H*.78+k*H*.13,s*.5,H*.14)}c.restore();c.fillStyle=col}
  else if(o.robe){c.save();c.clip();c.fillStyle=o.robe;c.fillRect(-s*.25,-H*.8,s*.5,H*.8);c.restore();c.fillStyle=col}
  c.beginPath();c.arc(0,-H*.88,s*.095,0,TAU);c.fill();
  if(o.crown){c.fillStyle='#e5b04b';c.beginPath();c.moveTo(-s*.09,-H*.95);for(let k=0;k<5;k++)c.lineTo(-s*.09+k*s*.045,-H*(k%2?.98:1.06));c.lineTo(s*.09,-H*.95);c.closePath();c.fill();c.fillStyle=col}
  if(o.halo)glow(c,0,-H*.88,s*.3,'rgba(255,240,190,.55)');
  c.lineWidth=s*.055;const sy=-H*.7;
  if(o.arms==='up'){c.beginPath();c.moveTo(-s*.06,sy);c.lineTo(-s*.2,-H*1.04);c.moveTo(s*.06,sy);c.lineTo(s*.2,-H*1.04);c.stroke()}
  else if(o.arms==='out'){c.beginPath();c.moveTo(s*.05,sy);c.lineTo(s*.3,-H*.62);c.stroke()}
  else if(o.arms==='wide'){c.beginPath();c.moveTo(-s*.05,sy);c.lineTo(-s*.32,-H*.74);c.moveTo(s*.05,sy);c.lineTo(s*.32,-H*.74);c.stroke()}
  else if(o.arms==='hammer'){const a=Math.sin(t*9)*.9,hx=s*.05+Math.cos(-1.2+a)*s*.28,hy=sy+Math.sin(-1.2+a)*s*.28;c.beginPath();c.moveTo(s*.05,sy);c.lineTo(hx,hy);c.stroke();c.fillRect(hx-s*.05,hy-s*.03,s*.1,s*.06)}
  else if(o.arms==='sling'){const a=t*14;c.beginPath();c.moveTo(s*.05,sy);c.lineTo(s*.12,-H*1.02);c.stroke();c.lineWidth=s*.02;c.beginPath();c.moveTo(s*.12,-H*1.02);c.lineTo(s*.12+Math.cos(a)*s*.25,-H*1.02+Math.sin(a)*s*.12);c.stroke()}
  if(o.staff){c.lineWidth=s*.035;c.beginPath();c.moveTo(s*.22,0);c.lineTo(s*.25,-H*1.08);c.stroke();c.lineWidth=s*.055;c.beginPath();c.moveTo(s*.05,sy);c.lineTo(s*.24,-H*.62);c.stroke()}
  if(o.sword){c.strokeStyle='#c9ccd6';c.lineWidth=s*.03;c.beginPath();c.moveTo(s*.28,-H*.62);c.lineTo(s*.5,-H*1.05);c.stroke();c.strokeStyle=col}
  if(o.horn){c.fillStyle='#d9c08a';c.beginPath();c.moveTo(s*.1,-H*.86);c.quadraticCurveTo(s*.35,-H*.95,s*.45,-H*1.1);c.lineTo(s*.5,-H*1.04);c.quadraticCurveTo(s*.38,-H*.86,s*.1,-H*.8);c.closePath();c.fill();c.fillStyle=col}
  if(o.load){c.fillStyle=o.loadCol||'#8a5a32';c.fillRect(-s*.1,-H*1.04,s*.2,s*.08)}
  c.restore()}
function beast(c,x,y,s,o){o=o||{};const col=o.col||'#2a1c12',t=o.t||0,ph=o.ph||0;c.save();c.translate(x,y);if(o.flip)c.scale(-1,1);c.fillStyle=col;c.strokeStyle=col;c.lineCap='round';
  const neck=o.neck||.25,leg=o.leg||.35,body=o.body||.5,sw=o.walk?Math.sin(t*5+ph)*s*.08:0;
  c.lineWidth=s*.07;[[-.3,sw],[-.18,-sw],[.18,sw],[.3,-sw]].forEach(([dx,d])=>{c.beginPath();c.moveTo(dx*s*body*2,-leg*s);c.lineTo(dx*s*body*2+d,0);c.stroke()});
  if(o.wool){for(let k=0;k<6;k++){c.beginPath();c.arc((k-2.5)*s*.12,-leg*s-s*.12+(k%2)*s*.05,s*.13,0,TAU);c.fill()}}
  else{c.beginPath();c.ellipse(0,-leg*s-s*.1,s*body,s*.17,0,0,TAU);c.fill()}
  c.lineWidth=s*.1;c.beginPath();c.moveTo(s*body*.8,-leg*s-s*.15);c.lineTo(s*body*.8+s*.12,-leg*s-s*.15-neck*s);c.stroke();
  c.beginPath();c.ellipse(s*body*.8+s*.2,-leg*s-s*.17-neck*s,s*.13,s*.08,.2,0,TAU);c.fill();
  if(o.mane){c.beginPath();c.arc(s*body*.8+s*.13,-leg*s-s*.15-neck*s,s*.17,0,TAU);c.fill()}
  c.restore()}
function camel(c,x,y,s,t,i){const b=Math.sin(t*4+i)*s*.04,col='#5a3a22';c.fillStyle=col;c.strokeStyle=col;c.lineCap='round';
  c.beginPath();c.ellipse(x,y-s*.55+b,s*.55,s*.22,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(x+s*.05,y-s*.76+b,s*.22,s*.17,0,0,TAU);c.fill();
  c.lineWidth=s*.13;c.beginPath();c.moveTo(x-s*.42,y-s*.6+b);c.lineTo(x-s*.68,y-s*.95+b);c.stroke();
  c.beginPath();c.ellipse(x-s*.78,y-s*.98+b,s*.13,s*.07,0,0,TAU);c.fill();
  c.lineWidth=s*.07;const sw=Math.sin(t*4+i)*s*.12;[[-.35,sw],[-.2,-sw],[.25,sw],[.4,-sw]].forEach(([dx,d])=>{c.beginPath();c.moveTo(x+dx*s,y-s*.42+b);c.lineTo(x+dx*s+d,y);c.stroke()});
  c.fillStyle=i%2?'#8a3b2a':'#2f5d6e';c.fillRect(x-s*.18,y-s*1.02+b,s*.4,s*.18)}
function bird(c,x,y,s,t,ph){const f=Math.sin(t*9+(ph||0))*s*.5;c.beginPath();c.moveTo(x-s,y-f);c.quadraticCurveTo(x-s*.4,y-s*.2,x,y);c.quadraticCurveTo(x+s*.4,y-s*.2,x+s,y-f);c.stroke()}
/* Paloma blanca que planea */
function dove(c,x,y,s,t){const f=Math.sin(t*6)*s*.35;glow(c,x,y,s*2.2,'rgba(255,250,230,.35)');c.fillStyle='#fbf8f0';c.beginPath();c.ellipse(x,y,s*.5,s*.2,0,0,TAU);c.fill();
  c.beginPath();c.moveTo(x-s*.1,y);c.quadraticCurveTo(x-s*.5,y-s*.6-f,x-s*1.1,y-s*.2-f);c.quadraticCurveTo(x-s*.5,y-s*.1,x,y);c.fill();
  c.beginPath();c.moveTo(x+s*.1,y);c.quadraticCurveTo(x+s*.5,y-s*.6-f,x+s*1.1,y-s*.2-f);c.quadraticCurveTo(x+s*.5,y-s*.1,x,y);c.fill()}
function fish(c,x,y,s,ang,col){c.save();c.translate(x,y);c.rotate(ang);c.fillStyle=col;c.beginPath();c.ellipse(0,0,s,s*.4,0,0,TAU);c.fill();c.beginPath();c.moveTo(-s*.8,0);c.lineTo(-s*1.4,-s*.45);c.lineTo(-s*1.4,s*.45);c.closePath();c.fill();c.restore()}
/* Ángel: figura luminosa con alas */
function angel(c,x,y,s,t,a){a=a==null?1:a;c.save();c.globalAlpha*=a;glow(c,x,y-s*.6,s*1.3,'rgba(255,246,215,.55)');
  const f=Math.sin(t*2)*s*.05;c.fillStyle='rgba(255,250,235,.85)';[-1,1].forEach(d=>{c.beginPath();c.moveTo(x,y-s*.75);c.quadraticCurveTo(x+d*s*.7,y-s*1.25-f,x+d*s*.55,y-s*.35);c.quadraticCurveTo(x+d*s*.25,y-s*.55,x,y-s*.6);c.fill()});
  person(c,x,y,s,{col:'#fffaf0',halo:1});c.restore()}
/* Gentío: n figuras repartidas entre x0 y x1 */
function crowd(c,x0,x1,y,n,s,t,o){o=o||{};for(let k=0;k<n;k++){const x=x0+(x1-x0)*(k+.5)/n+Math.sin(k*3.7)*s*.2;person(c,x,y+(k%3)*s*.08,s*(.85+(k%4)*.06),Object.assign({col:o.col||'#2a1a10',walk:o.walk,t,ph:k,flip:o.flip,arms:o.arms&&k%3===0?o.arms:undefined},o.robe&&k%2?{robe:o.robe}:{}))}}
function tent(c,x,y,s,col){c.fillStyle=col||'#5a4436';c.beginPath();c.moveTo(x-s,y);c.lineTo(x-s*.1,y-s*.7);c.lineTo(x+s*.8,y-s*.55);c.lineTo(x+s,y);c.closePath();c.fill();c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.moveTo(x-s*.1,y);c.lineTo(x,y-s*.45);c.lineTo(x+s*.15,y);c.closePath();c.fill()}

/* ---------- Luz, fuego y humo ---------- */
function sparkle(c,x,y,s){c.beginPath();for(let k=0;k<8;k++){const r=k%2?s*.25:s,an=k*Math.PI/4-Math.PI/2;c.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r)}c.closePath();c.fill()}
function flame(c,x,y,s,t){glow(c,x,y-s*.5,s*2.2,'rgba(255,150,60,.35)');['#c24a1a','#f07a2a','#ffb04a','#ffdf8a'].forEach((col,k)=>{const fl=Math.sin(t*9+k*2.1);c.fillStyle=col;c.beginPath();c.ellipse(x+fl*s*.08,y-s*(.45+k*.06),s*(.45-k*.09),s*(.8-k*.12+fl*.08),0,0,TAU);c.fill()})}
function smoke(c,x,y,s,t,dx,col,n){n=n||10;for(let k=0;k<n;k++){const q=((t*.25+k/n)%1);c.fillStyle=col.replace('A',(.5*(1-q)).toFixed(2));c.beginPath();c.arc(x+dx*q*s*3+Math.sin(t+k)*s*.1,y-q*s*4,s*(.25+q*.6),0,TAU);c.fill()}}
/* Haz de luz que baja del cielo hasta (x,y); a = intensidad 0–1 */
function rays(c,x,y,wd,a){if(a<=0)return;const g=c.createLinearGradient(0,0,0,y);g.addColorStop(0,`rgba(255,240,200,${(.55*a).toFixed(2)})`);g.addColorStop(1,'rgba(255,240,200,0)');c.fillStyle=g;c.beginPath();c.moveTo(x-wd*.3,0);c.lineTo(x+wd*.3,0);c.lineTo(x+wd*.6,y);c.lineTo(x-wd*.6,y);c.closePath();c.fill()}
/* Estrella grande con destello (Belén, la promesa) */
function bigStar(c,x,y,s,t){glow(c,x,y,s*6,'rgba(255,240,200,.45)');c.fillStyle='#fffbe8';sparkle(c,x,y,s*(1.4+.15*Math.sin(t*3)));c.globalAlpha=.6;sparkle(c,x,y,s*3);c.globalAlpha=1}
/* Lenguas de fuego sobre cabezas */
function tongue(c,x,y,s,t){const fl=Math.sin(t*10+x)*s*.15;c.fillStyle='rgba(255,170,60,.9)';c.beginPath();c.moveTo(x-s*.25,y);c.quadraticCurveTo(x-s*.3+fl,y-s*.7,x+fl,y-s*1.1);c.quadraticCurveTo(x+s*.3+fl,y-s*.6,x+s*.25,y);c.closePath();c.fill();c.fillStyle='rgba(255,235,150,.9)';c.beginPath();c.ellipse(x+fl*.5,y-s*.3,s*.1,s*.25,0,0,TAU);c.fill()}

/* ---------- Texto sobre la viñeta ---------- */
function caption(c,w,h,txt,a,y){if(a<=0)return;c.save();c.globalAlpha=a;const fs=Math.round(h*.042),yy=h*(y||.15);c.font=`${fs}px Marcellus, Georgia, serif`;c.textAlign='center';c.textBaseline='middle';
  const tw=c.measureText(txt).width+fs*1.6,th=fs*1.7;c.fillStyle='rgba(8,10,20,.55)';c.beginPath();if(c.roundRect)c.roundRect(w/2-tw/2,yy-th/2,tw,th,th/2);else c.rect(w/2-tw/2,yy-th/2,tw,th);c.fill();
  c.fillStyle='#f0c46a';c.fillText(txt,w/2,yy+1);c.restore()}
function bigText(c,w,h,txt,a,y,col){if(a<=0)return;c.save();c.globalAlpha=a;c.fillStyle=col||'#2a1a10';c.font=`${Math.round(h*.09)}px Marcellus, Georgia, serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(txt,w*.5,h*(y||.32));c.restore()}

</script>
<script>
/* ---- js/audio.js ---- */
/* ============ Audio: todo se sintetiza con Web Audio API (no hay archivos de sonido) ============
   Buses: master → música (bordón + cuerda pulsada + reverberación) y efectos (ambiente de escenas y relatos). */
const AU={ctx:null};
const MU={mode:'map',next:0,step:0,deg:9,pads:[],duck:false,applied:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musicGain(){return (P.vol.music/100)*.8*(MU.duck?.45:1)}
function impulse(c,sec){const n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}return b}
function noiseBuf(c,sec){const n=Math.floor(c.sampleRate*sec),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b}

/* El navegador solo permite sonido después de un clic o una tecla */
function audioInit(){
  try{
    if(!AU.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      const c=new C();AU.ctx=c;
      const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(c.destination);
      AU.master=c.createGain();AU.master.gain.value=P.sound?1:0;AU.master.connect(comp);
      AU.music=c.createGain();AU.music.gain.value=musicGain();AU.music.connect(AU.master);
      AU.rev=c.createConvolver();AU.rev.buffer=impulse(c,3.2);const rv=c.createGain();rv.gain.value=.6;AU.rev.connect(rv);rv.connect(AU.music);
      AU.pad=c.createGain();AU.pad.gain.value=0;AU.pad.connect(AU.music);const ps=c.createGain();ps.gain.value=.45;AU.pad.connect(ps);ps.connect(AU.rev);
      AU.pluck=c.createGain();AU.pluck.gain.value=1;AU.pluck.connect(AU.music);const pl=c.createGain();pl.gain.value=.7;AU.pluck.connect(pl);pl.connect(AU.rev);
      AU.sfx=c.createGain();AU.sfx.gain.value=P.vol.sfx/100;AU.sfx.connect(AU.master);
      AU.fx=c.createGain();AU.fx.gain.value=.85;AU.fx.connect(AU.sfx);
      AU.noise=noiseBuf(c,2.5);
      MU.next=c.currentTime+.3;
      setInterval(musicTick,90);
      if(typeof SC!=='undefined'&&SC&&!SC.snd)SC.snd=sceneSound(SC.id,SC.ambLvl);
    }
    if(AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown',audioInit,true);
document.addEventListener('keydown',audioInit,true);
document.addEventListener('visibilitychange',()=>{try{if(document.hidden){AU.ctx&&AU.ctx.suspend();window.speechSynthesis&&speechSynthesis.pause()}else{AU.ctx&&AU.ctx.resume();window.speechSynthesis&&speechSynthesis.resume()}}catch(e){}});

/* Piezas básicas: tono, ráfaga de ruido, capa continua de ruido filtrado */
function tone(dest,o){const c=AU.ctx,a=o.a||.01,t0=c.currentTime+(o.at||0),os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f,t0);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t0+(o.gl||o.d*.6));
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.g,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+o.d);
  os.connect(g).connect(dest);os.start(t0);os.stop(t0+a+o.d+.05)}
function burst(dest,o){const c=AU.ctx,a=o.a||.005,t0=c.currentTime+(o.at||0),s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;const f=c.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.value=o.f||800;f.Q.value=o.q||.7;const g=c.createGain();
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.g,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+o.d);
  s.connect(f).connect(g).connect(dest);s.start(t0,Math.random()*1.5);s.stop(t0+a+o.d+.05)}
function layer(dest,o){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;const f=c.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.value=o.f;f.Q.value=o.q||.7;const g=c.createGain();g.gain.value=o.g;s.connect(f).connect(g).connect(dest);const st=[s];
  if(o.lr){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.lr;lg.gain.value=o.ld;l.connect(lg).connect(o.lt==='g'?g.gain:f.frequency);l.start();st.push(l)}
  s.start(0,Math.random()*2);return{g,f,stop(){st.forEach(n=>{try{n.stop()}catch(e){}})}}}
function every(h,min,max,fn){let alive=true,tm;const tick=()=>{if(!alive)return;try{fn()}catch(e){}tm=setTimeout(tick,min+Math.random()*(max-min))};tm=setTimeout(tick,300+Math.random()*min);h.stops.push(()=>{alive=false;clearTimeout(tm)})}
function makeBus(lvl){const c=AU.ctx,g=c.createGain();g.gain.value=0;g.connect(AU.sfx);g.gain.setTargetAtTime(lvl,c.currentTime,.6);return g}
function stopSnd(h){if(!h||!AU.ctx)return;try{h.bus.gain.setTargetAtTime(0,AU.ctx.currentTime,.25)}catch(e){}h.stops.forEach(f=>f());setTimeout(()=>{h.layers.forEach(l=>l.stop());try{h.bus.disconnect()}catch(e){}},1600)}
function shimmerTo(bus,k=1){[74,81,86,90,93,98].forEach((m,i)=>tone(bus,{f:mtof(m),g:.028*k,a:.02,d:2.2,at:i*.12}))}
function thunderTo(bus,k=1){burst(bus,{type:'lowpass',f:110,g:.5*k,a:.08,d:3.4,at:.15});burst(bus,{type:'lowpass',f:520,g:.2*k,a:.01,d:.7,at:.12});burst(bus,{type:'bandpass',f:1700,q:.5,g:.05*k,a:.003,d:.25,at:.1})}
function shofar(bus,k=1){const c=AU.ctx,t=c.currentTime+.05,f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1300;f.Q.value=3;const g=c.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07*k,t+.25);g.gain.setValueAtTime(.07*k,t+2);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);f.connect(g).connect(bus);
  const vib=c.createOscillator(),vg2=c.createGain();vib.frequency.value=5.2;vg2.gain.value=2.5;vib.connect(vg2);
  [0,7].forEach(d=>{const o=c.createOscillator();o.type='sawtooth';o.detune.value=d;o.frequency.setValueAtTime(196,t);o.frequency.setValueAtTime(196,t+.35);o.frequency.exponentialRampToValueAtTime(294,t+.62);vg2.connect(o.frequency);o.connect(f);o.start(t);o.stop(t+2.9)});
  vib.start(t);vib.stop(t+2.9)}
const chirps=bus=>{const n=2+(Math.random()*3|0),b=2500+Math.random()*1500;for(let k=0;k<n;k++)tone(bus,{f:b,f2:b*1.3,g:.022,a:.008,d:.08,at:k*.12})};
const crickets=bus=>{for(let k=0;k<3;k++)tone(bus,{f:4300+Math.random()*200,g:.01,a:.003,d:.035,at:k*.055})};
const crackle=bus=>burst(bus,{type:'highpass',f:1500+Math.random()*2500,g:.02+Math.random()*.05,a:.001,d:.015+Math.random()*.03});

/* Ambiente de cada estación: cada campaña registra en SCENE_SND[idEstación] una función (h,bus,L,shim)
   que agrega capas con L({…}), sonidos repetidos con every(…) y eventos en h.ev (los dispara la escena).
   h.upd(v) recibe las variables animadas de la escena cada cuarto de segundo. */
const SCENE_SND={};
function sceneSound(id,lvl){
  if(!AU.ctx)return null;
  const bus=makeBus(lvl),h={bus,layers:[],stops:[],ev:{},upd:null};
  const L=o=>{const l=layer(bus,o);h.layers.push(l);return l};
  h.ev.thunder=()=>thunderTo(bus,1);
  const shim=()=>shimmerTo(bus);
  try{(SCENE_SND[id]||SCENE_SND._viento)(h,bus,L,shim)}catch(e){}
  return h;
}
SCENE_SND._viento=(h,bus,L)=>{L({type:'bandpass',f:420,q:.5,g:.05,lr:.12,ld:120})};

/* Ambiente de los relatos del camino: fondo que cambia por escena, sonidos repetidos y pasos */
const AMBS={deep:{type:'lowpass',f:110,g:.1},water:{type:'bandpass',f:750,q:.6,g:.07,lr:.2,ld:250},wind:{type:'bandpass',f:420,q:.5,g:.05,lr:.12,ld:120},night:{type:'lowpass',f:320,g:.025},fire:{type:'lowpass',f:170,g:.04},
  sea:{type:'bandpass',f:480,q:.4,g:.09,lr:.09,ld:.05,lt:'g'},crowd:{type:'bandpass',f:900,q:.8,g:.03,lr:.3,ld:.012,lt:'g'}};
const REPS={
  birds:[1200,3200,chirps],crickets:[600,1400,crickets],crackle:[80,380,crackle],
  hammer:[380,720,bus=>{tone(bus,{type:'square',f:150+Math.random()*40,g:.025,a:.002,d:.06});burst(bus,{type:'highpass',f:2200,g:.03,a:.001,d:.04})}],
  chime:[650,750,bus=>tone(bus,{f:mtof(SCALE[6+(Math.random()*8|0)]),g:.035,a:.005,d:1.4})],
  harp:[700,1500,bus=>{const m=SCALE[6+(Math.random()*8|0)];tone(bus,{type:'triangle',f:mtof(m),g:.03,a:.004,d:1.6});tone(bus,{f:mtof(m+12),g:.008,a:.004,d:.8})}],
  bells:[1800,3200,bus=>[0,.18].forEach((d,k)=>tone(bus,{f:k?1318:1760,g:.02,a:.003,d:1.8,at:d}))],
  babble:[90,230,bus=>tone(bus,{type:'triangle',f:150+Math.random()*200,f2:150+Math.random()*260,g:.012,a:.01,d:.12})]
};
function travelSound(){
  if(!AU.ctx)return null;
  const bus=makeBus(1),h={bus,layers:[],stops:[],moving:false,amb:{},rs:[]};
  every(h,470,560,()=>{if(!h.moving)return;burst(bus,{type:'lowpass',f:320,g:.08,a:.004,d:.1});burst(bus,{type:'highpass',f:2600,g:.011,a:.002,d:.06})});
  h.setAmb=name=>{const now=AU.ctx.currentTime;Object.keys(h.amb).forEach(k=>h.amb[k].g.gain.setTargetAtTime(k===name?AMBS[k].g:0,now,.5));
    if(name&&!h.amb[name]&&AMBS[name]){const o=Object.assign({},AMBS[name]);o.g=0;const l=layer(bus,o);l.g.gain.setTargetAtTime(AMBS[name].g,now,.5);h.amb[name]=l;h.layers.push(l)}};
  h.setRep=name=>{h.rs.forEach(f=>f());h.rs=[];const r=REPS[name];if(r)every({stops:h.rs},r[0],r[1],()=>r[2](bus))};
  h.once=name=>{if(name==='shimmer')shimmerTo(bus);else if(name==='thunder')thunderTo(bus,.8);else if(name==='rumble')burst(bus,{type:'lowpass',f:80,g:.35,a:.4,d:3});else if(name==='shofar')shofar(bus,.7);else if(name==='roar')burst(bus,{type:'lowpass',f:300,g:.3,a:.8,d:3.5});else if(name==='crash')burst(bus,{type:'lowpass',f:200,g:.45,a:.02,d:2.2})};
  h.stops.push(()=>h.rs.forEach(f=>f()));
  return h;
}

/* Música instrumental generativa: bordón suave + cuerda pulsada en modo hiyaz (sabor de Medio Oriente) */
/* La escala y los acordes cambian con la campaña (setMusicTheme): hiyaz en el Antiguo Pacto */
let SCALE=[50,51,54,55,57,58,60,62,63,66,67,69,70,72,74,75,78];
let PROG=[[38,45,50,57],[38,45,50,57],[43,50,55,58],[38,45,50,54],[36,43,48,51],[38,45,50,57],[43,50,55,62],[38,45,50,57]];
function setMusicTheme(th){if(!th)return;SCALE=th.scale;PROG=th.prog;MU.step=0;MU.deg=Math.min(MU.deg,SCALE.length-2)}
const MODES={map:{bpm:72,p:.3,pad:1},quiz:{bpm:56,p:.15,pad:.7},cine:{bpm:60,p:0,pad:.75},off:null};
function setMusic(m){MU.mode=m;applyMusic()}
function applyMusic(){if(!AU.ctx)return;const cfg=MODES[MU.mode];AU.pad.gain.setTargetAtTime(cfg?cfg.pad:0,AU.ctx.currentTime,1.4);MU.applied=MU.mode}
function duck(on){if(MU.duck===on)return;MU.duck=on;if(AU.ctx)AU.music.gain.setTargetAtTime(musicGain(),AU.ctx.currentTime,.4)}
function musicTick(){
  const c=AU.ctx;if(!c||c.state!=='running')return;
  if(MU.applied!==MU.mode)applyMusic();
  const cfg=MODES[MU.mode];if(!cfg){MU.next=c.currentTime+.1;return}
  if(MU.next<c.currentTime-.2)MU.next=c.currentTime+.05;
  const spe=60/cfg.bpm/2;
  while(MU.next<c.currentTime+.3){musicStep(MU.next,cfg);MU.next+=spe;MU.step++}
}
function musicStep(t,cfg){
  const s=MU.step%(16*PROG.length),ch=PROG[(s/16)|0];
  if(s%16===0)padChord(ch,t);
  if(!cfg.p)return;
  if(s%32>=26)return;
  const on=s%2===0;
  if(s%16===0&&Math.random()<.7)pluck(ch[2],t,.07);
  if(Math.random()<cfg.p*(on?1.5:.45)){
    const steps=[-2,-1,-1,0,1,1,2];MU.deg=Math.max(6,Math.min(SCALE.length-2,MU.deg+steps[Math.random()*7|0]));
    const v=(on?.13:.09)*(MU.mode==='quiz'?.8:1);
    if(Math.random()<.12&&MU.deg<SCALE.length-1)pluck(SCALE[MU.deg+1],t-.07,v*.35);
    pluck(SCALE[MU.deg],t,v);
  }
}
function padChord(notes,t){
  const c=AU.ctx;
  MU.pads.forEach(p=>{p.g.gain.cancelScheduledValues(t);p.g.gain.setTargetAtTime(0,t,1.3);p.o.forEach(o=>{try{o.stop(t+7)}catch(e){}})});
  MU.pads=notes.map(m=>{const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=780;g.gain.value=0;g.gain.setTargetAtTime(m<46?.022:.016,t,1.1);
    const o=[-6,6].map(d=>{const os=c.createOscillator();os.type='triangle';os.frequency.value=mtof(m);os.detune.value=d;os.connect(lp);os.start(t);return os});
    lp.connect(g).connect(AU.pad);return{g,o}});
}
function pluck(m,t,v){
  const c=AU.ctx,f=mtof(m),o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain(),g2=c.createGain();
  o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.25;
  lp.type='lowpass';lp.frequency.setValueAtTime(2600,t);lp.frequency.exponentialRampToValueAtTime(650,t+.5);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+1.9);
  o.connect(lp);o2.connect(g2).connect(lp);lp.connect(g).connect(AU.pluck);o.start(t);o2.start(t);o.stop(t+2);o2.stop(t+2);
}

/* Sonidos de interfaz */
const SND={tick:[[1046,0,.07]],ok:[[523,0,.16],[784,.1,.3]],bad:[[233,0,.3],[175,.14,.45]],secret:[[880,0,.18],[1175,.12,.18],[1568,.24,.45]],badge:[[392,0,.22],[523,.14,.22],[659,.28,.22],[784,.42,.55]]};
function beep(notes){if(!P.sound)return;audioInit();if(!AU.ctx)return;try{notes.forEach(([f,st,d])=>tone(AU.fx,{type:'triangle',f,g:.16,a:.02,d,at:st}))}catch(e){}}

/* ============ Narrador ============
   1) Narración grabada (si existe audio/voz/indice.js, generado con generar_voz.py): voz neuronal humana.
   2) Si no, la voz del sistema (Web Speech API), prefiriendo voces "natural" latinoamericanas. */
const VO={v:null,all:[]};
const REGION={MX:'México',PE:'Perú',CL:'Chile',AR:'Argentina',CO:'Colombia',VE:'Venezuela',EC:'Ecuador',BO:'Bolivia',UY:'Uruguay',PY:'Paraguay',CR:'Costa Rica',PA:'Panamá',GT:'Guatemala',HN:'Honduras',SV:'El Salvador',NI:'Nicaragua',DO:'Rep. Dominicana',PR:'Puerto Rico',CU:'Cuba',US:'EE. UU. (latino)','419':'Latinoamérica',ES:'España',GQ:'Guinea Ecuatorial'};
const voiceRegion=v=>{const m=/^es[-_]([A-Za-z0-9]+)/.exec(v.lang||'');return m?m[1].toUpperCase():''};
const isNatural=v=>/natural|online|neural|google/i.test(v.name);
const isLatam=v=>{const r=voiceRegion(v);return !!r&&r!=='ES'&&r!=='GQ'};
function voiceLabel(v){const r=REGION[voiceRegion(v)]||v.lang;const n=v.name.replace(/^Microsoft\s+/,'').replace(/\s*Online\s*\(Natural\)/i,'').replace(/\s*-\s*Spanish.*$/i,'').trim();return `${n} · ${r}${/natural|online|neural/i.test(v.name)?' · natural':''}`}
function voiceScore(v){return (/natural|online|neural/i.test(v.name)?20:0)+(/google/i.test(v.name)?6:0)+(isLatam(v)?10:0)+(voiceRegion(v)==='MX'?2:0)+(voiceRegion(v)==='PE'||voiceRegion(v)==='CL'?1:0)}
function pickVoice(){try{
  VO.all=speechSynthesis.getVoices().filter(v=>/^es([-_]|$)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a)||a.name.localeCompare(b.name));
  VO.v=(P.voiceName&&VO.all.find(v=>v.name===P.voiceName))||VO.all[0]||null}catch(e){VO.v=null}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}}
/* Clave de cada texto para encontrar su grabación (FNV-1a de 32 bits sobre UTF-8; igual que en generar_voz.py) */
function vozKey(t){const b=new TextEncoder().encode(String(t).normalize('NFC'));let h=0x811c9dc5;for(const x of b){h^=x;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
const hasRecorded=()=>!!(window.VOZ_GRABADA&&VOZ_GRABADA.archivos);
function recordedSrc(text){if(!hasRecorded()||P.recorded===false)return null;const k=vozKey(text),f=VOZ_GRABADA.archivos[k];if(!f)return null;return (VOZ_GRABADA.datos&&VOZ_GRABADA.datos[k])||('audio/voz/'+f)}
let VAUD=null;
function speak(text,done){
  let fired=false,fb;const fin=()=>{if(fired)return;fired=true;clearTimeout(fb);duck(false);done()};
  const read=Math.max(3400,1500+text.length*52);
  const synth=()=>{
    const voice=!!(P.sound&&P.voice&&VO.v&&'speechSynthesis' in window);
    if(voice){try{const u=new SpeechSynthesisUtterance(text);u.voice=VO.v;u.lang=VO.v.lang;u.rate=isNatural(VO.v)?.98:.92;u.pitch=1;u.volume=1;
        u.onend=()=>setTimeout(fin,250);u.onerror=()=>{if(fired)return;clearTimeout(fb);fb=setTimeout(fin,read)};
        speechSynthesis.cancel();duck(true);speechSynthesis.speak(u);fb=setTimeout(fin,4500+text.length*110)}catch(e){fb=setTimeout(fin,read)}}
    else fb=setTimeout(fin,read);
  };
  const src=P.sound&&P.voice?recordedSrc(text):null;
  if(src){
    try{if(VAUD)VAUD.pause();const a=new Audio(src);VAUD=a;a.volume=1;
      a.onended=()=>setTimeout(fin,300);a.onerror=()=>{if(fired||VAUD!==a)return;VAUD=null;synth()};
      duck(true);const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{if(!fired&&VAUD===a){VAUD=null;synth()}});
      fb=setTimeout(fin,6000+text.length*120)}catch(e){synth()}
  }else synth();
  return()=>{fired=true;clearTimeout(fb);try{speechSynthesis.cancel()}catch(e){}if(VAUD){try{VAUD.pause()}catch(e){}VAUD=null}duck(false)};
}
function sayTest(){const t='Bienvenido al Camino del Pacto. Yo te contaré la historia mientras avanzas.';stopNarration();speak(t,()=>{})}
/* Narración por líneas: avanza sola al terminar cada una; "Siguiente" y "Saltar" la controlan */
let NAR=null;
function narrate(lines,onLine,onDone){stopNarration();const r={lines,i:-1,onLine,onDone,cancel:null,tm:0};NAR=r;narNext(r);return r}
function narNext(r){if(!r||NAR!==r)return;if(r.cancel){r.cancel();r.cancel=null}clearTimeout(r.tm);r.i++;
  if(r.i>=r.lines.length){NAR=null;r.onDone&&r.onDone(false);return}
  r.onLine(r.i,false);
  r.cancel=speak(r.lines[r.i],()=>{if(NAR===r)r.tm=setTimeout(()=>narNext(r),700)})}
function narSkip(){const r=NAR;if(!r)return;if(r.cancel)r.cancel();clearTimeout(r.tm);NAR=null;for(let k=r.i+1;k<r.lines.length;k++)r.onLine(k,true);r.onDone&&r.onDone(true)}
function stopNarration(){const r=NAR;NAR=null;if(r){if(r.cancel)r.cancel();clearTimeout(r.tm)}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}if(VAUD){try{VAUD.pause()}catch(e){}VAUD=null}duck(false)}
function typeInto(el,text,instant){clearInterval(el._tt);if(instant||REDUCED){el.textContent=text;return}el.textContent='';let i=0;el._tt=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);if(i>=text.length)clearInterval(el._tt)},28)}

</script>
<script>
/* ---- js/escenas.js ---- */
/* ============ Motor de la escena de estación: cámara, variables, sonido y tesoro ============
   Las escenas se registran en SCENES desde cada campaña (js/campanas/<campaña>/escenas.js):
     SCENES[idEstación] = {secret:[x,y], v0:{…}, flash:{p, on(v)}, draw(c,w,h,t,v), post(c,w,h,t,v)}
       secret = posición del tesoro escondido (fracción del ancho/alto)
       v0     = valores iniciales de las variables animadas (luz, lluvia, mar abierto…)
       flash  = cada p segundos suena un trueno (si on(v) lo permite) */
const SCENES={};
const sceneV0=id=>(SCENES[id]&&SCENES[id].v0)||{};
function drawGlint(c,x,y,t,z){const p=Math.pow(Math.max(0,Math.sin(t*1.25)),10),s=(3.5+9*p)/z;c.save();c.globalAlpha=.2+.8*p;glow(c,x,y,s*3.2,'rgba(255,226,140,.9)');c.fillStyle='#fff6d6';sparkle(c,x,y,s);c.restore()}

let SC=null;
function startScene(id){
  const cv=$('#stage');
  SC={id,cv,ctx:cv.getContext('2d'),def:SCENES[id]||SCENES._vacia,w:0,h:0,t:0,last:performance.now(),burst:-1,v:Object.assign({},sceneV0(id)),vt:Object.assign({},sceneV0(id)),
      camA:{z:1,x:.5,y:.5},camFrom:{z:1,x:.5,y:.5},camTo:{z:1,x:.5,y:.5},camT0:0,camD:0,quake:0,fc:0,updT:0,ambLvl:1,snd:null,dpr:1};
  SC.snd=sceneSound(id,1);
  if(window.ResizeObserver){SC.ro=new ResizeObserver(sizeScene);SC.ro.observe(cv)}else window.addEventListener('resize',sizeScene);
  sizeScene();cv.addEventListener('click',stageClick);SC.raf=requestAnimationFrame(loop);
}
function ambLevel(x){if(!SC)return;SC.ambLvl=x;if(SC.snd&&AU.ctx)SC.snd.bus.gain.setTargetAtTime(x,AU.ctx.currentTime,.6)}
function setCam(a,dur){if(!SC)return;SC.camFrom=Object.assign({},SC.camA);SC.camTo={z:a[0],x:a[1],y:a[2]};SC.camT0=performance.now();SC.camD=REDUCED?0:dur;if(!SC.camD){SC.camFrom=Object.assign({},SC.camTo);SC.camA=Object.assign({},SC.camTo)}}
function camNow(now){const F=SC.camFrom,T=SC.camTo;let p=SC.camD?Math.min(1,(now-SC.camT0)/SC.camD):1;p=ez(p);return{z:F.z+(T.z-F.z)*p,x:F.x+(T.x-F.x)*p,y:F.y+(T.y-F.y)*p}}
function sizeScene(){if(!SC)return;const r=SC.cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);SC.w=r.width;SC.h=r.height;SC.cv.width=Math.max(1,Math.round(r.width*d));SC.cv.height=Math.max(1,Math.round(r.height*d));SC.dpr=d}
function loop(now){
  if(!SC)return;const dt=Math.min(.05,(now-SC.last)/1000);SC.last=now;SC.t+=dt*(REDUCED?.25:1);
  for(const k in SC.vt){const a=SC.v[k]==null?SC.vt[k]:SC.v[k];SC.v[k]=a+(SC.vt[k]-a)*Math.min(1,dt*(REDUCED?6:1.15))}
  const{ctx,w,h,t,def}=SC;
  if(w>0&&h>0){
    const cm=camNow(now);const z=Math.max(1,cm.z);const mn=.5/z;const x=cl(cm.x,mn,1-mn),y=cl(cm.y,mn,1-mn);
    SC.camA={z,x,y};
    let ox=0,oy=0;if(SC.quake>now){const q=(SC.quake-now)/2600;ox=(Math.random()-.5)*9*q;oy=(Math.random()-.5)*9*q}
    ctx.setTransform(SC.dpr,0,0,SC.dpr,0,0);
    ctx.save();ctx.translate(w/2+ox,h/2+oy);ctx.scale(z,z);ctx.translate(-x*w,-y*h);
    try{def.draw(ctx,w,h,t,SC.v)}catch(e){}
    ctx.globalAlpha=1;
    const sx=def.secret[0]*w,sy=def.secret[1]*h;
    if(cur&&cur.mode==='juego'&&!cur.found&&(cur.phase==='ready'||cur.phase==='q'))drawGlint(ctx,sx,sy,t,z);
    if(SC.burst>=0){const b=t-SC.burst;if(b<1.6){for(let k=0;k<3;k++){const q=b-k*.18;if(q>0){ctx.strokeStyle=`rgba(255,226,140,${Math.max(0,1-q/1.2)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,8+q*90,0,TAU);ctx.stroke()}}}else SC.burst=-1}
    ctx.restore();
    if(def.post)try{def.post(ctx,w,h,t,SC.v)}catch(e){}
  }
  if(def.flash){const fc=Math.floor(t/def.flash.p);if(fc!==SC.fc){SC.fc=fc;if((!def.flash.on||def.flash.on(SC.v))&&SC.snd)SC.snd.ev.thunder()}}
  if(SC.snd&&SC.snd.upd&&now-SC.updT>250){SC.updT=now;SC.snd.upd(SC.v)}
  SC.raf=requestAnimationFrame(loop);
}
function stopScene(){if(!SC)return;cancelAnimationFrame(SC.raf);if(SC.ro)SC.ro.disconnect();else window.removeEventListener('resize',sizeScene);stopSnd(SC.snd);SC=null}
function stageClick(e){
  if(!SC||!cur||cur.mode!=='juego'||cur.found||!(cur.phase==='ready'||cur.phase==='q'))return;
  const r=SC.cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,{z,x,y}=SC.camA;
  const wx=(px-SC.w/2)/z+x*SC.w,wy=(py-SC.h/2)/z+y*SC.h,d=SC.def;
  if(Math.hypot(wx-d.secret[0]*SC.w,wy-d.secret[1]*SC.h)>Math.max(24,SC.w*.045)/z)return;

  logro('tesoro1');if(CH.every(c=>S.found[c.id]))logro('tesoros');
  renderQ();
}

<script>

/* ============ Viñetas animadas de los relatos del camino ============
   Cada viñeta es una función (c,w,h,p,t):
     p = avance de la escena de 0 a 1 (sincronizado con la duración del texto narrado)
     t = segundos desde que empezó (para movimientos continuos)
   Las viñetas de cada campaña se agregan a VIGS desde js/campanas/<campaña>/vinetas.js
   y usan la biblioteca de js/dibujo.js. Aquí quedan el motor y el preludio del juego. */
const VIGS={};

/* ============ Motor de viñetas: dibuja la escena actual con fundido desde la anterior ============ */
let VG=null;
function vigStart(){const cv=$('#vig');if(!cv)return;
  VG={cv,ctx:cv.getContext('2d'),buf:document.createElement('canvas'),list:null,k:-1,prev:-1,t0:0,est:4000,fade0:0,w:0,h:0,dpr:1};VG.bctx=VG.buf.getContext('2d');

  if(VG.k>=0&&!instant&&!REDUCED){VG.prev=VG.k;VG.prevT0=VG.t0;VG.prevEst=VG.est;VG.fade0=now}else VG.prev=-1;
  VG.list=list;VG.k=k;VG.t0=now;VG.est=Math.max(3200,1300+list[k].t.length*58)}
function vigDraw(c,item,el,est){const p=REDUCED?1:Math.min(1,el/est);c.save();c.setTransform(VG.dpr,0,0,VG.dpr,0,0);c.globalAlpha=1;try{(VIGS[item.v]||VIGS.void)(c,VG.w,VG.h,p,el/1000)}catch(e){}c.restore()}
function vigLoop(now){if(!VG)return;
  if(VG.w>0&&VG.k>=0){const it=VG.list[VG.k];
    if(VG.prev>=0){const fa=Math.min(1,(now-VG.fade0)/800);
      if(fa>=1){VG.prev=-1;vigDraw(VG.ctx,it,now-VG.t0,VG.est)}
      else{vigDraw(VG.ctx,VG.list[VG.prev],now-VG.prevT0,VG.prevEst);vigDraw(VG.bctx,it,now-VG.t0,VG.est);VG.ctx.save();VG.ctx.setTransform(1,0,0,1,0,0);VG.ctx.globalAlpha=fa;VG.ctx.drawImage(VG.buf,0,0);VG.ctx.restore()}}
    else vigDraw(VG.ctx,it,now-VG.t0,VG.est)}
  VG.raf=requestAnimationFrame(vigLoop)}

pre1(c,w,h,p,t){c.fillStyle=vg(c,h,[[0,'#03050f'],[.65,'#141a38'],[.8,'#2a2340']]);c.fillRect(0,0,w,h);stars(c,w,h,t,.65,Math.round(40+200*seg(p,0,.6)));

  const q=ez(seg(p,.2,.95)),N=60;c.save();c.strokeStyle='rgba(229,176,75,.85)';c.lineWidth=3;c.setLineDash([2,10]);c.lineCap='round';c.beginPath();
  for(let k=0;k<=Math.floor(N*q);k++){const f=k/N,x=lerp(w*.16,w*.62,f)+Math.sin(f*6)*w*.06,y=lerp(h*.95,h*.71,Math.pow(f,.7));k?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.restore();
  glow(c,w*.14,h*.88,h*.1,'rgba(255,200,110,.55)');person(c,w*.13,h*.96,h*.13,{col:'#0a0810',staff:1})},
pre2(c,w,h,p,t){const n=MONT.length,x=Math.min(n-1e-6,p*n),i=Math.floor(x),f=x-i,fade=seg(f,.75,1);
  VIGS[MONT[i]](c,w,h,.9,t);
  if(fade>0&&i<n-1){const d=c.getTransform().a,W=Math.round(w*d),H=Math.round(h*d);MB=MB||document.createElement('canvas');if(MB.width!==W||MB.height!==H){MB.width=W;MB.height=H}
    const b=MB.getContext('2d');b.setTransform(d,0,0,d,0,0);b.globalAlpha=1;VIGS[MONT[i+1]](b,w,h,.9,t);c.save();c.setTransform(1,0,0,1,0,0);c.globalAlpha=fade;c.drawImage(MB,0,0);c.restore()}
  c.fillStyle='rgba(5,6,14,.22)';c.fillRect(0,0,w,h)},
pre3(c,w,h,p,t){c.fillStyle='#030407';c.fillRect(0,0,w,h);const L=ez(seg(p,.05,.7)),cx=w*.47,cy=h*.6;
  glow(c,cx+w*.05,cy-h*.06,h*(.12+.8*L),`rgba(255,190,100,${(.22+.35*L).toFixed(2)})`);
  for(let k=0;k<9;k++){const f=k/8,y=lerp(h*.98,h*.7,f),x=cx+w*.03+Math.sin(f*4)*w*.05,a=Math.max(0,L-f*.6);c.fillStyle=`rgba(150,118,84,${(a*.8).toFixed(2)})`;c.beginPath();c.ellipse(x,y,w*(.06-.04*f),h*(.018-.01*f),0,0,TAU);c.fill()}
  oilLamp(c,cx,cy,w,h,t);lampFlame(c,cx+w*.095,cy-h*.035,h*(.03+.05*seg(p,0,.3)),t);
  caption(c,w,h,'SALMO 119:105',seg(p,.5,.7),.15)},
pre4(c,w,h,p,t){c.fillStyle=vg(c,h,[[0,'#04060f'],[.7,'#141a38'],[1,'#1e1a30']]);c.fillRect(0,0,w,h);stars(c,w,h,t,1,180);
  const a=ez(seg(p,.05,.45)),b=ez(seg(p,.3,.65)),cc=ez(seg(p,.55,.85));
  c.save();c.textAlign='center';c.textBaseline='middle';
  c.globalAlpha=.05+.11*a;c.fillStyle='#e5b04b';c.font=`700 ${Math.round(h*.42)}px "Frank Ruhl Libre","Times New Roman",serif`;c.fillText('ברית',w/2,h*.42);
  c.globalAlpha=b;c.fillStyle='#f3e6c4';c.font=`${Math.round(Math.min(h*.105,w*.075))}px Marcellus, Georgia, serif`;c.fillText('El Camino del Pacto',w/2,h*.44+(1-b)*h*.03);

<script>
/* ---- js/campanas.js ---- */
/* ============ Campañas: paquetes de contenido ============
   Cada campaña (Antiguo Pacto, Nuevo Pacto…) vive en js/campanas/<id>/ y se registra con
   registrarCampana({…}). El motor no sabe cuántas estaciones hay: todo sale de aquí.

   Campaña:
     id, nombre, sello (letras del encabezado), alfabeto (texto para la ventana de insignias)
     titulo         título del recorrido, por ejemplo «Tierras del Antiguo Pacto»
     estaciones     [{id, name, place, book, letter, badge, map:[x,y], intro, shots, outro, teaser…}]
                    una estación con pronto:true solo se ve en el mapa («pronto»): todavía no se juega
     mapas          [{titulo, desde, hasta, arte}]: páginas del mapa (índices de estación) y su dibujo SVG
     relatos        relato del camino que lleva a cada estación (relatos[i] lleva a estaciones[i])
     epilogo        relato que se cuenta al terminar la última estación (opcional)
     logros         insignias que no son de estación: {id, letter, name, desc, tipo, n}
     musica         {scale, prog} para la música generativa (ver audio.js)
     demo           cuántas estaciones trae la edición gratuita (0 = ninguna)
   Las preguntas de cada estación se registran aparte con banco(idEstación, {voces, qs, secretos}).

   EDICION: 'completa' trae todo. build.py --demo la cambia a 'demo' (edición gratuita de la Store):
   cada campaña queda en sus primeras «demo» estaciones y la siguiente se ve como «juego completo». */
const EDICION='demo';
const CAMPANAS=[],BANCO={},QID_BY_HASH={},QBYID={};
function registrarCampana(c){CAMPANAS.push(c)}
function banco(id,b){BANCO[id]=b}
/* Suma preguntas a una estación que ya tiene banco (por ejemplo, las de ordenar y unir de la versión 2) */
function masPreguntas(id,qs){BANCO[id].qs.push(...qs)}
const campana=id=>CAMPANAS.find(c=>c.id===id);
const esDemo=()=>EDICION==='demo';
/* Estaciones jugables de una campaña en esta edición */
const jugables=c=>{const e=c.estaciones.filter(s=>!s.pronto);return esDemo()?e.slice(0,c.demo||0):e};
const campanaAbierta=c=>jugables(c).length>0;

/* Une el banco de preguntas a cada estación y arma la lista de insignias.
   Cada pregunta recibe un identificador según su texto: así se pueden mover o reordenar
   sin perder lo que cada peregrino ya respondió. */
function prepararCampanas(){
  CAMPANAS.forEach(cp=>{
    cp.estaciones.forEach(c=>{const b=BANCO[c.id]||{voces:[''],qs:[],secretos:[]};
      c.qs=b.qs;c.secrets=b.secretos;c.voices=b.voces&&b.voces.length?b.voces:[''];c.camp=cp.id;
      c.qs.forEach(q=>{const h=hash32(q.q);q.id=c.id+'-'+h;QID_BY_HASH[h]=q.id;QBYID[q.id]=q});
      c.secrets.forEach(q=>{const h=hash32(q.q);q.id=c.id+'-s'+h;QID_BY_HASH[h]=q.id;QBYID[q.id]=q})});
    const est=jugables(cp);
    cp.insignias=[...est.map(c=>({id:c.id,letter:c.letter,name:c.badge,desc:`Completa la estación «${c.name}».`,tipo:'estacion'})),
      ...cp.logros.filter(b=>!b.completo||!esDemo())];
  });
}

/* Campaña activa: el resto del juego usa estas variables */
let CAMP=null,CH=[],STOPS=[],TRAVEL=[],BADGES=[];
function usarCampana(id){
  CAMP=campana(id)||CAMPANAS[0];CH=jugables(CAMP);
  /* La estación siguiente aparece en el mapa: «pronto», o como parte del juego completo en la edición gratuita */
  const next=CAMP.estaciones[CH.length];
  STOPS=next?[...CH,Object.assign({},next,{soon:true,completo:!next.pronto})]:CH.slice();
  TRAVEL=CAMP.relatos;BADGES=CAMP.insignias;
  setMusicTheme(CAMP.musica);
  document.body.dataset.camp=CAMP.id;
  const seal=$('#seal');if(seal)seal.textContent=CAMP.sello;
  const sub=$('#subCamp');if(sub)sub.textContent=CAMP.nombre;
}
/* Página del mapa donde está la estación i */
const mapaDe=i=>CAMP.mapas.find(m=>i>=m.desde&&i<=m.hasta)||CAMP.mapas[0];
const iniciaPagina=i=>i===mapaDe(i).desde;

</script>

{title:'Al oriente del Edén',ref:'Génesis 4–6',scenes:[
